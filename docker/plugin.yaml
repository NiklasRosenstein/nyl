# To be put in /home/argocd/cmp-server/config/plugin.yaml
# Read also https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/#sidecar-plugin

apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: nyl
spec:
  version: v2 #  note: Plugin name in ArgoCD is `nyl-v2`.

  generate:
    command:
      - sh
      - -c
      - |
        print_file_not_found_diagnostics() {
          echo "[nyl-debug] ---- begin argocd file-not-found diagnostics ----" >&2
          echo "[nyl-debug] pwd=$(pwd)" >&2
          echo "[nyl-debug] raw_template_input=${RAW_TEMPLATE_INPUT:-<unset>}" >&2
          echo "[nyl-debug] template_input=${TEMPLATE_INPUT:-<unset>}" >&2
          echo "[nyl-debug] source_path=${SOURCE_PATH:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_NAME=${ARGOCD_APP_NAME:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_NAMESPACE=${ARGOCD_APP_NAMESPACE:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_PROJECT_NAME=${ARGOCD_APP_PROJECT_NAME:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_SOURCE_REPO_URL=${ARGOCD_APP_SOURCE_REPO_URL:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_SOURCE_PATH=${ARGOCD_APP_SOURCE_PATH:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_SOURCE_TARGET_REVISION=${ARGOCD_APP_SOURCE_TARGET_REVISION:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_APP_REVISION=${ARGOCD_APP_REVISION:-<unset>}" >&2
          echo "[nyl-debug] env.ARGOCD_ENV_NYL_CMP_TEMPLATE_INPUT=${ARGOCD_ENV_NYL_CMP_TEMPLATE_INPUT:-<unset>}" >&2
          echo "[nyl-debug] env.NYL_CMP_TEMPLATE_INPUT=${NYL_CMP_TEMPLATE_INPUT:-<unset>}" >&2

          echo "[nyl-debug] ls -la ." >&2
          ls -la . >&2 || true

          if [ -n "${SOURCE_PATH:-}" ]; then
            if [ -d "${SOURCE_PATH}" ]; then
              echo "[nyl-debug] ls -la ${SOURCE_PATH}" >&2
              ls -la "${SOURCE_PATH}" >&2 || true
            else
              echo "[nyl-debug] source_path_status=missing-or-not-directory:${SOURCE_PATH}" >&2
            fi
          fi

          SEARCH_ROOT="."
          if [ -n "${SOURCE_PATH:-}" ] && [ -d "${SOURCE_PATH}" ]; then
            SEARCH_ROOT="${SOURCE_PATH}"
          fi
          echo "[nyl-debug] yaml_inventory_root=${SEARCH_ROOT}" >&2
          find "${SEARCH_ROOT}" -maxdepth 3 -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            | sort | head -n 200 | sed 's/^/[nyl-debug] file: /' >&2 || true

          if git rev-parse --show-toplevel >/dev/null 2>&1; then
            echo "[nyl-debug] git.toplevel=$(git rev-parse --show-toplevel)" >&2
            echo "[nyl-debug] git.head=$(git rev-parse --short HEAD)" >&2
          else
            echo "[nyl-debug] git.status=unavailable" >&2
          fi
          echo "[nyl-debug] ---- end argocd file-not-found diagnostics ----" >&2
        }

        TEMPLATE_INPUT="${ARGOCD_ENV_NYL_CMP_TEMPLATE_INPUT:-${NYL_CMP_TEMPLATE_INPUT:-}}"
        RAW_TEMPLATE_INPUT="$TEMPLATE_INPUT"
        SOURCE_PATH="${ARGOCD_APP_SOURCE_PATH:-}"
        if [ -z "$TEMPLATE_INPUT" ]; then
          echo "NYL_CMP_TEMPLATE_INPUT is required. Set it via Application source.plugin.env." >&2
          exit 1
        fi
        case "$TEMPLATE_INPUT" in
          /*) ;;
          *)
            if [ -n "$SOURCE_PATH" ]; then
              TEMPLATE_INPUT="${SOURCE_PATH%/}/$TEMPLATE_INPUT"
            fi
            ;;
        esac
        NYL_STDERR_FILE="$(mktemp)"
        nyl render "$TEMPLATE_INPUT" 2>"$NYL_STDERR_FILE"
        STATUS=$?
        if [ "$STATUS" -eq 0 ]; then
          rm -f "$NYL_STDERR_FILE"
          exit 0
        fi

        cat "$NYL_STDERR_FILE" >&2
        if grep -q "Configuration error: File not found:" "$NYL_STDERR_FILE"; then
          print_file_not_found_diagnostics
        fi
        rm -f "$NYL_STDERR_FILE"
        exit "$STATUS"

  parameters: {}

  # If set to `true` then the plugin receives repository files with original file mode. Dangerous since the repository
  # might have executable files. Set to true only if you trust the CMP plugin authors.
  preserveFileMode: false
