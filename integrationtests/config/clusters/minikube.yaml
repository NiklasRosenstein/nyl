apiVersion: gitops.nyl/v1
kind: Cluster
metadata:
  name: minikube
spec:
  destination:
    server: https://kubernetes.default.svc
  kubernetes:
    kubeVersion: 1.29.0
    apiVersions:
      - admissionregistration.k8s.io/v1
      - apiextensions.k8s.io/v1
      - apps/v1
      - autoscaling/v2
      - batch/v1
      - networking.k8s.io/v1
      - policy/v1
      - rbac.authorization.k8s.io/v1
      - v1
  live:
    context: minikube
