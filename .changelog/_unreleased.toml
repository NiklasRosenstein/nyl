[[entries]]
id = "630f9659-a268-4d91-9f19-383f1f55decf"
type = "fix"
description = "ApplicationGroups with a templated spec that cannot be parsed before rendering, such as `projectTemplate.name: '{{ target.metadata.name }}-web'`, are no longer silently left out of the targets that select them when they write `metadata.labels` in flow style or with a trailing comment (or `metadata: # ...`): targets now select them by the labels the document declares, so existing `render-tree` and `publish-tree` output may gain their Applications, Releases, and AppProject (selection only grows). A group that renders to no document now counts as disabled, so `--application-group` and ignored `releaseInputs` treat it like `enabled: false`. A document that is not valid YAML before rendering and writes labels in a form that cannot be read statically (template syntax among them, anchors, aliases, merge keys, multi-line flow) now fails with an error instead of being read as fewer labels, and a group whose rendered labels differ from its literal ones is rejected"
author = "@NiklasRosenstein"

[[entries]]
id = "8cc38a84-10b3-45dd-8837-a3795fd5925f"
type = "fix"
description = "`OciImage` builds with `load` work with Docker Buildx 0.38, which no longer records the image's configuration digest: the platform is read from the loaded image by its digest"
author = "@NiklasRosenstein"

[[entries]]
id = "d73eec00-08f7-4582-90d0-eab32d080800"
type = "feature"
description = "Orchestration can publish Kubernetes trees: the `KubernetesPublication` unit renders its DeploymentTarget with the `fromUnit` Release inputs (image digests, infrastructure outputs) its environment resolved, publishes the tree and its ownership index to the target's branch with a compare-and-swap push, and tears it down in two phases. Its effective teardown settings are recorded when the unit is resolved, so `status` and `plan` report teardown readiness without rendering. `mode: observe` and inline targets are not available yet"
author = "@NiklasRosenstein"

[[entries]]
id = "fe1f4df2-e59c-4637-a945-a3078b4e23c5"
type = "feature"
description = "A `KubernetesPublication` unit can declare its DeploymentTarget inline (`spec.target.inline`), named `<environment>-<unit>`, and publishes it through the same path as a named target; `nyl validate` compiles it with the other targets. The published ownership index records the owning unit, and a publication or teardown refuses a prefix another existing unit owns (`NYL-KUBERNETES-OWNER-FENCED`, or `NYL-KUBERNETES-OWNER-UNKNOWN` when the owner's state cannot be read). Renaming a publication's target fails with `NYL-KUBERNETES-TARGET-CHANGED` until the unit is replaced with `nyl teardown --unit`. `nyl plan` and `nyl reconcile` warn about unmet teardown requirements and leftovers of every publication that would be torn down. The `observe` teardown wait is rejected until Nyl can read Argo CD"
author = "@NiklasRosenstein"

[[entries]]
id = "6d0a2c1b-4f3e-4b7a-9a52-0e8c5d7b1f34"
type = "feature"
description = "`nyl build` works for `KubernetesPublication` units: it renders the unit's tree as a run does, `nyl build <unit> -- --diff` compares it with the tree published at the destination (files added, modified, or removed, and the unit that owns it), and `-- --push` publishes it only for a target no environment owns, refusing with `NYL-KUBERNETES-BUILD-TARGET-OWNED` or `NYL-TREE-OWNED-BY-UNIT` and the fix otherwise. A unit with an inline target builds only with `-e`"
author = "@NiklasRosenstein"

[[entries]]
id = "b254a321-40dc-43ef-8ebe-c6b720f2c985"
type = "feature"
description = "A `KubernetesPublication` unit that declares `observe: {}` (an object, so options can be added later; only `{}` is accepted, and there is no `mode` field) attests `accepted` and `healthy` through `nyl attest`: it reads the reconciler that runs its target, Argo CD, through a reconciler-neutral reader, so one set of rules judges any reconciler. It reads the target's generated Argo CD Applications, matches each one's running revision (the newest full sync in `status.history`, never OutOfSync) to the publication by Application directory tree, and records each Application's running publication and health in the attestations' details (`deployments`, with the `reconciler` that was read). The `observe` teardown wait works too (the default for a unit that declares `observe`, and a validation error for one that does not), and `NYL-KUBERNETES-MODE-UNSUPPORTED` and `NYL-KUBERNETES-TEARDOWN-WAIT-UNSUPPORTED` are gone. An ArgoCDInstance declares how it is read in `spec.access`: the Kubernetes API of its control-plane Cluster (the default, through the Cluster's `spec.live.context` and the kubeconfig the unit admits as `KUBECONFIG`) or the Argo CD API server (`method: api`, with a token the unit admits as `ARGOCD_AUTH_TOKEN` or the declared `tokenEnv`). An Argo CD that cannot be read makes `nyl attest` report the unit unknown and record nothing, and the removal wait never concludes from Applications the credential could not see. An unchanged attestation is rewritten with its new time once it is 15 minutes old, so `maxAttestationAge` works for a re-verified system"
author = "@NiklasRosenstein"

[[entries]]
id = "8f0cb9fb-4f2d-408d-b8b8-12b80215bf9c"
type = "feature"
description = "Let `dependsOn` entries and `fromUnit` references require a producer's attestations with `evidence: attested` or `attestations`: the consumer stays blocked (`attestation-pending` or `attestation-failing`, with `NYL-ATTESTATION-PENDING` or `NYL-ATTESTATION-FAILING`) until `nyl attest`, or the producer's own `reconcile`, records a pass for its current receipt; naming an attestation the producer does not declare is `NYL-ATTESTATION-UNDECLARED` (replacing `NYL-ATTESTATIONS-UNSUPPORTED`). Requiring an attestation that only an external source supplies (`from: external`), by name or through `evidence: attested`, is `NYL-ATTESTATION-EXTERNAL-UNSUPPORTED` until external attestations can be recorded. A new receipt drops the attestations of the one it replaces, and a report names the producer's environment when a consumer waits for another environment's unit"
author = "@NiklasRosenstein"

[[entries]]
id = "3b6e1d2a-5c7f-4e08-9d41-7a2f6c0b8e15"
type = "feature"
description = "Units can declare observed values (`observations`, with `type`, `maxAge`, and a driver-owned `from`) that their driver reads from the system the unit manages, and other units reference them with `fromUnit: {unit, observation}`. An observed value is an observation of the producer's current receipt, recorded in `observed/units/<unit>/observations.yaml` and dropped with the receipt it was read for. A pending value blocks its consumers (`NYL-OBSERVATION-PENDING`); a changed value makes them execute again without the producer executing. `nyl reconcile` reads every current unit before it resolves its consumers and waits up to `observationWait` after executing one, and the new `nyl observe` reads and records values without executing anything, for jobs that hold read credentials a reconcile lacks, naming the consumers it leaves ready (`NYL-OBSERVATION-CHANGED`); `nyl get observation` prints a recorded value. A `KubernetesPublication` that declares `observe: {}` reads a field of a resource its target renders (`NYL-KUBERNETES-OBSERVATION-UNOWNED` otherwise) from the workload Cluster, through that Cluster's own `spec.live.context` in the admitted `KUBECONFIG`, once the Application that owns the resource runs the receipt's publication. Kinds that read no observed values reject `observations` (`NYL-OBSERVATIONS-UNSUPPORTED`)"
author = "@NiklasRosenstein"

[[entries]]
id = "cced6584-cb1c-4838-b3fb-fdba2a18fd0b"
type = "feature"
description = "Add the `EnvironmentTemplate` resource for preview environments. An instance is created with `nyl state init -e <name> --template <template> --param <name>=<value>`, or by `nyl reconcile --template`, which then reconciles it from its own checkout; it exists only in state (`state.yaml` records the template, its parameters, the source commit, and `expiresAt`), shares one state ref with other instances through `state.path`, and behaves like a declared Environment for `plan`, `reconcile`, `status`, `get`, `attest`, `observe`, `teardown`, `state delete`, and `build`. A plain run renders an instance at its recorded source commit. A template's `deletionPolicy: Teardown` overrides every unit's policy for kinds that support teardown, and `allowTeardown` lets omission teardown proceed unattended. `nyl get environments` lists instances by listing their state; `nyl validate` checks each template through sample instances, so generated Argo CD names, publication prefixes, and state locations that would collide across instances are found early, and every publication render and direct `build --push` includes the instances state lists. New codes: `NYL-INSTANCE-TEMPLATE-UNKNOWN`, `NYL-INSTANCE-PARAMETER-INVALID`, `NYL-INSTANCE-NAME-TAKEN`, `NYL-INSTANCE-TEMPLATE-REQUIRED`, `NYL-INSTANCE-AMBIGUOUS`, and `NYL-TEMPLATE-INVALID`. Expiry removal, `maxInstances`, and the shared catalog are still to come"
author = "@NiklasRosenstein"

[[entries]]
id = "845a0f58-fa1a-4405-9fdb-27a07fb63e2e"
type = "feature"
description = "Add the `tojson` template filter, so a unit document can embed a structured value, such as an Environment's `values.target`, as `target: {{ values.target | tojson }}`"
author = "@NiklasRosenstein"

[[entries]]
id = "b9a5435b-ce4d-4839-b088-9d48112f8bb0"
type = "feature"
description = "Complete the lifecycle of preview instances. Activity extends an instance's `expiresAt` to now plus the template's `ttl`: `state init --template`, `reconcile --template`, and every other `reconcile -e <instance>` unless `--no-extend`; the next reconcile that finds an instance expired removes it (`teardown --all`, then `state delete`, never while a unit still has resources) unless `--renew` or the pull request job's `--template` keeps it, and `reconcile --template <name>` without `-e` is the scheduled fleet job that maintains every live instance at its recorded commit without extending it, removes the expired ones, and reports an instance whose lease is held as `busy`. The removal's teardown needs the template's `allowTeardown` or `--allow-teardown`, and repeats its decision under the lease (`NYL-INSTANCE-REMOVAL-PENDING`, `NYL-INSTANCE-RENEWED`). `maxInstances` is enforced at creation (`NYL-INSTANCE-LIMIT`, exit 2), and `--make-room` removes the oldest expired instances first, only as many as needed. `keepSource: true` is an opt-in (default `false`) for previews that may expire long after their branches are gone: it keeps each instance's recorded source commit fetchable through a ref of its own, `refs/nyl-keep/<keepId>/<commit>` (the id is recorded in `state.yaml`), until `state delete`, and the job then needs push access to `refs/nyl-keep/*` (`NYL-INSTANCE-KEEP-FAILED`); without it, nothing is pushed to the source repository and the pull request closed job tears the instance down. A renewal undoes a removal that was recorded as pending and has not started, and a pull request's `reconcile --template` creates an instance the fleet removed again. `nyl state move --template` moves every instance of a template after its `state` changed, and with `--from-template` records them under a renamed template. `state init --template` warns about unmet teardown requirements and a `manual` `teardownWait` that stops unattended removal (`NYL-TEARDOWN-WAIT-MANUAL`). `status`, `plan`, and `get environments` show expired instances (`NYL-INSTANCE-EXPIRED`); a new operation `state-renew` records the extension; `NYL-INSTANCE-OPTION-INVALID` and `NYL-INSTANCE-NOT-LISTABLE` report options and templates the lifecycle cannot serve"
author = "@NiklasRosenstein"

[[entries]]
id = "5af2a924-6a49-4274-abe0-be4c90afca35"
type = "feature"
description = "A recorded source commit that the entry clone lacks is fetched by its exact id from the clone's `origin`, after the retained snapshots and the instance's keep ref and with the same credentials, so a pull request closed job that checks out the default branch tears a preview down at its recorded commit without `keepSource` or `--source` wherever the host keeps `refs/pull/<n>/head` (GitHub) or `refs/merge-requests/<n>/head` (GitLab) after the branch is deleted. An explicit full commit id passed to `--source` that the clone lacks is fetched the same way. A failed fetch leaves the commit missing as before, and `--local` fetches nothing"
author = "@NiklasRosenstein"

[[entries]]
id = "bf735a33-1dbf-4c41-824f-846aecfdb57d"
type = "feature"
description = "`nyl reconcile -e <instance> --template` and `nyl state init --template` accept `--source-ref <ref>`, a full ref name under `refs/` such as `refs/pull/123/head`, recorded in the instance's `state.yaml` as `sourceRef` next to `sourceCommit` (a run without the flag keeps the recorded one). For a host that will not serve a commit by its id, a later run that lacks the recorded commit and cannot get it by its id or a keep ref fetches that ref by name from `origin` and looks for the recorded commit in it; the ref's tip is never used, and a commit still missing is `NYL-SOURCE-UNAVAILABLE` as before. The ref is checked by its syntax only, with no network access"
author = "@NiklasRosenstein"

[[entries]]
id = "d1401c9a-c0a9-4b63-984d-3b0a7b2520de"
type = "feature"
description = "Add `catalogApplication.shared: {name}` to DeploymentTarget (and a template's inline target): many targets, such as every preview on a branch, share one self-managing catalog Application instead of one per target. Nyl renders it once, from the `shared` block and the ArgoCDInstance's catalog defaults, under the reserved prefix `_nyl/shared/<name>/` with its own ownership index whose owner is the string `catalog:<name>`; each target keeps its own tree and catalog directory without a catalog Application. A target's publication creates the manifest when the branch holds none and never overwrites it, recording `sharedCatalog.result` (`created`, `current`, or `differs`) in its `PublishedTree`; `nyl build <unit> -- --shared-catalog [--diff | --push]` renders, compares, and, as the one writer, replaces it (`NYL-KUBERNETES-BUILD-NO-SHARED-CATALOG` for a target that shares none). Teardown readiness reads the shared Application, a unit never takes a catalog's prefix over, and the rules across targets (one description, one revision, no other catalog or target on that revision, no target prefix in `_nyl/shared`) fail with `NYL-KUBERNETES-SHARED-CATALOG-CONFLICT`. A template instance's units can read declared environments with `fromUnit` and `dependsOn` entries that name an `environment`, and a declared producer is protected against teardown, `state delete --teardown`, and omission while an instance reads it; an instance is a consumer only, so naming one as a producer fails with `NYL-REFERENCE-INSTANCE-PRODUCER`"
author = "@NiklasRosenstein"

[[entries]]
id = "5b0f6c1e-2d94-4f0a-8a57-9c3e1b7a40d2"
type = "feature"
description = "Drivers can report coded warnings with a successful execution (`Outcome::Succeeded` `warnings`), which Nyl records with the receipt and shows in the run report, `plan`, and `status` until the unit executes again; a `KubernetesPublication` warns `NYL-KUBERNETES-SHARED-CATALOG-DIFFERS` when the shared catalog manifest on the branch differs from the one it renders. A shared catalog's teardown readiness follows the manifest on the branch, recorded without keying the unit and read again when a teardown starts. `render-tree`, `publish-tree`, and `diff-tree` now check the shared-catalog rules across targets like `nyl validate` when a project may declare one: a target shares a catalog, a target could not be parsed statically, the project has an EnvironmentTemplate, or a publication unit declares or may declare an inline target (a mapping, a templated name, or a document that is not YAML before rendering). They then render every environment's units, so an unrelated broken unit fails them; projects with only static targets and no templates or inline units are unaffected"
author = "@NiklasRosenstein"

[[entries]]
id = "6efe7756-b86d-47a3-9bc4-258a8c9af4d2"
type = "docs"
description = "Add an end-to-end example to the Orchestration guide: one project with an OciImage, an OpenTofu configuration, a KubernetesPublication, and a preview template, reconciled locally and in GitHub Actions (reconcile on main, `nyl attest` and `nyl observe` with either Argo CD access method, a preview per pull request, its close job, and the scheduled fleet reconcile and shared-catalog writer), with the credentials the units admit and the token a preview job needs for keep refs. M5 is complete: its exit criterion is met by the reference scenarios, which now all run in both tiers with the built-in publication driver"
author = "@NiklasRosenstein"

[[entries]]
id = "1f9d2003-0882-458d-a02c-3d76a7717781"
type = "fix"
description = "`nyl teardown --all --source <revision>` and `nyl state delete --teardown --source <revision>` now take the files of a unit's Git source field from that revision when the stored spec pinned the field to the unit's recorded source commit (an OpenTofu or Terraform `source`, an image `context`), as they already did for the unit's own files, so a lost source commit no longer locks an instance out of removal. Explicit `revision` and `commit` locks and other repositories stay as declared, and the stored spec, its digests, and approvals are unchanged. A teardown that substitutes the recorded commit now warns with `NYL-SOURCE-OVERRIDE`, naming the unit, the recorded commit, and the commit used"
author = "@NiklasRosenstein"

[[entries]]
id = "8549e5cb-c8c8-41ac-bea9-5cf6765ab316"
type = "fix"
description = "`nyl state delete --teardown` prints the warnings of the teardown it ran when the deletion completes, and of its units, such as `NYL-SOURCE-OVERRIDE` for a `--source` substitution or `NYL-UNIT-RELEASED` for an image left in a registry; they were only in the JSON report's `details.teardown`"
author = "@NiklasRosenstein"

[[entries]]
id = "b193513c-6b23-4d55-bb99-f0fe0ee56759"
type = "fix"
description = "Teardown readiness (`NYL-TEARDOWN-NAMESPACE-CONFIRM`) now also blocks an owned Namespace that renders `Prune=confirm`, not only `Delete=confirm`: Argo CD holds an Application's cascade deletion for either, so a group declaring only `namespace: {deletePolicy: Automatic}` stalled a teardown with `applications-remain` while the default `prunePolicy: Confirm` kept the Namespace waiting for confirmation. The finding and its fix name both settings (set `prunePolicy` and `deletePolicy` to `Automatic`, or `deletePolicy` to `Retain`), and readiness reads the rendered sync options so templates and overrides count"
author = "@NiklasRosenstein"

[[entries]]
id = "ace1e9b6-2f4f-4722-8b3c-cb82c9247c39"
type = "feature"
description = "Add a direct reconciler: a DeploymentTarget with `reconciler: {direct: {}}` is applied by Nyl itself through `KubernetesPublication` (publish the tree, then apply each Release with the mechanics of `nyl apply`), generating no Argo CD Application, AppProject, or catalog. Release state records its owning unit and publication, Releases are fenced by owner, `observe: {}` reads the release state and rollout status, and teardown deletes in two phases"
author = "@NiklasRosenstein"

[[entries]]
id = "12d1e950-dfe6-4ee2-89a0-3d1f9e07b489"
type = "feature"
description = "Add `observe: {waitHealthy: {timeout}}` to `KubernetesPublication`: after the publish, `nyl reconcile` polls the target's reconciler with backoff until it is healthy and records the `accepted` and `healthy` attestations, or fails retryably with `NYL-KUBERNETES-HEALTH-TIMEOUT` naming the worst deployment. An Argo CD catalog Application that is not visible yet, as on a first deploy before the operator applies the published tree, is waited for, and the timeout names it and says to apply it"
author = "@NiklasRosenstein"

[[entries]]
id = "45acea14-0e8e-482d-930f-d95e57734ee0"
type = "feature"
description = "Add `--take-over` to `nyl apply`, `nyl release rollback`, and `nyl release delete`; without it they refuse a release an orchestrated unit owns (`NYL-RELEASE-OWNED-BY-UNIT`)"
author = "@NiklasRosenstein"

[[entries]]
id = "d26c5793-ee2d-4c9c-826e-bdd8dc2aa653"
type = "breaking change"
description = "Every command that connects through a Cluster (`nyl apply --target`, `nyl diff --target`, `nyl release list`, `show`, `history`, `rollback`, and `delete` with `--target`, and `nyl capture cluster`) uses the Cluster's declared `live.context` and never the current context once one is declared; without one, the current context is used only when the Cluster's destination server can be verified against it, and an in-cluster or by-name destination needs `--context`"
author = "@NiklasRosenstein"

[[entries]]
id = "96c08d12-ae5e-4be4-97b9-1b04dfcbfd57"
type = "fix"
description = "`nyl release delete` deletes a release's resources in reverse apply order, waiting for each kind to terminate, as a prune does, instead of in one plain loop"
author = "@NiklasRosenstein"

[[entries]]
id = "ef4cda57-f220-4b05-8902-7e16d46a3acd"
type = "fix"
description = "`NYL-KUBERNETES-TARGET-CHANGED` also compares the Cluster a `KubernetesPublication` published for, and the unit's published tree records its reconciler and Cluster"
author = "@NiklasRosenstein"

[[entries]]
id = "a6c115c5-7b48-43d8-adae-ad6f33485a0d"
type = "breaking change"
description = "A DeploymentTarget declares its reconciler explicitly: `spec.reconciler` is required and has exactly one member, `argocd` or `direct`, and a target that omits it fails with `NYL-TARGET-RECONCILER-MISSING`. The top-level `spec.argocdRef` is removed (`NYL-TARGET-ARGOCD-REF-REMOVED`); name the ArgoCDInstance in `reconciler: {argocd: {instanceRef: {name: <instance>}}}`, which stays mandatory once any explicit ArgoCDInstance exists (`NYL-TARGET-ARGOCD-INSTANCE-REF-REQUIRED`), and write `reconciler: {argocd: {}}` for the implicit target-local instance a target without `argocdRef` used to get (naming an instance with none declared is `NYL-TARGET-ARGOCD-INSTANCE-UNDECLARED`; naming both members is `NYL-TARGET-RECONCILER-AMBIGUOUS`). `reconciler: {direct: {}}` is unchanged. The same applies to inline targets (`spec.target.inline`), `nyl init` scaffolds `reconciler: {argocd: {}}`, and `nyl create target` names the project's ArgoCDInstance (`--argocd-instance <name>` is required when several are declared) or takes `--reconciler direct`. Migrate each target: `argocdRef: {name: dev}` becomes `reconciler: {argocd: {instanceRef: {name: dev}}}`, and a target with neither field gains `reconciler: {argocd: {}}`. Published trees and their ownership indexes are unchanged"
author = "@NiklasRosenstein"

[[entries]]
id = "083f441d-6b33-4407-9c01-cb10fe49e34b"
type = "fix"
description = "Teardown readiness (`NYL-TEARDOWN-NAMESPACE-CONFIRM`) resolves `Delete` and `Prune` as Argo CD does: a resource without the option itself takes its Application's `spec.syncPolicy.syncOptions`, so a `Prune=confirm` or `Delete=confirm` that an ApplicationGroup's `syncPolicy.syncOptions` (or a Release's allowed `+syncOptions`) puts on its workload Applications is no longer reported ready while Argo CD holds the deletion, and a resource's own value still wins one option at a time. The finding now covers every rendered resource of a workload Application, not only Namespaces (a resource with `Delete=false`, a CustomResourceDefinition, or `helm.sh/resource-policy: keep` does not hold the deletion), and names the resource or the Application option. The recorded `teardownSettings` list them as `deletionConfirmations` instead of `namespacePrunePolicies`, and `namespaceDeletePolicies` holds each Namespace's effective `Delete`"
author = "@NiklasRosenstein"

[[entries]]
id = "de12f4af-673a-4e7a-a4df-67aa0076f9f4"
type = "fix"
description = "Teardown readiness (`NYL-TEARDOWN-CATALOG-MANUAL-SYNC`) no longer reports a catalog ready that syncs with `prune: true` but cannot prune a removed workload Application: Argo CD's automated sync resolves `Prune` for each pruned Application as its own `argocd.argoproj.io/sync-options` annotation (an ApplicationGroup's `annotations` reach every workload Application), else the catalog's `spec.syncPolicy.syncOptions`, and `Prune=confirm` keeps the whole prune waiting for a confirmation while `Prune=false` skips the Application, so the teardown stalled with the Applications still in the cluster. The finding names the catalog option or the Application, and a shared catalog's pre-teardown check on the branch's manifest holds on it too. `Delete=confirm` on the catalog is not read, because it only applies when the catalog Application itself is deleted, which a teardown does not do. The recorded `teardownSettings` list the holds as `catalogPruneHolds`, and `deletionConfirmations`, only when there are any. An Application's own `Prune` annotation is read even when a parent Application the project writes owns the catalog, because it holds whichever catalog syncs the Application"

[[entries]]
id = "74debda0-d402-4763-9044-75c474a813da"
type = "feature"
description = "`nyl render`, `diff`, `apply`, and `release` work without GitOps configuration: in a project that declares no DeploymentTarget, `--context` selects the kube context, and the Kubernetes version and API versions come from the live cluster. With a declared target, `--context` still only selects how to reach its Cluster. `nyl render --context` is no longer deprecated, and `release` subcommands infer the sole target like `diff` and `apply`"
author = "@NiklasRosenstein"

[[entries]]
id = "c232b073-6c41-4d76-a9f8-c5a3725d238b"
type = "feature"
description = "`nyl argocd resources` lists the resources an Argo CD Application records in `status.resources`, and `nyl argocd purge` deletes them on its destination cluster without generating manifests, for Applications whose source path was removed from Git. A purge deletes only objects carrying the Application's tracking, keeps `Delete=false` and (without `--confirm-delete`) `Delete=confirm` resources, deletes in reverse apply order with foreground propagation, supports `--dry-run` and JSON/YAML reports, and with `--delete-application` removes the Application's finalizers and deletes it after a clean purge"
author = "@NiklasRosenstein"

[[entries]]
id = "b5bdf18c-6ffa-45ac-873c-3ef1ba06c20a"
type = "deprecation"
description = "Nyl's labels, annotations, and Secret types move from `nyl.niklasrosenstein.github.com/` to the `.nyl` API groups: `k8s.nyl/` for release state and Kyverno policies, `k8s.gitops.nyl/` for published catalog provenance. The `nyl.niklasrosenstein.github.com/apply-policy-scope` annotation on Kyverno policies and release state recorded under the old labels stay readable with a warning; new release revisions are recorded under `k8s.nyl/release` and `k8s.nyl/revision`"
author = "@NiklasRosenstein"

[[entries]]
id = "a3e7186c-8ba7-4091-8323-0b79a728ce0c"
type = "breaking change"
description = "Rendered output changes key names: expanded manifests carry `k8s.nyl/parent-api-version`, `k8s.nyl/parent-kind`, `k8s.nyl/parent-name`, and `k8s.nyl/parent-namespace`, and catalog Applications and AppProjects carry `k8s.gitops.nyl/publication-context`. The next publication rewrites them; `diff-tree` and `publish-tree` still read the old publication-context annotation from baselines, with a deprecation warning, until the next publication records the new one"
author = "@NiklasRosenstein"

[[entries]]
id = "a0e3429e-015e-4896-81b9-ff3d854f1b26"
type = "improvement"
description = "The CI image includes Git LFS with its filters configured system-wide, and when `publish-tree --require-clean` finds changed files tracked by Git LFS while Git finds no `git-lfs` executable or no LFS filter configuration, its error explains how to install and configure Git LFS (`git lfs install --local --skip-repo`), including where CI checks the repository out in a separate container. The files still count as changes. The new [Git LFS in CI](https://niklasrosenstein.github.io/nyl/kubernetes-gitops/workflow/publish/#git-lfs-in-ci) section describes the requirement"
author = "@NiklasRosenstein"

[[entries]]
id = "19b76779-1a7b-4ee2-a2f8-1b0c0e9509f0"
type = "feature"
description = "Resources generated by a `HelmChart`, `Component`, or `RemoteManifest` inherit its Argo CD sync wave (`argocd.argoproj.io/sync-wave`) and phase (`argocd.argoproj.io/hook`, with its `argocd.argoproj.io/hook-delete-policy`) unless they declare their own, or Helm hook annotations (`helm.sh/hook-weight`, `helm.sh/hook`) that Argo CD reads instead, through nested expansion and in every command. Rendered output, and published trees, change for expanding resources that declare these annotations"
author = "@NiklasRosenstein"

[[entries]]
id = "29f07fdc-8760-4865-bd6e-a1fc3f23f808"
type = "breaking change"
description = "The stored blocked reasons of a unit change shape in place in the `gitops.nyl/v1` state documents: `readiness.reasons` of a `DesiredUnit` (and of the desired copy an `ObservedUnit` embeds) records a typed `blocker` (the producer with its environment, and the attestation, observed value, planned change, or unavailable producer environment) instead of text under `reason`. This release still reads state written by 0.6.x, text reasons included, and writes the typed form with the next transition that touches a document, but 0.6.x cannot read state written by this release, so every user of a state repository has to upgrade together. A consumer waiting for an observed value of a unit in another environment is now recognized once the value arrives (the producer was read back from text that `<environment>/<unit>` made unreadable): `nyl status -e <consumer environment>` shows it `ready` and `nyl observe -e <producer environment>` names it with `NYL-OBSERVATION-CHANGED`, judged as its own reconcile resolves the reference. Tables, JSON `message` fields, and blocked results show the same text as before; the `blockedBy` entries of a wait on a planned change or an unavailable producer environment now carry the producer and the stable reasons `planned-change` and `producer-unavailable` instead of the text. A `dependsOn` entry that names an invalid unit of another environment is now a resolution error instead of a wait that never ends"
author = "@NiklasRosenstein"

[[entries]]
id = "acca9bc3-f8c7-41a5-bba7-b44f32321cb7"
type = "feature"
description = "`nyl observe -e <env>` and `nyl status -e <env>` name consumers in other environments whose observed input changed. A unit that reads an observed value with `fromUnit: {environment, unit, observation}` and resolved another value than its producer's environment records now is `ready` in `nyl status` of its own environment, and `nyl observe` of the producer's environment warns with `NYL-OBSERVATION-CHANGED`, naming it with its environment (`prod/dns`) and the fix `nyl reconcile -e <consumer environment>`. Reading the other environments' state takes no lease and writes nothing there. `nyl get units` shows the same state. A consumer in another environment that was blocked waiting for a value that now has one is named too (`has a value now`) and shown `ready`, judged as its own reconcile resolves the reference"
author = "@NiklasRosenstein"

[[entries]]
id = "ecf3a67a-425f-4a0c-baf2-4fc17a27ba6e"
type = "feature"
description = "`nyl apply` and the direct reconciler (`KubernetesPublication` with `reconciler: {direct: {}}`) no longer record a release revision when nothing changed: they still apply every resource, which repairs drift, but when the latest revision is `Deployed` and records the same manifest, resource keys, owner, and publication destination, and the apply pruned nothing and failed nothing, that revision stays current and `nyl apply` reports `Release: <name> revision <N> unchanged in namespace <namespace>; no new revision recorded`. A direct apply keeps the older publication commit only while the shared matching still accepts it for the new one (same Release directory and recorded inputs, still on the branch), so `nyl attest` is unaffected. Failed or interrupted revisions, prunes, and `nyl release rollback` always record a revision. Repeated no-op applies no longer push useful revisions out of the history limit"
author = "@NiklasRosenstein"

[[entries]]
id = "9fa47e85-2d1a-4824-89e0-864f42d64cc1"
type = "fix"
description = "A run that dies after a unit executed no longer loses what it recorded for the unit's receipt: run checkpoints carry the attestations the unit reported and the observed values the run read, next to the receipt, and the run or `nyl recover` that imports or accepts the receipt imports them with it, keeping their recorded times. Dependents that require attestations or read an observed value proceed without `nyl attest` or `nyl observe`; records that name another execution key, run, or incarnation than the receipt are dropped. The unit's checkpoint on the run ref is written again when the run reads its observed values, and gains optional `attestations.yaml` and `observations.yaml` files"
author = "@NiklasRosenstein"

[[entries]]
id = "5cc8e33c-10be-4770-8293-6f1304c29aa0"
type = "fix"
description = "A broken other environment affects a command by what the command needs, not by the kind of problem: an environment the command must read (the producer a unit's reference resolves from for `plan`, `reconcile`, `status`, and `get units`, and every other environment when a unit is leaving) is an error with `NYL-STATE-UNAVAILABLE` and its fix, one read only for advice (the scan of `nyl observe` for consumers elsewhere) is a `NYL-STATE-UNAVAILABLE` warning that names it and points to `nyl validate`, and one the command does not read never fails it. A malformed state URL of `prod` no longer fails `nyl reconcile -e dev`, `plan`, `status`, or `observe` with an error that carried no report, `status -e prod` and `get units -e prod` now fail (exit 1) instead of warning when a producer they read is unusable, a reconcile reports a producer's own error instead of a reference to an undeclared environment, a plan or reconcile with no unit leaving no longer fails because another environment's state cannot be read, a template whose state URL cannot be resolved no longer vanishes from instance listing (its instances are unknown, so a leaving unit is kept, `NYL-STATE-UNAVAILABLE`), and `nyl validate` reports a `file://` state URL that names no local path as `NYL-STATE-UNAVAILABLE` and reports every invalid environment declaration in one run"
author = "@NiklasRosenstein"

[[entries]]
id = "1c041a38-22c7-4ec0-bd1b-5ce6d9353e0b"
type = "fix"
description = "`nyl apply`, `nyl release rollback`, and the direct reconciler apply CustomResourceDefinitions first and Namespaces second, ahead of every other kind of the manifest, so a release can define a CRD or a Namespace and the resources that need it and apply in one run (the other kinds keep Argo CD's order, and CRDs were applied in the middle of it). A namespaced custom resource that sets no namespace now takes the destination namespace when its CRD is in the same manifest or its Cluster records the kind (vendored CRDs included), where it was applied with none and rejected. One resolver now decides a kind's scope for the tree, the AppProject derivation, `apply`, `diff`, `release rollback`, and the direct reconciler: the manifest's CRDs, then the target Cluster's recorded capabilities, then the live cluster; a CRD counts when it serves a version, and the later of two CRDs declaring one kind wins. Deriving an AppProject now reads CRDs the same way, so only served versions count: a CRD that lists versions but serves none declares nothing, where its scope used to be read anyway. The built-in kinds are the last declared source, and a stale vendored snapshot takes precedence over the live cluster until `nyl capture cluster --crds` refreshes it; `apply`, `diff`, `release rollback`, and the direct reconciler warn with `NYL-KUBERNETES-SCOPE-MISMATCH`, once per kind, when the recorded scope differs from what the live cluster reports, and still use the recorded one. The wait for a new CRD's kinds to be served (Established) is bounded at 30 seconds instead of about five seconds, and covers only the kinds a CRD declares. The sorted manifest text recorded in a release changed with the new order, so the first apply after upgrading can record one extra revision even when nothing else changed. Pruning and purging delete Namespaces and then CRDs last"
author = "@NiklasRosenstein"

[[entries]]
id = "2d1f7ec3-e843-4da0-8d64-a27a7aff91a1"
type = "feature"
description = "`nyl detect-drift` finds drift of a `KubernetesPublication` unit whose target uses `reconciler: {direct: {}}`: besides comparing the publication branch with the tree, it compares the cluster with what the unit last applied. Per Release it takes the manifest of the newest `Deployed` revision applied for the unit's publication (never the declaration) and compares each object by a server-side apply dry run as Nyl's field manager, so a changed field Nyl manages or a deleted object is `drifted`, naming the Release and the first eight objects, while a field only another manager sets, a Job a `ttlSecondsAfterFinished` removed, and release state of another publication are not drift. A cluster that cannot be read (unreachable, forbidden, a rejected dry run, the unit's deadline) is `unknown`, never `clean`. The next reconcile repairs a drifted unit by applying its Releases again, which keeps the recorded revision when nothing changed in the release state. A direct apply no longer applies again a Job that sets `ttlSecondsAfterFinished`, is gone from the cluster, and has the document the Release's latest `Deployed` revision for the publication holds, so a TTL-removed Job (a migration) does not run again on every reconcile or repair; a Job whose document changed is applied. `nyl diff --target <target>` on the Release's file shows each change in full. The check needs `get` and `patch` (for the dry runs) on the Releases' objects besides read access to the release state Secrets. Objects with Nyl's labels that no revision tracks are not reported"
author = "@NiklasRosenstein"

[[entries]]
id = "0fb1e601-fc9e-4624-bad2-067121c1b313"
type = "feature"
description = "`nyl reconcile --detect-drift` checks the units that are current for drift before it selects what to execute, under the lease the run already holds, and repairs what drifted by each unit's `driftRepair` in the same run: a scheduled job needs one command, with no gap between `nyl detect-drift` and `nyl reconcile`, and the drift records and the new receipts land in one transition commit. The check is `detect-drift`'s own (same driver call, drift record, and settling), and the fresh records go through the one selection rule, so a drifted unit is executed, left `awaiting-approval`, or left `drifted` under `driftRepair: manual` exactly as the next reconcile would decide. Units that execute anyway, because their inputs changed, and kinds that cannot detect drift are not checked, and `--unit` limits the check to the named units (and reports a named kind that cannot detect drift as `unsupported`). Each checked unit's report entry and commit summary carry `driftCheck` (`clean`, `drifted`, `unknown`, or `unsupported`); drift the run did not repair warns with `NYL-DRIFT-DETECTED`, a check that cannot tell (`NYL-DRIFT-UNKNOWN`) makes the run exit 2 as `detect-drift` does, and a check that fails (`NYL-DRIVER-ERROR`) exits 1 without repairing the unit on its stored record. `--detect-drift` is refused with `--leaving` and `--reapply` (`NYL-DRIFT-OPTION-INVALID`, exit 1). Without the flag a reconcile still never detects drift"
author = "@NiklasRosenstein"

[[entries]]
id = "7bec50f7-f84a-4fd0-bb22-aaad05fac3a6"
type = "feature"
description = "`nyl apply`, `nyl release rollback`, and the direct reconciler (`reconciler: {direct: {}}`, applied by a `KubernetesPublication` unit) run resource hooks the way Argo CD syncs the same manifests, so a Release behaves the same under either reconciler (closes #67). `argocd.argoproj.io/hook` takes `PreSync`, `Sync`, `PostSync`, `SyncFail`, and `Skip`, and Helm hooks map as Argo CD maps them (`pre-install` and `pre-upgrade` to `PreSync`, `post-install` and `post-upgrade` to `PostSync`, `crd-install` is an ordinary resource; an Argo CD hook annotation wins). `PreSync` hooks complete (a Job completed, a Pod succeeded) before the resources apply, the `Sync` phase applies resources and `Sync` hooks by sync wave (`argocd.argoproj.io/sync-wave`, else `helm.sh/hook-weight`, then kind, then name), and `PostSync` hooks run after the workloads are healthy and the Release is pruned; a failed hook fails the revision, and `SyncFail` hooks then run. Sync waves now order ordinary resources too, and the workloads of a wave are healthy before the next wave starts. Delete policies (`argocd.argoproj.io/hook-delete-policy`, `helm.sh/hook-delete-policy`) work as in Argo CD: `BeforeHookCreation` (the default) deletes an existing hook in the foreground and waits for it before creating it, `HookSucceeded` and `HookFailed` delete it after a good or failed sync. Every apply runs the hooks of its Release, including one that changes nothing and records no revision, and every execution of a direct unit does. Hooks are recorded in the revision's manifest, so a rollback runs them again, but they are not tracked: they are never pruned, never compared by `nyl detect-drift`, and never read as a workload by the health reading, so a hook that is gone is no drift; `nyl release delete --purge`, a teardown, and the purge of a Release that left the tree delete the hooks the latest revision's manifest holds with the rest of the Release. A Namespace or CustomResourceDefinition applies in the step of its first dependent, a hook included, when that comes earlier (Argo CD's `adjustDeps`), so a custom resource of an early sync wave keeps its CRD and Namespace first. Hooks are created with Argo CD's hook finalizer, which is removed once the sync has seen how the hook ended, so a hook Job a `ttlSecondsAfterFinished` removes the moment it finishes does not fail the sync; an interrupted sync removes it from the hooks it left running. A hook that is an Argo Workflow follows its `status.phase`, and a paused Deployment used as a hook is waited for. Hooks with no sync phase (Helm `test`, `pre-delete`, `post-delete`, `pre-rollback`, `post-rollback`, Argo CD `PreDelete` and `PostDelete`) are left out of the apply; the delete hooks among them, which Nyl never runs when it removes a Release, get the warning `NYL-KUBERNETES-HOOK-IGNORED` once per Release (`nyl release delete` warns too), while Helm's `test` and the rollback hooks are left out silently, as in Argo CD, and `nyl diff` lists them for information. `nyl diff` lists the hooks that would run in their own section, in order, and counts none of them as a change or in the `--exit-code` status. `--hook-timeout <SECONDS>` (default 600, `0` waits until interrupted) bounds the waits of `nyl apply` and `nyl release rollback`; the direct unit bounds its waits by its deadline less a margin of at most thirty seconds, so a hook that hangs fails the sync through its normal failure path (`SyncFail` hooks, `HookFailed` deletion, the revision recorded `Failed`) before the deadline interrupts"
author = "@NiklasRosenstein"

[[entries]]
id = "bd583107-810b-435a-83c0-680f3660bed3"
type = "breaking"
description = "A document with a hook annotation (`argocd.argoproj.io/hook`, `helm.sh/hook`) is no longer applied, tracked, pruned, and compared like an ordinary resource by `nyl apply`, `nyl release rollback`, and the direct reconciler. It runs in its sync phase and is not tracked, so an earlier revision's tracked hook is not pruned (nothing deletes it for being untracked) and `nyl detect-drift` ignores it. Documents `Skip`ped by the hook annotation and hooks without a sync phase (Helm `test` and the delete and rollback hooks) are no longer applied at all, and Helm `crd-install` documents are ordinary resources. A Release that sets `argocd.argoproj.io/sync-wave` or `helm.sh/hook-weight` on ordinary resources is now applied wave by wave, each wave healthy before the next, where it was applied in kind order alone"
author = "@NiklasRosenstein"

[[entries]]
id = "9113f492-572f-4046-992a-f193cfd3e7e6"
type = "feature"
description = "A HelmChart that declares `spec.lookup: {}` renders with Helm's `lookup` reading the objects of its Release from the target's last publication, so a chart that reuses what it generated earlier, such as Cilium's CA, keeps it however cold the render cache is. Nyl serves a read-only Kubernetes API on 127.0.0.1 for the duration of the chart's render and runs `helm template --dry-run=server` against it; Helm gets no cluster or credentials, and `lookup` sees only the objects of the Release being rendered (the files its ownership index lists beneath `<group output>/<release>/` at the publication base commit). Before the Release is published, or without a target, nothing is found and the chart generates. `render`, `diff`, `apply`, `render-tree`, `diff-tree`, and `publish-tree` read the same publication, each lookup is recorded as a render cache input, and a cached render is reused only while every lookup returns the same result. An unreadable or corrupt publication fails with `NYL-HELM-LOOKUP-SNAPSHOT-UNAVAILABLE` instead of reading as absent, and a rendered or looked-up kind that no declaration lists with `NYL-HELM-LOOKUP-API-VERSION-UNDECLARED` or `NYL-HELM-LOOKUP-KIND-UNDECLARED`. A render with `lookup` lists the same built-in kinds, the declared `group/version/Kind` entries, and the chart's own `crds/` kinds to Helm whatever the publication holds, so `.Capabilities` is the same on the first render of a Release and on every later one; a custom resource kind that no `crds/` defines needs a declared `group/version/Kind`. `--refresh-lookup <Kind/namespace/name>` treats one object as absent for one render, which rotates a generated object"
author = "@NiklasRosenstein"
