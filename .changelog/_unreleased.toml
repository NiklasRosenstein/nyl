[[entries]]
id = "630f9659-a268-4d91-9f19-383f1f55decf"
type = "fix"
description = "ApplicationGroups with a templated spec that cannot be parsed before rendering, such as `projectTemplate.name: '{{ target.metadata.name }}-web'`, are no longer silently left out of the targets that select them when they write `metadata.labels` in flow style or with a trailing comment (or `metadata: # ...`): targets now select them by the labels the document declares, so existing `render-tree` and `publish-tree` output may gain their Applications, Releases, and AppProject (selection only grows). A group that renders to no document now counts as disabled, so `--application-group` and ignored `releaseInputs` treat it like `enabled: false`. A document that is not valid YAML before rendering and writes labels in a form that cannot be read statically (template syntax among them, anchors, aliases, merge keys, multi-line flow) now fails with an error instead of being read as fewer labels, and a group whose rendered labels differ from its literal ones is rejected"
author = "@NiklasRosenstein"

[[entries]]
id = "8cc38a84-10b3-45dd-8837-a3795fd5925f"
type = "fix"
description = "`OciImage` builds with `load` work with Docker Buildx 0.38, which no longer records the image's configuration digest: the platform is read from the loaded image by its digest"
author = "@NiklasRosenstein"

[[entries]]
id = "d73eec00-08f7-4582-90d0-eab32d080800"
type = "feature"
description = "Orchestration can publish Kubernetes trees: the `KubernetesPublication` unit renders its DeploymentTarget with the `fromUnit` Release inputs (image digests, infrastructure outputs) its environment resolved, publishes the tree and its ownership index to the target's branch with a compare-and-swap push, and tears it down in two phases. Its effective teardown settings are recorded when the unit is resolved, so `status` and `plan` report teardown readiness without rendering. `mode: observe` and inline targets are not available yet"
author = "@NiklasRosenstein"

[[entries]]
id = "fe1f4df2-e59c-4637-a945-a3078b4e23c5"
type = "feature"
description = "A `KubernetesPublication` unit can declare its DeploymentTarget inline (`spec.target.inline`), named `<environment>-<unit>`, and publishes it through the same path as a named target; `nyl validate` compiles it with the other targets. The published ownership index records the owning unit, and a publication or teardown refuses a prefix another existing unit owns (`NYL-KUBERNETES-OWNER-FENCED`, or `NYL-KUBERNETES-OWNER-UNKNOWN` when the owner's state cannot be read). Renaming a publication's target fails with `NYL-KUBERNETES-TARGET-CHANGED` until the unit is replaced with `nyl teardown --unit`. `nyl plan` and `nyl reconcile` warn about unmet teardown requirements and leftovers of every publication that would be torn down. The `observe` teardown wait is rejected until Nyl can read Argo CD"
author = "@NiklasRosenstein"

[[entries]]
id = "6d0a2c1b-4f3e-4b7a-9a52-0e8c5d7b1f34"
type = "feature"
description = "`nyl build` works for `KubernetesPublication` units: it renders the unit's tree as a run does, `nyl build <unit> -- --diff` compares it with the tree published at the destination (files added, modified, or removed, and the unit that owns it), and `-- --push` publishes it only for a target no environment owns, refusing with `NYL-KUBERNETES-BUILD-TARGET-OWNED` or `NYL-TREE-OWNED-BY-UNIT` and the fix otherwise. A unit with an inline target builds only with `-e`"
author = "@NiklasRosenstein"

[[entries]]
id = "b254a321-40dc-43ef-8ebe-c6b720f2c985"
type = "feature"
description = "A `KubernetesPublication` unit that declares `observe: {}` (an object, so options can be added later; only `{}` is accepted, and there is no `mode` field) attests `accepted` and `healthy` through `nyl attest`: it reads the reconciler that runs its target, Argo CD, through a reconciler-neutral reader, so one set of rules judges any reconciler. It reads the target's generated Argo CD Applications, matches each one's running revision (the newest full sync in `status.history`, never OutOfSync) to the publication by Application directory tree, and records each Application's running publication and health in the attestations' details (`deployments`, with the `reconciler` that was read). The `observe` teardown wait works too (the default for a unit that declares `observe`, and a validation error for one that does not), and `NYL-KUBERNETES-MODE-UNSUPPORTED` and `NYL-KUBERNETES-TEARDOWN-WAIT-UNSUPPORTED` are gone. An ArgoCDInstance declares how it is read in `spec.access`: the Kubernetes API of its control-plane Cluster (the default, through the Cluster's `spec.live.context` and the kubeconfig the unit admits as `KUBECONFIG`) or the Argo CD API server (`method: api`, with a token the unit admits as `ARGOCD_AUTH_TOKEN` or the declared `tokenEnv`). An Argo CD that cannot be read makes `nyl attest` report the unit unknown and record nothing, and the removal wait never concludes from Applications the credential could not see. An unchanged attestation is rewritten with its new time once it is 15 minutes old, so `maxAttestationAge` works for a re-verified system"
author = "@NiklasRosenstein"

[[entries]]
id = "8f0cb9fb-4f2d-408d-b8b8-12b80215bf9c"
type = "feature"
description = "Let `dependsOn` entries and `fromUnit` references require a producer's attestations with `evidence: attested` or `attestations`: the consumer stays blocked (`attestation-pending` or `attestation-failing`, with `NYL-ATTESTATION-PENDING` or `NYL-ATTESTATION-FAILING`) until `nyl attest`, or the producer's own `reconcile`, records a pass for its current receipt; naming an attestation the producer does not declare is `NYL-ATTESTATION-UNDECLARED` (replacing `NYL-ATTESTATIONS-UNSUPPORTED`). Requiring an attestation that only an external source supplies (`from: external`), by name or through `evidence: attested`, is `NYL-ATTESTATION-EXTERNAL-UNSUPPORTED` until external attestations can be recorded. A new receipt drops the attestations of the one it replaces, and a report names the producer's environment when a consumer waits for another environment's unit"
author = "@NiklasRosenstein"

[[entries]]
id = "3b6e1d2a-5c7f-4e08-9d41-7a2f6c0b8e15"
type = "feature"
description = "Units can declare observed values (`observations`, with `type`, `maxAge`, and a driver-owned `from`) that their driver reads from the system the unit manages, and other units reference them with `fromUnit: {unit, observation}`. An observed value is an observation of the producer's current receipt, recorded in `observed/units/<unit>/observations.yaml` and dropped with the receipt it was read for. A pending value blocks its consumers (`NYL-OBSERVATION-PENDING`); a changed value makes them execute again without the producer executing. `nyl reconcile` reads every current unit before it resolves its consumers and waits up to `observationWait` after executing one, and the new `nyl observe` reads and records values without executing anything, for jobs that hold read credentials a reconcile lacks, naming the consumers it leaves ready (`NYL-OBSERVATION-CHANGED`); `nyl get observation` prints a recorded value. A `KubernetesPublication` that declares `observe: {}` reads a field of a resource its target renders (`NYL-KUBERNETES-OBSERVATION-UNOWNED` otherwise) from the workload Cluster, through that Cluster's own `spec.live.context` in the admitted `KUBECONFIG`, once the Application that owns the resource runs the receipt's publication. Kinds that read no observed values reject `observations` (`NYL-OBSERVATIONS-UNSUPPORTED`)"
author = "@NiklasRosenstein"

[[entries]]
id = "cced6584-cb1c-4838-b3fb-fdba2a18fd0b"
type = "feature"
description = "Add the `EnvironmentTemplate` resource for preview environments. An instance is created with `nyl state init -e <name> --template <template> --param <name>=<value>`, or by `nyl reconcile --template`, which then reconciles it from its own checkout; it exists only in state (`state.yaml` records the template, its parameters, the source commit, and `expiresAt`), shares one state ref with other instances through `state.path`, and behaves like a declared Environment for `plan`, `reconcile`, `status`, `get`, `attest`, `observe`, `teardown`, `state delete`, and `build`. A plain run renders an instance at its recorded source commit. A template's `deletionPolicy: Teardown` overrides every unit's policy for kinds that support teardown, and `allowTeardown` lets omission teardown proceed unattended. `nyl get environments` lists instances by listing their state; `nyl validate` checks each template through sample instances, so generated Argo CD names, publication prefixes, and state locations that would collide across instances are found early, and every publication render and direct `build --push` includes the instances state lists. New codes: `NYL-INSTANCE-TEMPLATE-UNKNOWN`, `NYL-INSTANCE-PARAMETER-INVALID`, `NYL-INSTANCE-NAME-TAKEN`, `NYL-INSTANCE-TEMPLATE-REQUIRED`, `NYL-INSTANCE-AMBIGUOUS`, and `NYL-TEMPLATE-INVALID`. Expiry removal, `maxInstances`, and the shared catalog are still to come"
author = "@NiklasRosenstein"

[[entries]]
id = "845a0f58-fa1a-4405-9fdb-27a07fb63e2e"
type = "feature"
description = "Add the `tojson` template filter, so a unit document can embed a structured value, such as an Environment's `values.target`, as `target: {{ values.target | tojson }}`"
author = "@NiklasRosenstein"

[[entries]]
id = "b9a5435b-ce4d-4839-b088-9d48112f8bb0"
type = "feature"
description = "Complete the lifecycle of preview instances. Activity extends an instance's `expiresAt` to now plus the template's `ttl`: `state init --template`, `reconcile --template`, and every other `reconcile -e <instance>` unless `--no-extend`; the next reconcile that finds an instance expired removes it (`teardown --all`, then `state delete`, never while a unit still has resources) unless `--renew` or the pull request job's `--template` keeps it, and `reconcile --template <name>` without `-e` is the scheduled fleet job that maintains every live instance at its recorded commit without extending it, removes the expired ones, and reports an instance whose lease is held as `busy`. The removal's teardown needs the template's `allowTeardown` or `--allow-teardown`, and repeats its decision under the lease (`NYL-INSTANCE-REMOVAL-PENDING`, `NYL-INSTANCE-RENEWED`). `maxInstances` is enforced at creation (`NYL-INSTANCE-LIMIT`, exit 2), and `--make-room` removes the oldest expired instances first, only as many as needed. `keepSource: true` is an opt-in (default `false`) for previews that may expire long after their branches are gone: it keeps each instance's recorded source commit fetchable through a ref of its own, `refs/nyl-keep/<keepId>/<commit>` (the id is recorded in `state.yaml`), until `state delete`, and the job then needs push access to `refs/nyl-keep/*` (`NYL-INSTANCE-KEEP-FAILED`); without it, nothing is pushed to the source repository and the pull request closed job tears the instance down. A renewal undoes a removal that was recorded as pending and has not started, and a pull request's `reconcile --template` creates an instance the fleet removed again. `nyl state move --template` moves every instance of a template after its `state` changed, and with `--from-template` records them under a renamed template. `state init --template` warns about unmet teardown requirements and a `manual` `teardownWait` that stops unattended removal (`NYL-TEARDOWN-WAIT-MANUAL`). `status`, `plan`, and `get environments` show expired instances (`NYL-INSTANCE-EXPIRED`); a new operation `state-renew` records the extension; `NYL-INSTANCE-OPTION-INVALID` and `NYL-INSTANCE-NOT-LISTABLE` report options and templates the lifecycle cannot serve"
author = "@NiklasRosenstein"

[[entries]]
id = "5af2a924-6a49-4274-abe0-be4c90afca35"
type = "feature"
description = "A recorded source commit that the entry clone lacks is fetched by its exact id from the clone's `origin`, after the retained snapshots and the instance's keep ref and with the same credentials, so a pull request closed job that checks out the default branch tears a preview down at its recorded commit without `keepSource` or `--source` wherever the host keeps `refs/pull/<n>/head` (GitHub) or `refs/merge-requests/<n>/head` (GitLab) after the branch is deleted. An explicit full commit id passed to `--source` that the clone lacks is fetched the same way. A failed fetch leaves the commit missing as before, and `--local` fetches nothing"
author = "@NiklasRosenstein"

[[entries]]
id = "bf735a33-1dbf-4c41-824f-846aecfdb57d"
type = "feature"
description = "`nyl reconcile -e <instance> --template` and `nyl state init --template` accept `--source-ref <ref>`, a full ref name under `refs/` such as `refs/pull/123/head`, recorded in the instance's `state.yaml` as `sourceRef` next to `sourceCommit` (a run without the flag keeps the recorded one). For a host that will not serve a commit by its id, a later run that lacks the recorded commit and cannot get it by its id or a keep ref fetches that ref by name from `origin` and looks for the recorded commit in it; the ref's tip is never used, and a commit still missing is `NYL-SOURCE-UNAVAILABLE` as before. The ref is checked by its syntax only, with no network access"
author = "@NiklasRosenstein"

[[entries]]
id = "d1401c9a-c0a9-4b63-984d-3b0a7b2520de"
type = "feature"
description = "Add `catalogApplication.shared: {name}` to DeploymentTarget (and a template's inline target): many targets, such as every preview on a branch, share one self-managing catalog Application instead of one per target. Nyl renders it once, from the `shared` block and the ArgoCDInstance's catalog defaults, under the reserved prefix `_nyl/shared/<name>/` with its own ownership index whose owner is the string `catalog:<name>`; each target keeps its own tree and catalog directory without a catalog Application. A target's publication creates the manifest when the branch holds none and never overwrites it, recording `sharedCatalog.result` (`created`, `current`, or `differs`) in its `PublishedTree`; `nyl build <unit> -- --shared-catalog [--diff | --push]` renders, compares, and, as the one writer, replaces it (`NYL-KUBERNETES-BUILD-NO-SHARED-CATALOG` for a target that shares none). Teardown readiness reads the shared Application, a unit never takes a catalog's prefix over, and the rules across targets (one description, one revision, no other catalog or target on that revision, no target prefix in `_nyl/shared`) fail with `NYL-KUBERNETES-SHARED-CATALOG-CONFLICT`. A template instance's units can read declared environments with `fromUnit` and `dependsOn` entries that name an `environment`, and a declared producer is protected against teardown, `state delete --teardown`, and omission while an instance reads it; an instance is a consumer only, so naming one as a producer fails with `NYL-REFERENCE-INSTANCE-PRODUCER`"
author = "@NiklasRosenstein"
