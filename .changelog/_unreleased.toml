[[entries]]
id = "6f19ee07-712c-43aa-b040-58f496aa4cb5"
type = "feature"
description = "Components can use Helm `lookup`: a local component enables it for every invocation with `lookup: true` in its `nyl-component.yaml`, and the annotation `k8s.nyl/helm-lookup: \"true\"` or `\"false\"` on a Component overrides it, including for remote shortcuts and aliases. It reads the Release's objects exactly as `spec.lookup` does. Any other annotation value fails with `NYL-HELM-LOOKUP-ANNOTATION-INVALID`; a HelmChart takes `spec.lookup` and rejects the annotation with `NYL-HELM-LOOKUP-ANNOTATION-MISPLACED`"
author = "@NiklasRosenstein"

[[entries]]
id = "7cd64f65-1aae-48bd-abea-190ebb632ffc"
type = "feature"
description = "A chart whose templates call Helm's `lookup`, in the chart, its subcharts (unpacked or `.tgz`), or library charts, warns with `NYL-HELM-LOOKUP-UNDECLARED` when lookup is neither enabled nor disabled. `spec.lookup: false`, the annotation `k8s.nyl/helm-lookup: \"false\"`, and `lookup: false` in `nyl-component.yaml` render without lookup and silence it. Detection scans template sources, so it is a heuristic"
author = "@NiklasRosenstein"

[[entries]]
id = "64ea32f9-6556-4764-9e17-b141ef8f4310"
type = "breaking"
description = "HelmChart `spec.lookup` is a boolean: write `spec.lookup: true` (or `false` to opt out). The object form `spec.lookup: {}` from 0.7.0 is removed and fails with `NYL-HELM-LOOKUP-OBJECT-REMOVED`"
author = "@NiklasRosenstein"

[[entries]]
id = "11b756bf-dca5-42d1-854e-dc92b7e342c5"
type = "feature"
description = "The `PromotionPath` resource (`gitops.nyl/v1`) declares how an environment's source commit and selected values move into another environment: `from`, `to`, `evidence`, `attestations`, `maxAttestationAge`, `verifyArtifacts`, `coverage`, and named `values` with `select` forms. `nyl validate` and `nyl plan` check every path against the environments' units with stable codes and fixes (`NYL-PROMOTE-ENVIRONMENT-UNKNOWN`, `NYL-PROMOTE-SELECTOR-UNIT`, `NYL-PROMOTE-SELECTOR-INVALID`, `NYL-PROMOTE-VALUE-TYPE`, `NYL-PROMOTE-BINDING-UNKNOWN`, `NYL-ATTESTATION-UNDECLARED`), and reject `changeGate: pullRequest` and a DeploymentTarget in `from` or `to` with `NYL-PROMOTE-UNSUPPORTED`, which names M11. `nyl get promotion-paths` lists them. `nyl promote` follows in a later change"
author = "@NiklasRosenstein"

[[entries]]
id = "3df60286-ffad-476d-a4d4-03fc7983e5a5"
type = "feature"
description = "State gains the `PromotionRecord` kind at `desired/promotions/<path>.yaml`, added to format `v1` without a version bump: snapshots read it, and `nyl state move` (when it copies documents) and `nyl state restore` carry and roll it back. A Nyl older than this release keeps the file but cannot act on it, so it must not run `reconcile` in an environment that uses promotion, and its copying `state move` drops the file while its `state restore` leaves it as it is. An Environment's `source.promotion.promoted` block is typed as the same record"
author = "@NiklasRosenstein"

[[entries]]
id = "288d2a8c-3024-4f49-86c0-80e34b85d2b3"
type = "feature"
description = "`nyl attest -e <env> [--unit <u>] --name <n> --result pass|fail [--reason …] [--url …]` records an external attestation for the unit's current receipt, or without `--unit` for the environment's current state, under the lease (`--wait-lease`). The name must be declared with `from: external` in the unit's `spec.attestations`, or in the Environment's `spec.attestations`; anything else exits 1 with `NYL-ATTESTATION-UNDECLARED`. The attester is recorded like an approver (`--attested-by`, `--attestation-source`, the approval lookup, CI, or the Git user). Recording exits 0 whether the result passes or fails; the driver form keeps exit 3 for a failing attestation. A dependent can now require an external attestation, so `NYL-ATTESTATION-EXTERNAL-UNSUPPORTED` is retired. Environment-wide attestations live in `observed/attestations.yaml`, added to format `v1` without a version bump: snapshots, `nyl state move` (when it copies documents), and `nyl state restore` carry and roll it back. A Nyl older than this release keeps the file through its transitions but cannot read or write it, its copying `state move` drops it, and its `state restore` leaves it as it is"
author = "@NiklasRosenstein"

[[entries]]
id = "6c55962f-de90-4e71-9809-ed0e0a587956"
type = "feature"
description = "`nyl promote <path> [--value …] [--dry-run] [--reason …] [--revision …] [--state-revision …] [--evidence published] [--ignore-attestation <scope>/<name>=<reason>] [--no-verify-artifacts] [--wait-lease …]` records what the path's source environment proved as a `PromotionRecord` in the target's desired state: one desired commit under the target's lease, with a summary naming the path, sequence, and source state. It only reads the source's state. Promoting the state the path's record already names writes nothing (`outcome: unchanged`). `--dry-run` takes no lease, writes nothing, and reports the record under a top-level `record`. The record's `sequence` comes from the target's desired history, so `nyl state restore` never reuses one. Evidence that is missing, stale, or failing is exit 2 with `NYL-PROMOTE-NO-EVIDENCE`"
author = "@NiklasRosenstein"

[[entries]]
id = "13a7765e-e90b-42e6-a9d4-7be6bcd0b3e3"
type = "feature"
description = "An Environment can take its source from a promotion (`source.promotion` with `record: state`): it runs at the source commit of the newest record on its path or paths and records `sourceChosenBy: promotion` and `appliedPromotionSequence`. A path with no record yet exits 2 with `NYL-PROMOTION-MISSING`, naming `nyl promote <path>`. `{$fromPromotion: {value, path?}}` bindings now resolve in unit specs and in a DeploymentTarget's `releaseInputs` through the shared binding resolver, and block their consumer until a record carries the value"
author = "@NiklasRosenstein"

[[entries]]
id = "65f3ea0d-9a7c-433e-bf99-1c8f168436f5"
type = "feature"
description = "`nyl promote` checks that every artifact a promoted value reads still exists, through the producing driver's new `verify_artifact` capability (`docker buildx imagetools inspect` for `OciImage`), and refuses a missing one with `NYL-PROMOTE-ARTIFACT-MISSING`. `--no-verify-artifacts` and a path's `verifyArtifacts: false` skip the check and the record says `artifactsVerified: false`. A kind that cannot verify warns with `NYL-PROMOTE-ARTIFACT-UNVERIFIED`"
author = "@NiklasRosenstein"

[[entries]]
id = "d7283997-e441-42de-bda2-c4d6da0a1e8a"
type = "fix"
description = "`nyl validate` reports a failing DeploymentTarget compile together with invalid units and PromotionPaths instead of stopping at the target, so a path whose source Environment was removed is named next to the target that no environment places any more; `nyl get --state-revision` pairs the other state ref's commit by `Nyl-Run-Id`, so a state whose commits share a second is read whole"
author = "@NiklasRosenstein"

[[entries]]
id = "851f8906-0f64-4ac7-879a-066975840ff0"
type = "feature"
description = "`nyl get states -e <env>` lists an environment's recorded states, newest first, with each state's desired, observed, and source commits, which units have a current receipt, and the attestations recorded for it. `nyl get promotion-candidates <path>` judges the path's source states with the rules `nyl promote` uses: the level each reaches, what it lacks, the values it would carry, the state `nyl promote` would take now or the code it would refuse with, and the state the path's record already names. `nyl get promotions -e <env>` lists the environment's PromotionRecords, the one its last run applied, and every promotion in its desired history. Each prints text, or a typed `StatesReport`, `PromotionCandidatesReport`, or `PromotionsReport` with `-o json`"
author = "@NiklasRosenstein"

[[entries]]
id = "6d690e8a-824e-427a-bd46-220c16cc2f0e"
type = "feature"
description = "`nyl status` shows the promotion lineage of an environment whose source a promotion chose: the path and sequence of the applied record, its source commit, the source state it promoted, and a newer record waiting for the next reconcile (`promotion: {path, sequence, sourceCommit, from, pendingSequence}` in JSON)"
author = "@NiklasRosenstein"

[[entries]]
id = "cbfd4925-827d-4ac2-9744-34de3b57f085"
type = "feature"
description = "An Environment with `source.promotion.record: source` keeps its PromotionRecord in its own source: `nyl promote` writes the `promoted` block (the same record shape as in state) as one commit on the branch the entry worktree has checked out, carrying only the Environment's file, authored and committed by `--author`, and pushes it to the branch's upstream fast-forward only, never forced, writing nothing to the target's state; the report lists the commit under `commits.source`, and `--dry-run` checks that it could be written. A detached HEAD, a branch without an upstream or ahead of it, an untracked or changed Environment file, an inherited or flow-style `$fromPromotion`, a push the remote refuses (such as branch protection), or a push that never started because a configured credential cannot be used or `git` cannot run (the commit is undone) exit 1 with `NYL-PROMOTE-SOURCE-UNWRITABLE`, each with its own fix; a push refused because the branch moved undoes the commit and exits 2 with `NYL-PROMOTE-SOURCE-REJECTED`; a push that fails without a refusal, such as a network error, may have reached the remote, so it keeps the commit, writes no marker into the target's state, and exits 2 with `NYL-PROMOTE-SOURCE-UNCERTAIN`, whose fix is to fetch the branch, check whether the commit arrived, and run `nyl promote <path>` again, which then writes only the marker. `plan`, `reconcile`, `build`, and multi-environment runs read the block through one shared path, check a block no run applied yet against its PromotionPath and the source state it names (`NYL-PROMOTION-RECORD-INVALID`), refuse a block whose sequence is below the applied one with `NYL-PROMOTION-SEQUENCE-OLDER`, so an older checkout never rolls the environment back, and refuse another record at the applied sequence; rolling back is a new promotion with `nyl promote <path> --revision`. `status` and `nyl get` show the block"
author = "@NiklasRosenstein"

[[entries]]
id = "435833cd-1b49-4831-b51f-ecb22a62939b"
type = "feature"
description = "Several paths into one environment: with `source.promotion.paths` the source commit comes from the newest record on those paths, and path-less `$fromPromotion` bindings follow the record that supplied it, never an older record of another path. Before writing, `nyl promote` checks that what it promotes contains every record another path wrote into the target since this path last promoted, per value and repository, by the commits' changes (`git cherry`: ancestors, clean cherry-picks, and single-commit squashes count; a squash of several commits does not). A promotion that would drop such commits writes nothing and exits 2 with `NYL-PROMOTE-SUPERSEDES`, naming each missing commit by subject and a range to copy; a value without a known source commit warns with `NYL-PROMOTE-UNCHECKED`. `--supersede [<repository>:]<commit or range>[=<reason>]` accepts missing commits as replaced and the record lists each one with its reason and who gave it; an entry with neither its own reason nor `--reason` exits 1 with `NYL-PROMOTE-SUPERSEDE-REASON`. A record whose commit cannot be fetched is unchecked unless `--supersede` names it, and a shallow clone exits 1 with `NYL-PROMOTE-SHALLOW-CLONE` (fetch with `fetch-depth: 0`). Repositories are named by their GitRepository, else by a normalized URL. A `record: source` block a run would refuse now refuses `nyl promote` too"
author = "@NiklasRosenstein"

[[entries]]
id = "a12a6673-a2cb-407c-8768-6fa6033d3d9c"
type = "feature"
description = "`nyl get promotions -e <env>` shows the record that supplies the environment's source and, for each `$fromPromotion` binding of its units, the path and record it reads; `status`'s `pendingSequence` counts a newer record on any of the environment's source paths"
author = "@NiklasRosenstein"

[[entries]]
id = "0175c514-da53-4356-97f9-8807f3b98568"
type = "improvement"
description = "`nyl attest -e <env>` names the driver's reason in each `NYL-ATTESTATION-FAILED` warning, such as which Applications run another publication or are not Healthy, instead of only the attestation's name"
author = "@NiklasRosenstein"

[[entries]]
id = "866b869e-1ea0-46f0-9351-2d4a08c4eb51"
type = "feature"
description = "A PromotionPath that promotes only values takes each value from the state its consumer runs: a value selected as a publication's Release input (`input: /releases/<group>~1<release>/…`) is consumed by that Release's Application, so Applications synced to different publications by hand no longer block it, and the record names a value's own `state`. Only the consuming Application's own findings block its value (`unmatched`, a mix of revisions, not `Healthy` when `healthy` is required). A path's `coverage` is keyed by the publication unit: `coverage.<unit>.groups` and `coverage.<unit>.exclude` narrow the deployments (for a KubernetesPublication, its Applications and their ApplicationGroups) a source promotion counts toward that unit's attestations, and `coverage.<unit>.require` adds deployments that must meet them at whatever publication they run. Drivers gain `running_attestations`, `deployment_verdicts`, `receipt_publication`, `input_consumer`, and `deployments`; nothing new is persisted"
author = "@NiklasRosenstein"

[[entries]]
id = "386fc8e1-af12-4f5e-85dc-df08f18a9d6e"
type = "feature"
description = "`nyl validate`, `nyl plan`, `nyl reconcile`, `nyl promote`, and `nyl get promotion-candidates` check a PromotionPath's `coverage` against what each named unit runs, as its kind lists it (a KubernetesPublication renders its target, with placeholders for the bindings orchestration resolves and `$fromPublication` inputs read fresh or from the cached branch): a unit the source environment does not declare, select, or enable, a unit whose kind runs no deployments, and a group or deployment the unit does not run fail with `NYL-PROMOTE-COVERAGE-UNKNOWN`, which lists the names the unit has; a coverage unit of an unregistered kind fails with `NYL-UNIT-KIND-UNKNOWN`; `groups` on a path that promotes only values, and any entry of a unit that records nothing per deployment (a KubernetesPublication without `observe`), fail with `NYL-PROMOTE-COVERAGE-INEFFECTIVE`. When the deployments cannot be listed, such as when the source's target does not render, `nyl validate` fails with `NYL-PROMOTE-COVERAGE-UNCHECKED` and the render error, and the other commands warn with it and carry on"
author = "@NiklasRosenstein"

[[entries]]
id = "c281f882-04ff-455b-848e-3421371a367f"
type = "breaking"
description = "For projects that tracked the development branch: a PromotionPath's `coverage` is now per publication unit, `coverage: {<unit>: {groups, exclude, require}}`, replacing the flat `coverage.applicationGroups`, `coverage.excludeApplications`, and `coverage.requireApplications` that no release shipped; the flat fields are refused. Move each list under the publication unit whose deployments it names. The PromotionRecord's `excludedApplications` list is replaced in place by `excludedDeployments`, a map of unit to the deployments the path excluded (`{<unit>: [names]}`, sorted, each name once; a unit that excludes nothing is left out, so `{}` when none); no release wrote the old field, so the state format keeps its version; a record the development branch wrote before this change no longer reads, and promoting along its path again replaces it. Promotion refusals and fixes say deployment instead of Application, and a `require` name no attestation lists is reported under its unit instead of `environment`"
author = "@NiklasRosenstein"

[[entries]]
id = "995afde4-f1a8-4fd0-9b00-8aee26c51aa8"
type = "breaking"
description = "`nyl promote` counts a publication's `accepted` and `healthy` only for its current receipt, because they say what runs now: an older state no longer qualifies through them once a newer receipt is published, and a failing newest one refuses the promotion with `NYL-PROMOTE-NO-EVIDENCE` and the driver's reason instead of falling back to an older state that once passed. The refusal names that older state; `--state-revision` (or `--revision`) promotes it on the attestations recorded for it. Environment-wide, external, and other units' attestations still let the newest passing state win, and a publication without `observe` is unaffected. `nyl get promotion-candidates` reports such a state's gap as `not-running`"
author = "@NiklasRosenstein"

[[entries]]
id = "a96f7920-876f-4f46-b0d4-f358aeff08a5"
type = "feature"
description = "`nyl status` warns with `NYL-ATTESTATION-FAILED` and the attestation's reason for every attestation that fails for what the environment runs: a unit's for its current receipt and an environment-wide one for the current state. `nyl plan` of an environment that two or more PromotionPaths promote into warns with `NYL-PROMOTE-UNCHECKED` for each value they both carry that has no known source commit, which the supersede check cannot compare"
author = "@NiklasRosenstein"

[[entries]]
id = "3b143c7b-d629-414e-8010-0a503b6a8cef"
type = "feature"
description = "`nyl promote` with `record: source` also writes one marker commit into the target's desired state, under the lease it already holds, after the source commit is pushed: the same `promote` summary and trailers a `record: state` promotion writes, without a record file. Sequences are now reserved across branches, and `nyl get promotions` lists `record: source` promotions in its history; `status` and the lineage are unchanged. When the marker cannot be written the promotion still stands, and the command exits 1 with `NYL-PROMOTE-MARKER-UNWRITTEN`; running `nyl promote` again from a checkout of the pushed commit finds the block `unchanged` and writes only the marker, under the re-runner's `Nyl-Requested-By` and `Nyl-Reason`, provided the branch is not ahead of its upstream"
author = "@NiklasRosenstein"

[[entries]]
id = "bd507c1e-8a77-465c-baf7-889008c69961"
type = "feature"
description = "`source.promotion.verify: {allowedSigners: <path>}` on an Environment with `record: source` trusts a new `promoted` block by the SSH signature on the commit that last changed it (`git verify-commit` with `gpg.ssh.allowedSignersFile` set to the project's file) instead of reading the source environment's state. An unsigned commit, a signature by an unlisted key, an OpenPGP or X.509 signature, uncommitted changes to the Environment's file, or a missing, untracked, or uncommitted allowed signers file refuse with `NYL-PROMOTION-RECORD-UNSIGNED`. A shallow clone is refused, merges credit the side commit that changed the block, and it needs Git 2.34 and OpenSSH 8.2. `nyl promote` checks that SSH commit signing is configured (also with `--dry-run`) and verifies its commit before pushing. Without `verify`, a run still checks the block against the source's state, which needs read access to it. The setting and the allowed signers file are read from the commit being run, so `verify` is only as strong as the branch protection on both"
author = "@NiklasRosenstein"

[[entries]]
id = "fa516da3-0e20-4284-80c4-77b118c4feb2"
type = "fix"
description = "`nyl promote` and `nyl get promotion-candidates` judge a target whose source is promoted by the units its own definitions select at each candidate's source commit, the commit it would run, instead of at the checked-out entry worktree; the commits are read newest first and only until the choice is settled, so promoting the newest state renders one. A commit at which the target's definitions do not render keeps its states out (`target-source` in the candidates report)"
author = "@NiklasRosenstein"

[[entries]]
id = "eb59c3a1-c2f9-4ca9-80ce-edb3d981951f"
type = "feature"
description = "Promotion validation types a selector's pointer into an artifact through the producing kind's declaration of the artifact (`OciImage`'s `ContainerImage`: `repository`, `digest`, `reference`, `platforms`, `tags`): a pointer the artifact lacks, or an artifact name the kind does not publish, is `NYL-PROMOTE-SELECTOR-INVALID`, and its type must fit the bindings that read the value (`NYL-PROMOTE-VALUE-TYPE`)"
author = "@NiklasRosenstein"

[[entries]]
id = "4bc18392-ef42-4403-9853-50ebf34ac0b1"
type = "improvement"
description = "Teardown text that the orchestration engine writes for every kind no longer speaks of Argo CD or Applications: a teardown wait's terminal prompt says the unit waits for its deployments to be removed, and an `observe` wait with no observation is uncertain with `observation-failed: the driver made no removal observation`. KubernetesPublication's own messages keep their Argo CD terms."
author = "@NiklasRosenstein"

[[entries]]
id = "3130d79f-0f85-4710-a2a9-79bbcc9d5426"
type = "fix"
description = "Update the bundled `libz-sys` to 1.1.33 for RUSTSEC-2026-0544, a heap buffer overflow in zlib reachable through `git2`"
author = "@NiklasRosenstein"

[[entries]]
id = "76b34f5f-effd-4e1b-b165-bdea559704ee"
type = "fix"
description = "Commands that render through the render cache, such as `nyl reconcile`, `publish-tree`, `render-tree`, and Helm chart renders, no longer read the whole `nyl` executable into memory to fingerprint it: they hash it in chunks, once per process, so peak memory no longer grows by the size of the binary (about 45 MB for a release build, several hundred megabytes for a debug build; `nyl reconcile` peaked at 310 MiB before and 37 MiB after). The fingerprint is unchanged, so existing cache entries are still reused"
author = "@NiklasRosenstein"

[[entries]]
id = "8a144124-7c5b-4910-ae42-c97464c74804"
type = "breaking"
description = "Unit drivers raise only generic codes, named for what happened to a unit, never for its kind or tool; the kind-specific specifics move into the message, the fix, and a new `detail` slug. Teardown readiness: `NYL-TEARDOWN-CATALOG-MANUAL-SYNC`, `NYL-TEARDOWN-APPLICATIONS-ORPHANED`, and `NYL-TEARDOWN-NAMESPACE-CONFIRM` become `NYL-TEARDOWN-BLOCKED` (detail `catalog-manual-sync`, `applications-orphaned`, `namespace-confirm`; an unreadable shared catalog is `shared-catalog-unreadable`), and `NYL-TEARDOWN-NAMESPACES-REMAIN` and `NYL-TEARDOWN-CATALOG-REMAINS` become `NYL-TEARDOWN-REMNANT` (`namespaces-remain`, `catalog-remains`). `NYL-TEARDOWN-WAIT-MANUAL` is unchanged. Scripts that match the old codes must match the new code and its `detail`"
author = "@NiklasRosenstein"

[[entries]]
id = "bf7f2095-b04e-4af7-aab3-ce0aee76dd6d"
type = "breaking"
description = "KubernetesPublication warnings and failures use generic unit codes, each with a `detail`: `NYL-KUBERNETES-SHARED-CATALOG-DIFFERS` → `NYL-UNIT-SHARED-DIFFERS` (`shared-catalog-differs`); `NYL-KUBERNETES-PRUNE-AWAITING-CONFIRMATION` → `NYL-UNIT-REMOVAL-UNCONFIRMED` (`prune-confirm`); `NYL-KUBERNETES-RELEASE-LEFT-BEHIND` → `NYL-UNIT-LEFT-BEHIND` (`release-left-behind`); `NYL-KUBERNETES-OWNER-FENCED` and `NYL-KUBERNETES-RELEASE-FENCED` → `NYL-UNIT-OWNER-FENCED` (`prefix-owned`, `shared-catalog-owned`, `release-owned`); `NYL-KUBERNETES-OWNER-UNKNOWN` and `NYL-KUBERNETES-RELEASE-OWNER-UNKNOWN` → `NYL-UNIT-OWNER-UNKNOWN` (`prefix-owned`, `release-owned`); `NYL-KUBERNETES-STATE-CHANGED` → `NYL-UNIT-INPUTS-CHANGED` (`publication-state-changed`); `NYL-KUBERNETES-TARGET-CHANGED` and `NYL-KUBERNETES-RECONCILER-CHANGED` → `NYL-UNIT-DESTINATION-CHANGED` (`target-changed`, `reconciler-changed`); `NYL-KUBERNETES-HEALTH-TIMEOUT` → `NYL-UNIT-HEALTH-TIMEOUT` and `NYL-KUBERNETES-HEALTH-DEGRADED` → `NYL-UNIT-HEALTH-DEGRADED` (`wait-healthy`); `NYL-KUBERNETES-CLUSTER-CONTEXT-MISSING` → `NYL-UNIT-ACCESS-UNDECLARED` (`cluster-context-missing`); `NYL-KUBERNETES-OBSERVATION-UNOWNED` → `NYL-OBSERVATION-UNOWNED` (`resource-not-rendered`); `NYL-KUBERNETES-RELEASE-HISTORY-TOO-DEEP`, which was only in the message text, → `NYL-UNIT-HISTORY-TOO-DEEP` (`release-history`). A direct target's unit raises `NYL-UNIT-CAPABILITY-MISMATCH` (`scope-mismatch`) and `NYL-UNIT-HOOK-IGNORED` (`delete-hooks`) where it raised `NYL-KUBERNETES-SCOPE-MISMATCH` and `NYL-KUBERNETES-HOOK-IGNORED`; `nyl render`, `diff`, `apply`, and the `release` commands outside orchestration keep those two codes"
author = "@NiklasRosenstein"

[[entries]]
id = "d2b27fee-50c7-4eb8-9025-d0ab2a0b81e3"
type = "breaking"
description = "`nyl build` of a KubernetesPublication refuses with generic codes: `NYL-KUBERNETES-BUILD-ARGUMENT` and `NYL-KUBERNETES-BUILD-NO-SHARED-CATALOG` → `NYL-BUILD-ARGUMENT` (`unknown-argument`, `conflicting-modes`, `lookup-value-missing`, `lookup-live`, `no-shared-catalog`; `--lookup=live` was `NYL-HELM-LOOKUP-LIVE-REFUSED` here, which the tree commands keep); `NYL-KUBERNETES-BUILD-TARGET-OWNED` → `NYL-BUILD-OWNED` (`target-owned`); `NYL-KUBERNETES-BUILD-DIRTY-SOURCE` → `NYL-BUILD-DIRTY-SOURCE` (`tree`, `shared-catalog`); `NYL-KUBERNETES-BUILD-IDENTITY` → `NYL-COMMIT-IDENTITY-MISSING` (`publication-push`); `NYL-KUBERNETES-BUILD-INLINE-TARGET` → `NYL-BUILD-ENVIRONMENT-REQUIRED`. The Terraform and OpenTofu driver's `NYL-TOFU-STATE-MISSING` → `NYL-UNIT-NATIVE-STATE-MISSING` (`backend-state-missing`)"
author = "@NiklasRosenstein"

[[entries]]
id = "f35a15d7-803c-4ea5-aa3e-445ee46cf305"
type = "breaking"
description = "An `observe` teardown wait whose deployments remain at the deadline is uncertain with the reason `deployments-remain: <names>` instead of `applications-remain: <names>`"
author = "@NiklasRosenstein"

[[entries]]
id = "7fa62688-8993-4cf7-a3ef-e2d7731678c2"
type = "breaking"
description = "Receipts that Nyl 0.7.0 wrote with one of the removed warning codes (`NYL-KUBERNETES-SHARED-CATALOG-DIFFERS`, `NYL-KUBERNETES-PRUNE-AWAITING-CONFIRMATION`, `NYL-KUBERNETES-RELEASE-LEFT-BEHIND`) no longer read: reading the environment's state fails as corrupt (`NYL-STATE-UNAVAILABLE`). The same holds for the checkpoints that a 0.7.0 run left on its run ref (or an evidence ref) when it died, which `nyl recover` and a takeover read. The state format version is unchanged, and Nyl does not map the old codes on read. Before upgrading, remove each `warnings` entry with an old code from `observed/units/<unit>.yaml` on the environment's state branch, and finish or recover every dead run with Nyl 0.7.0 so that no run ref holds such a checkpoint; the unit's next execution records a receipt with the new code"
author = "@NiklasRosenstein"

[[entries]]
id = "e20c7123-b445-4f16-9971-7aac2a58c459"
type = "feature"
description = "Findings and failures carry an optional `detail`, a driver-supplied slug that tells cases under one generic code apart, such as `catalog-manual-sync` under `NYL-TEARDOWN-BLOCKED`. It appears next to `code` in every `-o json` report and in receipts' recorded warnings; a unit's failure in a run report adds `code` and `detail` next to its `message`, and `teardownReadiness` adds the structured `blocking` findings next to its `reasons`. Nyl never acts on it"
author = "@NiklasRosenstein"

[[entries]]
id = "67bd41f5-19cc-4de6-b32c-d4bd972bbb06"
type = "feature"
description = "`nyl validate`, `nyl plan`, `nyl reconcile`, `nyl promote`, and `nyl get promotion-candidates` compare a promoted value with the type the Release declares for the input a DeploymentTarget's `releaseInputs` fills with `$fromPromotion`, reading the declaration from the ApplicationGroups the target selects without rendering: a mismatch is `NYL-PROMOTE-VALUE-TYPE`. A remote group source is fetched at its pinned commit, or read from the Git cache when the fetch fails. The new `nyl validate --offline` never uses the network, as `render-tree --offline` does, for the target compiles and the PromotionPath checks (Release input types and the `coverage` listing) alike. `nyl reconcile --local` makes those PromotionPath checks read remote sources and `$fromPublication` state from the caches only; the run itself still resolves its units' sources as without `--local`. A source neither fetched nor cached leaves the input types unchecked with `NYL-PROMOTE-VALUE-TYPE-UNCHECKED` (and the coverage names with `NYL-PROMOTE-COVERAGE-UNCHECKED`), an error in `nyl validate` and a warning in the other commands. Resolution still checks the value against the declaration"
author = "@NiklasRosenstein"

[[entries]]
id = "9adb705f-17ed-4781-89ac-69f630270580"
type = "fix"
description = "`render-tree --offline`, `diff-tree --offline`, and `render --offline` read a remote ApplicationGroup source at its pinned commit from the Git cache only, instead of fetching it when the cache lacks it. As with Git charts, `--offline --no-cache` with a remote ApplicationGroup source now fails, because that render keeps no Git cache to read from"
author = "@NiklasRosenstein"

[[entries]]
id = "21213f4b-602e-4913-8ec0-92a5bec12182"
type = "fix"
description = "`nyl validate` no longer fails with \"ApplicationGroup … source directory does not exist\" for a target that selects an ApplicationGroup with a remote source: the checkout it compiled from was removed before it was read"
author = "@NiklasRosenstein"

[[entries]]
id = "6593ef51-ca36-456f-9983-e73a0d0f2393"
type = "feature"
description = "The Python client's `NylClient.render()` accepts `release_only`, `no_validate`, and `use_desired_crds` keyword arguments, forwarding `--release-only`, `--no-validate`, and `--use-desired-crds` to `nyl render`. All default to `False`; `no_validate` and `use_desired_crds` together raise `ValueError`"
author = "@NiklasRosenstein"

[[entries]]
id = "0b6f5a52-6c1e-4f43-9c8e-2f7c1d3a9e41"
type = "breaking"
description = "Value sources are one uniform `$` model, and the released forms listed below are removed without a deprecation period. An object whose only key is a known `$` source is replaced by the value it names, at any depth of a document. Every source that reads a value from somewhere is named for that direction: `$fromEnvironment` (the environment's values, shorthand `{$fromEnvironment: /pointer}` or `{pointer, default?, optional?}`), `$fromInput` (a Release input, `{$fromInput: name}` or `{name, pointer?}`), `$fromParameter` (an EnvironmentTemplate parameter), `$fromUnit` (a unit's output, artifact, or observed value), `$fromPromotion` (a promoted value), `$fromFile`, `$fromGit`, and `$fromPublication` (Release-input binding sources), and `$literal` (its content, verbatim). They replace the released binding and reference forms `fromFile`, `fromGit`, `fromPublication`, `fromUnit`, and `fromPromotion`, and the `{value: x}` binding wrapper: a DeploymentTarget binding is now a bare literal or one source, such as `image: registry.example.com/web@sha256:…` or `database: {$fromFile: {path: db.yaml, pointer: /database}}`, and a unit reference is `{$fromUnit: {unit, output}}`. Each context resolves the sources the reference page lists, carries the ones the document it lands in resolves, and rejects the rest with an error that says where the source works and how to get the value instead; a source next to other keys, a pointer given to `$fromInput` or a name given to `$fromEnvironment`, a common typo of a source's name (another case or separator such as `$from_input`, the noun alone such as `$input`, a plural or abbreviation such as `$fromInputs` or `$fromParam`, a `…From` suffix such as `$inputFrom`, or `$from` alone), which names the source meant, and a source in `apiVersion`, `kind`, `metadata.name`, or `metadata.labels` are errors too. Orchestration state written by 0.7.0 stores the old reference forms in unit specs and is not readable as is: re-create it with `nyl state init --fresh` and reconcile"
author = "@NiklasRosenstein"

[[entries]]
id = "6d2e4c87-3b9a-4f0e-8a15-9e4b7c2d1f63"
type = "feature"
description = "Unit documents read the environment's values with `$fromEnvironment` at any field and depth, including the `environment` of a `$fromUnit` reference, instead of structural Jinja such as `{{ values.target | tojson }}`. It resolves when the unit renders, from the Environment's or template instance's values; a missing value takes `default`, is omitted with `optional: true`, or fails with `NYL-UNIT-INVALID` naming the environment, the keys there, and the nearest one. A field filled this way renders the same spec as the literal, so its execution key does not change. An EnvironmentTemplate's `spec.values` read the instance's parameters with `$fromParameter` at any depth, including as an inline target's Release-input binding, so a boolean or integer parameter keeps its type; an undeclared parameter fails with `NYL-TEMPLATE-INVALID`. Sources the values carry, such as `$fromUnit` in an inline target's bindings, resolve where the values land"
author = "@NiklasRosenstein"

[[entries]]
id = "9a7c3e15-2f84-4d6b-b0e9-5c1f8a4d7e22"
type = "feature"
description = "Every resource of a Release bundle reads the Release's inputs with `{$fromInput: name}` (or `{name, pointer?}`) at any depth, with the input's declared type, instead of structural Jinja such as `{{ inputs.x | tojson }}`: plain Kubernetes manifests (such as a Deployment's `image: {$fromInput: image}`), a HelmChart's fields and chart `values`, a Component's `spec`, a RemoteManifest, and the `metadata.namespace` of any of them and of the Release. `apiVersion`, `kind`, `metadata.name`, and `metadata.labels` stay literal, and a Release's input declarations hold no source. Foreign `$` keys such as `$ref` in chart values, a Component's spec, and plain manifests stay data; in typed Nyl fields every `$` key is reserved. HelmChart `spec.valuesFrom` reads chart values from YAML files of the repository (`file`, under the path and Git-visibility rules of Cluster `valuesFrom`) and from `object` Release inputs (`input`, only in the bundle of a Release that declares it), each optionally narrowed by `pointer` and mounted under `key`. Entries merge in order and the inline `values`, with their `$fromInput` sources resolved, merge last; the merged values are passed to Helm as data, and a values file that holds a value source is an error that says to move it to the inline values. A value source in what rendering generates (a chart's output, a Component's, a remote manifest) is an error naming the resource that generated it. Release inputs are part of the Release and target render cache keys, a values file is an input of both, and the resolved chart values are part of the Helm cache key"
author = "@NiklasRosenstein"

[[entries]]
id = "f45f4614-60ae-4f0e-82be-4940d5d6d070"
type = "feature"
description = "`nyl validate` warns with `NYL-VALUES-SOURCE-UNREAD` about a value source in an Environment's, EnvironmentGroup's, or template instance's `values` that no unit of the environment reads, per environment and per sample instance; a carried source that a unit reads is checked where it lands and fails that unit's render with a message that it came with the environment's values. An unknown `$` key in a unit kind's typed field, such as `{$fromEnviroment: /x}`, fails with `NYL-UNIT-INVALID` as an unknown value source with the one it probably meant, read from the kind's schema, instead of a generic deserialization error; where the schema leaves an object open, such as a Terraform unit's `variables`, the key is data. The editor schemas of unit kinds offer `$fromEnvironment`, `$fromUnit`, `$fromPromotion`, and `$literal`, and those of HelmChart and RemoteManifest offer `$fromInput` and `$literal`, next to each top-level `spec` field"
author = "@NiklasRosenstein"

[[entries]]
id = "2bba1f66-bb33-4460-a46e-96adbd2bf97b"
type = "fix"
description = "Value-source follow-ups. `nyl validate` no longer fails a Release bundle that reads an `object` input by `pointer` when a target binds the input with `$fromUnit` or `$fromPromotion`, such as `{$fromInput: {name: image, pointer: /digest}}` over an image artifact: before a run the selected value is unknown, so validation does not check it, while the input's declared type and the structural checks still apply; a `pointer` into a scalar input stays an error. An unknown `$` key in a unit field whose schema names its fields without rejecting others, such as an OciImage's `spec.context`, fails as an unknown value source with the one it probably meant instead of the kind's own error, such as `spec.context.path is required`. `$fromInput` in an EnvironmentTemplate's values that names a declared parameter says to write `{$fromParameter: <name>}`. A run whose target's Release bundle uses value sources wrong (a source in the wrong place, a typo of a source's name, a source in a `valuesFrom` file, or one in what a chart, Component, or RemoteManifest generates), or whose `releaseInputs` do not fit its Releases (an undeclared input, a value of the wrong type), fails the publication unit with `NYL-UNIT-INVALID` instead of `NYL-DRIVER-ERROR` (a `valuesFrom` file that cannot be read for a reason outside the configuration, such as an I/O error or a Release outside a Git worktree, and a bound file or Git object that cannot be read keep failing the driver call), and such errors, as well as a missing `valuesFrom` file (of a HelmChart, Cluster, or DeploymentTarget) or bundle file, name files relative to the project instead of the run's temporary checkout. `nyl validate` reports a template error that both a sample instance's inline target and its units reach once"
author = "@NiklasRosenstein"

[[entries]]
id = "7bfbb3c9-80a3-4a43-8387-b78e275b3b43"
type = "fix"
description = "`nyl detect-drift`, `nyl attest`, and `nyl observe` report a driver error that carries a code, such as `NYL-UNIT-INVALID`, with that code, its detail, and the driver's fix, as `nyl reconcile` does, instead of as `NYL-DRIVER-ERROR` with the code in the message and the engine's generic fix"
author = "@NiklasRosenstein"
