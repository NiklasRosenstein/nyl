[[entries]]
id = "4e41292f-c1fa-4c27-890f-af356476f0e5"
type = "breaking change"
description = "Remove daemon functionality as it was never recommended and added complexity to the codebase"
author = "@NiklasRosenstein"

[[entries]]
id = "de649901-52e5-4ca4-84bf-f4d11e85a21e"
type = "feature"
description = "Allow pinning the target kube context in `nyl.toml` via `[project.kubernetes].context`, overridable per profile via `[profile.<name>.kubernetes].context`, to guard against accidentally running against the wrong cluster. Precedence is `--context` > profile > project > current kubeconfig context."
author = "@NiklasRosenstein"

[[entries]]
id = "f6751c05-94dd-4e42-b3a8-23c9dbe3fffd"
type = "breaking change"
description = "Remove the unused `nyl-profiles.yaml` profile system (including the unwired SSH kubeconfig and SSH tunnel stubs); profiles are configured through `nyl.toml`"
author = "@NiklasRosenstein"

[[entries]]
id = "177306ad-7542-4b3d-875d-f4127d14a470"
type = "feature"
description = "Add an exact source cache and project-wide `nyl vendor` workflow for reproducible, network-free rendered GitOps inputs"
author = "@NiklasRosenstein"

[[entries]]
id = "61fc9e7f-acde-40c4-a9e0-5d0d7d4f26d8"
type = "breaking change"
description = "Remove the Argo CD CMP integration, ApplicationGenerator resource, `nyl generate argocd`, and deployment chart; keep the published image as a shell-friendly CI renderer with Nyl, Helm, Git, SOPS, and Kyverno CLI"
author = "@NiklasRosenstein"

[[entries]]
id = "cb8fdd17-a169-4a62-9655-3865d324849f"
type = "feature"
description = "Exclude project secrets and NYL_* environment inputs from tree rendering by default, with explicit per-command admission through `--allow-secret-inputs` for trusted central sources"
author = "@NiklasRosenstein"

[[entries]]
id = "ba31919b-e898-4c53-886f-3db675ed9ba8"
type = "feature"
description = "Add `nyl init --vendor <disabled|preferred|required>` to record the project-global remote artifact vendoring policy in the generated `nyl.toml`"
author = "@NiklasRosenstein"

[[entries]]
id = "024a2ee6-2470-4c84-af9c-1381ff495931"
type = "feature"
description = "Add `nyl create release NAME` to scaffold a Release in the source directory of a matching ApplicationGroup, with `--group` (offering to declare a missing group), `--namespace`, and `--additional-namespaces`; it warns when the group source does not select the new file or when its Argo CD project does not admit the Release namespaces"
author = "@NiklasRosenstein"

[[entries]]
id = "a70aa56a-b730-4eca-bfb7-825bfb7ccbee"
type = "improvement"
description = "A scaffolded ApplicationGroup no longer declares a project or pins `destinationNamespace`, so it owns its implied AppProject and each Release keeps the namespace from its own metadata"
author = "@NiklasRosenstein"

[[entries]]
id = "fc47c749-91b8-461f-9f2a-d3ca5590054d"
type = "fix"
description = "`nyl apply` now creates a missing release namespace before applying manifests instead of afterwards for release state, so the first apply of a release into a new namespace no longer fails for every namespaced resource and succeeds only on a retry"
author = "@NiklasRosenstein"

[[entries]]
id = "822cf5b4-40b4-4edf-95c6-07693947d902"
type = "feature"
description = "An ApplicationGroup may declare neither `projectRef` nor `projectTemplate`; it then owns an implied AppProject named after the group that admits only what its Applications deploy: the target publication repository, the target Cluster with the group's Release namespaces, and the rendered resource kinds by scope. `spec.projectTemplate` mirrors every AppProject field; declared fields are kept as written and omitted fields take those derived values. Deriving a whitelist fails when a rendered kind's scope is unknown"
author = "@NiklasRosenstein"

[[entries]]
id = "087dafe2-887b-47bc-af60-9eb39be22df7"
type = "improvement"
description = "`nyl init` no longer generates an AppProjectDefinition. The generated ApplicationGroup uses the implied AppProject, and `--project-name`, `--allow-namespace`, and `--allow-cluster-resource` write an explicit `spec.projectTemplate`, leaving every field they do not name at its derived least-privilege default"
author = "@NiklasRosenstein"

[[entries]]
id = "4d5cb2e1-7ba9-4935-8afe-69403f409a20"
type = "improvement"
description = "Label the generated schema branches for mutually exclusive fields with what choosing each one does, so the resource reference lists them as named variants linking to their fields (for example `projectRef`, `projectTemplate`, `Neither`) instead of dumping raw constraints whose `required` entry reads as if the field were required outright"
author = "@NiklasRosenstein"

[[entries]]
id = "36f53974-eda3-4035-a2d9-fc552bb8ef78"
type = "feature"
description = "Bound release history with `[release] history_limit` in `nyl.toml` or `nyl apply --history-limit`, keeping five revisions per release by default; after a successful apply or rollback the oldest revisions beyond the limit are deleted. Set `history_limit = 0` to keep every revision as before"
author = "@NiklasRosenstein"

[[entries]]
id = "2b8f5c1e-6a4d-4f0e-9d3b-7c1a5e8f2d64"
type = "improvement"
description = "Reduce `nyl apply` and `nyl release rollback` latency: use aggregated API discovery with a per-group fallback, apply resources in Argo CD's kind order with each kind's resources applied concurrently (`--concurrency`, default 8), print each resource outcome as it completes, report per-phase timings, and issue fewer release-state requests"
author = "@NiklasRosenstein"

[[entries]]
id = "8c3e1f7a-2d4b-4e9a-b6c5-1f0d9e8a7b32"
type = "breaking change"
description = "`nyl apply` orders resources like Argo CD (for example, Secrets and ConfigMaps now precede CustomResourceDefinitions and RBAC; admission webhook configurations are applied last) and records release manifests in that order; documents describing one object in different API versions are collapsed to the last in apply and diff; pruning deletes in reverse apply order and waits for each kind's resources to terminate before deleting the next kind, which can take longer than the previous unordered prune; a failed prune makes the command exit non-zero; a revision is recorded before applying, and an apply that fails or is interrupted records it as failed; and a release that renders no resources is recorded and prunes its previous resources instead of being skipped"
author = "@NiklasRosenstein"

[[entries]]
id = "915c739d-16c6-47be-9584-c80957f0f7b4"
type = "breaking change"
description = "Upgrade templating to MiniJinja 3, which aligns template behavior more closely with Jinja2: sequences and maps render with Python-style quoting, floor division and modulo follow Jinja2 semantics, division by zero is an error, `round` uses round-half-even, and `title` only starts words after whitespace and opening brackets"
author = "@NiklasRosenstein"

[[entries]]
id = "003b92f8-e5cc-4df4-88c5-6b969073eef4"
type = "improvement"
description = "`nyl validate` prints each warning once, with search paths relative to `nyl.toml`, and target compilation no longer logs the implicit ArgoCDInstance at INFO level on every run"
author = "@NiklasRosenstein"

[[entries]]
id = "83372d88-23ef-4706-8f71-ebd9f2eed971"
type = "docs"
description = "Redesign the documentation site around four layers (Kubernetes Rendering, Kubernetes GitOps, Orchestration, Domain modeling) and rename its routes to match: `/kubernetes/` is now `/kubernetes-rendering/`, `/rendered-gitops/` is now `/kubernetes-gitops/`, and `/domain-resources/` is now `/domain-modeling/`. The old routes do not redirect, and the rendered GitOps wording is now Kubernetes GitOps"
author = "@NiklasRosenstein"

[[entries]]
id = "93c663f3-f225-4d6d-b399-cdb0551b3b69"
type = "breaking change"
description = "`render-tree` and `publish-tree` write each rendered resource to its own file, `<release>/<kind>[.<group>]/[<namespace>/]<name>.yaml` (CRDs under `<release>/crd/`), replacing the per-Release `resources.yaml`; the Argo CD catalog uses the same layout beneath `_nyl/catalog`. The first publication after upgrading rewrites the whole tree"
author = "@NiklasRosenstein"

[[entries]]
id = "01a3945c-24e5-4a6c-a167-f1aeec0d64f2"
type = "breaking change"
description = "Remote Git operations (fetch, ref listing, push) run the `git` command line instead of libgit2, so Nyl authenticates exactly as `git` does (SSH config and agent, credential helpers, `insteadOf`, `core.sshCommand`/`GIT_SSH_COMMAND`). `git` must now be on `PATH`"
author = "@NiklasRosenstein"

[[entries]]
id = "b64071ea-1c29-4631-8917-ac34a28bea54"
type = "breaking change"
description = "`nyl render`, `nyl diff`, and `nyl apply` with `--target` take a Release from the compiled target, so they render exactly what its Application deploys, including generated Namespaces and the group's `destinationNamespace`; no command takes a namespace from the kube context anymore"
author = "@NiklasRosenstein"

[[entries]]
id = "4eddf3b7-05bc-43e7-bc2a-751932b87826"
type = "breaking change"
description = "`applicationNameTemplate` is a `${ … }` template value that must contain at least one expression; the `{% raw %}` form is no longer expanded. `nyl validate` rejects duplicate generated Argo CD names across every pair of targets whose instances share a cluster and namespace, including implicit per-target instances"
author = "@NiklasRosenstein"

[[entries]]
id = "7ba0df58-4043-44af-9e12-230cf804cccb"
type = "breaking change"
description = "`diff-tree` and `publish-tree` fail with `NYL_PROJECT_SCOPE_CONTRACTION` when a resource leaving a cascading Application would lose the AppProject permission Argo CD needs to delete it. Keep the scope with the new `ApplicationGroup.spec` fields `retainedProjectNamespaces`, `retainedNamespaceResourceWhitelist`, and `retainedClusterResourceWhitelist`, or pass `--ignore-project-scope-contraction` after review"
author = "@NiklasRosenstein"

[[entries]]
id = "6c34ed36-f40e-4ca0-8d86-f7ae15f3cd64"
type = "deprecation"
description = "Cluster and Release move to `apiVersion: k8s.nyl/v1`. `k8s.gitops.nyl/v1` stays accepted for both with a warning, and rendered output is identical either way. `nyl render --context` is deprecated and ignored, since `render` never connects to Kubernetes"
author = "@NiklasRosenstein"

[[entries]]
id = "6fb96c53-ba3f-4c84-8221-3715ddd828fd"
type = "feature"
description = "Typed Release inputs with DeploymentTarget bindings from `value`, `fromFile`, locked `fromGit`, and `fromPublication` (state in the target's own publication branch, optionally carried from the worktree with `carryFileFromWorktree`). Direct commands accept `--input NAME=JSON` and `--inputs FILE`, and `nyl update source-locks` refreshes `fromGit` locks, optionally per `--target`"
author = "@NiklasRosenstein"

[[entries]]
id = "ddbd3d3c-35fd-4949-842a-a0ed76e94c6f"
type = "feature"
description = "Orchestration preview: declare Environments of units whose state lives in Git, and run them with `nyl plan`, `reconcile`, `status`, `detect-drift`, `attest`, `teardown`, `hold`/`resume`, `recover`, `exec`, `build`, and `state`/`lease`. Built-in units cover constrained commands, OCI images built with Docker Buildx (`OciImage`), and Terraform and OpenTofu configurations run with their native tools. `reconcile --worktree` runs uncommitted changes from a snapshot. Orchestration is in development"
author = "@NiklasRosenstein"

[[entries]]
id = "99be3439-e5db-4fb4-9fdf-a64909f4cd3b"
type = "feature"
description = "`publish-tree --application-group` and `--release` replace only the selected ApplicationGroups or group-qualified Releases and keep the rest of the published tree, while still validating the combined tree"
author = "@NiklasRosenstein"

[[entries]]
id = "47d9f2bd-daaa-4af6-8a68-fdafaa0d4830"
type = "feature"
description = "`nyl apply --handoff[=MANAGER]` and `nyl release rollback --handoff` apply as another field manager (`argocd-controller` by default) and release the fields Nyl owned, so Argo CD can take over resources Nyl bootstrapped"
author = "@NiklasRosenstein"

[[entries]]
id = "94047cec-60d9-4d94-8852-513f110e16f7"
type = "feature"
description = "Cluster and DeploymentTarget accept `spec.valuesFrom`, a list of plain YAML mapping files merged before inline `spec.values`, optionally mounted under a `key`"
author = "@NiklasRosenstein"

[[entries]]
id = "0ffc4bdc-8dbe-4a45-9c94-6fcfa1689b1c"
type = "feature"
description = "A local component can declare value imports in `nyl-component.yaml` that copy JSON Pointer selections of the effective Cluster and DeploymentTarget values into chart values, for platform defaults"
author = "@NiklasRosenstein"

[[entries]]
id = "2de370b5-f379-45c3-bc00-2a8988c31db5"
type = "feature"
description = "`nyl schema annotate` adds a yaml-language-server schema comment to every YAML document in the project, and `--check` verifies them in CI"
author = "@NiklasRosenstein"

[[entries]]
id = "21ac286c-162f-4509-ace0-baa98cb57579"
type = "feature"
description = "`nyl capture cluster --crds` vendors whole CustomResourceDefinitions and records which kinds are cluster-scoped"
author = "@NiklasRosenstein"

[[entries]]
id = "32997d50-106b-46f7-a063-f5821028d124"
type = "improvement"
description = "Publication commit messages list the generated Argo CD Applications whose files changed"
author = "@NiklasRosenstein"

[[entries]]
id = "4993cff9-deed-4a70-9420-5c58ffc8ae75"
type = "improvement"
description = "Resource parsing and schema validation errors name the failing field path with an actionable hint, and orchestration diagnostics lead with a headline, aligned details, and the actions to take"
author = "@NiklasRosenstein"

[[entries]]
id = "6314ab7b-8f91-437c-bd09-896e79d5abb5"
type = "improvement"
description = "When `publish-tree --require-clean` rejects a worktree, it lists up to 20 changed files with their Git status codes"
author = "@NiklasRosenstein"

[[entries]]
id = "47d06c36-33a7-4eae-ba5b-8b9a35689175"
type = "improvement"
description = "Project discovery only checks files it consumes, which speeds it up in large repositories"
author = "@NiklasRosenstein"

[[entries]]
id = "80b43989-317f-4e01-a742-150b6da0e5bb"
type = "fix"
description = "Git-backed Helm charts on a branch, tag, or default `HEAD` resolve the ref before reusing cached charts and rendered output, instead of staying at the first cached commit"
author = "@NiklasRosenstein"

[[entries]]
id = "01fc102c-cdf8-4d26-ba71-c205270082b8"
type = "fix"
description = "Unchanged Git LFS files no longer make the worktree look dirty, which blocked `publish-tree --require-clean` after a fresh CI checkout"
author = "@NiklasRosenstein"

[[entries]]
id = "d73eec00-08f7-4582-90d0-eab32d080800"
type = "feature"
description = "Orchestration can publish Kubernetes trees: the `KubernetesPublication` unit renders its DeploymentTarget with the `fromUnit` Release inputs (image digests, infrastructure outputs) its environment resolved, publishes the tree and its ownership index to the target's branch with a compare-and-swap push, and tears it down in two phases. Its effective teardown settings are recorded when the unit is resolved, so `status` and `plan` report teardown readiness without rendering. `mode: observe` is not available yet"
author = "@NiklasRosenstein"

[[entries]]
id = "fe1f4df2-e59c-4637-a945-a3078b4e23c5"
type = "feature"
description = "A `KubernetesPublication` unit can declare its DeploymentTarget inline (`spec.target.inline`), named `<environment>-<unit>`, and publishes it through the same path as a named target; `nyl validate` compiles it with the other targets. The published ownership index records the owning unit, and a publication or teardown refuses a prefix another existing unit owns (`NYL-KUBERNETES-OWNER-FENCED`, or `NYL-KUBERNETES-OWNER-UNKNOWN` when the owner's state cannot be read). Renaming a publication's target fails with `NYL-KUBERNETES-TARGET-CHANGED` until the unit is replaced with `nyl teardown --unit`. `nyl plan` and `nyl reconcile` warn about unmet teardown requirements and leftovers of every publication that would be torn down. The `observe` teardown wait is rejected until Nyl can read Argo CD"
author = "@NiklasRosenstein"

[[entries]]
id = "6d0a2c1b-4f3e-4b7a-9a52-0e8c5d7b1f34"
type = "feature"
description = "`nyl build` works for `KubernetesPublication` units: it renders the unit's tree as a run does, `nyl build <unit> -- --diff` compares it with the tree published at the destination (files added, modified, or removed, and the unit that owns it), and `-- --push` publishes it only for a target no environment owns, refusing with `NYL-KUBERNETES-BUILD-TARGET-OWNED` or `NYL-TREE-OWNED-BY-UNIT` and the fix otherwise. A unit with an inline target builds only with `-e`"
author = "@NiklasRosenstein"

[[entries]]
id = "b254a321-40dc-43ef-8ebe-c6b720f2c985"
type = "feature"
description = "A `KubernetesPublication` unit in `mode: observe` attests `accepted` and `healthy` through `nyl attest`: it reads the target's generated Argo CD Applications, matches each one's running revision (the newest full sync in `status.history`, never OutOfSync) to the publication by Application directory tree, and records each Application's running publication and health in the attestations' details. The `observe` teardown wait works too, and `NYL-KUBERNETES-MODE-UNSUPPORTED` and `NYL-KUBERNETES-TEARDOWN-WAIT-UNSUPPORTED` are gone. An ArgoCDInstance declares how it is read in `spec.access`: the Kubernetes API of its control-plane Cluster (the default, through the Cluster's `spec.live.context` and the kubeconfig the unit admits as `KUBECONFIG`) or the Argo CD API server (`method: api`, with a token the unit admits as `ARGOCD_AUTH_TOKEN` or the declared `tokenEnv`). An Argo CD that cannot be read makes `nyl attest` report the unit unknown and record nothing, and the removal wait never concludes from Applications the credential could not see. An unchanged attestation is rewritten with its new time once it is 15 minutes old, so `maxAttestationAge` works for a re-verified system"
author = "@NiklasRosenstein"

[[entries]]
id = "8f0cb9fb-4f2d-408d-b8b8-12b80215bf9c"
type = "feature"
description = "Let `dependsOn` entries and `fromUnit` references require a producer's attestations with `evidence: attested` or `attestations`: the consumer stays blocked (`attestation-pending` or `attestation-failing`, with `NYL-ATTESTATION-PENDING` or `NYL-ATTESTATION-FAILING`) until `nyl attest`, or the producer's own `reconcile`, records a pass for its current receipt; naming an attestation the producer does not declare is `NYL-ATTESTATION-UNDECLARED` (replacing `NYL-ATTESTATIONS-UNSUPPORTED`). Requiring an attestation that only an external source supplies (`from: external`), by name or through `evidence: attested`, is `NYL-ATTESTATION-EXTERNAL-UNSUPPORTED` until external attestations can be recorded. A new receipt drops the attestations of the one it replaces, and a report names the producer's environment when a consumer waits for another environment's unit"
author = "@NiklasRosenstein"

[[entries]]
id = "3b6e1d2a-5c7f-4e08-9d41-7a2f6c0b8e15"
type = "feature"
description = "Units can declare observed values (`observations`, with `type`, `maxAge`, and a driver-owned `from`) that their driver reads from the system the unit manages, and other units reference them with `fromUnit: {unit, observation}`. An observed value is an observation of the producer's current receipt, recorded in `observed/units/<unit>/observations.yaml` and dropped with the receipt it was read for. A pending value blocks its consumers (`NYL-OBSERVATION-PENDING`); a changed value makes them execute again without the producer executing. `nyl reconcile` reads every current unit before it resolves its consumers and waits up to `observationWait` after executing one, and the new `nyl observe` reads and records values without executing anything, for jobs that hold read credentials a reconcile lacks, naming the consumers it leaves ready (`NYL-OBSERVATION-CHANGED`); `nyl get observation` prints a recorded value. A `KubernetesPublication` in `mode: observe` reads a field of a resource its target renders (`NYL-KUBERNETES-OBSERVATION-UNOWNED` otherwise) from the workload Cluster, through that Cluster's own `spec.live.context` in the admitted `KUBECONFIG`, once the Application that owns the resource runs the receipt's publication. Kinds that read no observed values reject `observations` (`NYL-OBSERVATIONS-UNSUPPORTED`)"
author = "@NiklasRosenstein"

[[entries]]
id = "cced6584-cb1c-4838-b3fb-fdba2a18fd0b"
type = "feature"
description = "Add the `EnvironmentTemplate` resource for preview environments. An instance is created with `nyl state init -e <name> --template <template> --param <name>=<value>`, or by `nyl reconcile --template`, which then reconciles it from its own checkout; it exists only in state (`state.yaml` records the template, its parameters, the source commit, and `expiresAt`), shares one state ref with other instances through `state.path`, and behaves like a declared Environment for `plan`, `reconcile`, `status`, `get`, `attest`, `observe`, `teardown`, `state delete`, and `build`. A plain run renders an instance at its recorded source commit. A template's `deletionPolicy: Teardown` overrides every unit's policy for kinds that support teardown, and `allowTeardown` lets omission teardown proceed unattended. `nyl get environments` lists instances by listing their state; `nyl validate` checks each template through sample instances, so generated Argo CD names, publication prefixes, and state locations that would collide across instances are found early, and every publication render and direct `build --push` includes the instances state lists. New codes: `NYL-INSTANCE-TEMPLATE-UNKNOWN`, `NYL-INSTANCE-PARAMETER-INVALID`, `NYL-INSTANCE-NAME-TAKEN`, `NYL-INSTANCE-TEMPLATE-REQUIRED`, `NYL-INSTANCE-AMBIGUOUS`, and `NYL-TEMPLATE-INVALID`. The shared catalog is still to come"
author = "@NiklasRosenstein"

[[entries]]
id = "845a0f58-fa1a-4405-9fdb-27a07fb63e2e"
type = "feature"
description = "Add the `tojson` template filter, so a unit document can embed a structured value, such as an Environment's `values.target`, as `target: {{ values.target | tojson }}`"
author = "@NiklasRosenstein"

[[entries]]
id = "b9a5435b-ce4d-4839-b088-9d48112f8bb0"
type = "feature"
description = "Complete the lifecycle of preview instances. Activity extends an instance's `expiresAt` to now plus the template's `ttl`: `state init --template`, `reconcile --template`, and every other `reconcile -e <instance>` unless `--no-extend`; the next reconcile that finds an instance expired removes it (`teardown --all`, then `state delete`, never while a unit still has resources) unless `--renew` or the pull request job's `--template` keeps it, and `reconcile --template <name>` without `-e` is the scheduled fleet job that maintains every live instance at its recorded commit without extending it, removes the expired ones, and reports an instance whose lease is held as `busy`. The removal's teardown needs the template's `allowTeardown` or `--allow-teardown`, and repeats its decision under the lease (`NYL-INSTANCE-REMOVAL-PENDING`, `NYL-INSTANCE-RENEWED`). `maxInstances` is enforced at creation (`NYL-INSTANCE-LIMIT`, exit 2), and `--make-room` removes the oldest expired instances first, only as many as needed. `keepSource: true` is an opt-in (default `false`) for previews that may expire long after their branches are gone: it keeps each instance's recorded source commit fetchable through a ref of its own, `refs/nyl-keep/<keepId>/<commit>` (the id is recorded in `state.yaml`), until `state delete`, and the job then needs push access to `refs/nyl-keep/*` (`NYL-INSTANCE-KEEP-FAILED`); without it, nothing is pushed to the source repository and the pull request closed job tears the instance down. A renewal undoes a removal that was recorded as pending and has not started, and a pull request's `reconcile --template` creates an instance the fleet removed again. `nyl state move --template` moves every instance of a template after its `state` changed, and with `--from-template` records them under a renamed template. `state init --template` warns about unmet teardown requirements and a `manual` `teardownWait` that stops unattended removal (`NYL-TEARDOWN-WAIT-MANUAL`). `status`, `plan`, and `get environments` show expired instances (`NYL-INSTANCE-EXPIRED`); a new operation `state-renew` records the extension; `NYL-INSTANCE-OPTION-INVALID` and `NYL-INSTANCE-NOT-LISTABLE` report options and templates the lifecycle cannot serve"
author = "@NiklasRosenstein"

[[entries]]
id = "5af2a924-6a49-4274-abe0-be4c90afca35"
type = "feature"
description = "A recorded source commit that the entry clone lacks is fetched by its exact id from the clone's `origin`, after the retained snapshots and the instance's keep ref and with the same credentials, so a pull request closed job that checks out the default branch tears a preview down at its recorded commit without `keepSource` or `--source` wherever the host keeps `refs/pull/<n>/head` (GitHub) or `refs/merge-requests/<n>/head` (GitLab) after the branch is deleted. An explicit full commit id passed to `--source` that the clone lacks is fetched the same way. A failed fetch leaves the commit missing as before, and `--local` fetches nothing"
author = "@NiklasRosenstein"

[[entries]]
id = "d1401c9a-c0a9-4b63-984d-3b0a7b2520de"
type = "feature"
description = "Add `catalogApplication.shared: {name}` to DeploymentTarget (and a template's inline target): many targets, such as every preview on a branch, share one self-managing catalog Application instead of one per target. Nyl renders it once, from the `shared` block and the ArgoCDInstance's catalog defaults, under the reserved prefix `_nyl/shared/<name>/` with its own ownership index whose owner is the string `catalog:<name>`; each target keeps its own tree and catalog directory without a catalog Application. A target's publication creates the manifest when the branch holds none and never overwrites it, recording `sharedCatalog.result` (`created`, `current`, or `differs`) in its `PublishedTree`; `nyl build <unit> -- --shared-catalog [--diff | --push]` renders, compares, and, as the one writer, replaces it (`NYL-KUBERNETES-BUILD-NO-SHARED-CATALOG` for a target that shares none). Teardown readiness reads the shared Application, a unit never takes a catalog's prefix over, and the rules across targets (one description, one revision, no other catalog or target on that revision, no target prefix in `_nyl/shared`) fail with `NYL-KUBERNETES-SHARED-CATALOG-CONFLICT`. A template instance's units can read declared environments with `fromUnit` and `dependsOn` entries that name an `environment`, and a declared producer is protected against teardown, `state delete --teardown`, and omission while an instance reads it; an instance is a consumer only, so naming one as a producer fails with `NYL-REFERENCE-INSTANCE-PRODUCER`"
author = "@NiklasRosenstein"

[[entries]]
id = "5b0f6c1e-2d94-4f0a-8a57-9c3e1b7a40d2"
type = "feature"
description = "Drivers can report coded warnings with a successful execution (`Outcome::Succeeded` `warnings`), which Nyl records with the receipt and shows in the run report, `plan`, and `status` until the unit executes again; a `KubernetesPublication` warns `NYL-KUBERNETES-SHARED-CATALOG-DIFFERS` when the shared catalog manifest on the branch differs from the one it renders. A shared catalog's teardown readiness follows the manifest on the branch, recorded without keying the unit and read again when a teardown starts. `render-tree`, `publish-tree`, and `diff-tree` now check the shared-catalog rules across targets like `nyl validate` when a project may declare one: a target shares a catalog, a target could not be parsed statically, the project has an EnvironmentTemplate, or a publication unit declares or may declare an inline target (a mapping, a templated name, or a document that is not YAML before rendering). They then render every environment's units, so an unrelated broken unit fails them; projects with only static targets and no templates or inline units are unaffected"
author = "@NiklasRosenstein"

[[entries]]
id = "6efe7756-b86d-47a3-9bc4-258a8c9af4d2"
type = "docs"
description = "Add an end-to-end example to the Orchestration guide: one project with an OciImage, an OpenTofu configuration, a KubernetesPublication, and a preview template, reconciled locally and in GitHub Actions (reconcile on main, `nyl attest` and `nyl observe` with either Argo CD access method, a preview per pull request, its close job, and the scheduled fleet reconcile and shared-catalog writer), with the credentials the units admit and the token a preview job needs for keep refs. M5 is complete: its exit criterion is met by the reference scenarios, which now all run in both tiers with the built-in publication driver"
author = "@NiklasRosenstein"

[[entries]]
id = "1f9d2003-0882-458d-a02c-3d76a7717781"
type = "fix"
description = "`nyl teardown --all --source <revision>` and `nyl state delete --teardown --source <revision>` now take the files of a unit's Git source field from that revision when the stored spec pinned the field to the unit's recorded source commit (an OpenTofu or Terraform `source`, an image `context`), as they already did for the unit's own files, so a lost source commit no longer locks an instance out of removal. Explicit `revision` and `commit` locks and other repositories stay as declared, and the stored spec, its digests, and approvals are unchanged. A teardown that substitutes the recorded commit now warns with `NYL-SOURCE-OVERRIDE`, naming the unit, the recorded commit, and the commit used"
author = "@NiklasRosenstein"

[[entries]]
id = "8549e5cb-c8c8-41ac-bea9-5cf6765ab316"
type = "fix"
description = "`nyl state delete --teardown` prints the warnings of the teardown it ran when the deletion completes, and of its units, such as `NYL-SOURCE-OVERRIDE` for a `--source` substitution or `NYL-UNIT-RELEASED` for an image left in a registry; they were only in the JSON report's `details.teardown`"
author = "@NiklasRosenstein"
