id = "de649901-52e5-4ca4-84bf-f4d11e85a21e"
type = "feature"
description = "Allow pinning the target kube context in `nyl.toml` via `[project.kubernetes].context`, overridable per profile via `[profile.<name>.kubernetes].context`, to guard against accidentally running against the wrong cluster. Precedence is `--context` > profile > project > current kubeconfig context."
author = "@NiklasRosenstein"

