[[entries]]
id = "6f19ee07-712c-43aa-b040-58f496aa4cb5"
type = "feature"
description = "Components can use Helm `lookup`: a local component enables it for every invocation with `lookup: true` in its `nyl-component.yaml`, and the annotation `k8s.nyl/helm-lookup: \"true\"` or `\"false\"` on a Component overrides it, including for remote shortcuts and aliases. It reads the Release's objects exactly as `spec.lookup` does. Any other annotation value fails with `NYL-HELM-LOOKUP-ANNOTATION-INVALID`; a HelmChart takes `spec.lookup` and rejects the annotation with `NYL-HELM-LOOKUP-ANNOTATION-MISPLACED`"
author = "@NiklasRosenstein"

[[entries]]
id = "7cd64f65-1aae-48bd-abea-190ebb632ffc"
type = "feature"
description = "A chart whose templates call Helm's `lookup`, in the chart, its subcharts (unpacked or `.tgz`), or library charts, warns with `NYL-HELM-LOOKUP-UNDECLARED` when lookup is neither enabled nor disabled. `spec.lookup: false`, the annotation `k8s.nyl/helm-lookup: \"false\"`, and `lookup: false` in `nyl-component.yaml` render without lookup and silence it. Detection scans template sources, so it is a heuristic"
author = "@NiklasRosenstein"

[[entries]]
id = "64ea32f9-6556-4764-9e17-b141ef8f4310"
type = "breaking"
description = "HelmChart `spec.lookup` is a boolean: write `spec.lookup: true` (or `false` to opt out). The object form `spec.lookup: {}` from 0.7.0 is removed and fails with `NYL-HELM-LOOKUP-OBJECT-REMOVED`"
author = "@NiklasRosenstein"

[[entries]]
id = "11b756bf-dca5-42d1-854e-dc92b7e342c5"
type = "feature"
description = "The `PromotionPath` resource (`gitops.nyl/v1`) declares how an environment's source commit and selected values move into another environment: `from`, `to`, `evidence`, `attestations`, `maxAttestationAge`, `verifyArtifacts`, `coverage`, and named `values` with `select` forms. `nyl validate` and `nyl plan` check every path against the environments' units with stable codes and fixes (`NYL-PROMOTE-ENVIRONMENT-UNKNOWN`, `NYL-PROMOTE-SELECTOR-UNIT`, `NYL-PROMOTE-SELECTOR-INVALID`, `NYL-PROMOTE-VALUE-TYPE`, `NYL-PROMOTE-BINDING-UNKNOWN`, `NYL-ATTESTATION-UNDECLARED`), and reject `changeGate: pullRequest` and a DeploymentTarget in `from` or `to` with `NYL-PROMOTE-UNSUPPORTED`, which names M11. `nyl get promotion-paths` lists them. `nyl promote` follows in a later change"
author = "@NiklasRosenstein"

[[entries]]
id = "3df60286-ffad-476d-a4d4-03fc7983e5a5"
type = "feature"
description = "State gains the `PromotionRecord` kind at `desired/promotions/<path>.yaml`, added to format `v1` without a version bump: snapshots read it, and `nyl state move` (when it copies documents) and `nyl state restore` carry and roll it back. A Nyl older than this release keeps the file but cannot act on it, so it must not run `reconcile` in an environment that uses promotion, and its copying `state move` drops the file while its `state restore` leaves it as it is. An Environment's `source.fromPromotion.promoted` block is typed as the same record"
author = "@NiklasRosenstein"

[[entries]]
id = "288d2a8c-3024-4f49-86c0-80e34b85d2b3"
type = "feature"
description = "`nyl attest -e <env> [--unit <u>] --name <n> --result pass|fail [--reason …] [--url …]` records an external attestation for the unit's current receipt, or without `--unit` for the environment's current state, under the lease (`--wait-lease`). The name must be declared with `from: external` in the unit's `spec.attestations`, or in the Environment's `spec.attestations`; anything else exits 1 with `NYL-ATTESTATION-UNDECLARED`. The attester is recorded like an approver (`--attested-by`, `--attestation-source`, the approval lookup, CI, or the Git user). Recording exits 0 whether the result passes or fails; the driver form keeps exit 3 for a failing attestation. A dependent can now require an external attestation, so `NYL-ATTESTATION-EXTERNAL-UNSUPPORTED` is retired. Environment-wide attestations live in `observed/attestations.yaml`, added to format `v1` without a version bump: snapshots, `nyl state move` (when it copies documents), and `nyl state restore` carry and roll it back. A Nyl older than this release keeps the file through its transitions but cannot read or write it, its copying `state move` drops it, and its `state restore` leaves it as it is"
author = "@NiklasRosenstein"

[[entries]]
id = "6c55962f-de90-4e71-9809-ed0e0a587956"
type = "feature"
description = "`nyl promote <path> [--value …] [--dry-run] [--reason …] [--revision …] [--state-revision …] [--evidence published] [--ignore-attestation <scope>/<name>=<reason>] [--no-verify-artifacts] [--wait-lease …]` records what the path's source environment proved as a `PromotionRecord` in the target's desired state: one desired commit under the target's lease, with a summary naming the path, sequence, and source state. It only reads the source's state. Promoting the state the path's record already names writes nothing (`outcome: unchanged`). `--dry-run` takes no lease, writes nothing, and reports the record under a top-level `record`. The record's `sequence` comes from the target's desired history, so `nyl state restore` never reuses one. Evidence that is missing, stale, or failing is exit 2 with `NYL-PROMOTE-NO-EVIDENCE`"
author = "@NiklasRosenstein"

[[entries]]
id = "13a7765e-e90b-42e6-a9d4-7be6bcd0b3e3"
type = "feature"
description = "An Environment can take its source from a promotion (`source.fromPromotion` with `record: state`): it runs at the source commit of the newest record on its path or paths and records `sourceChosenBy: promotion` and `appliedPromotionSequence`. A path with no record yet exits 2 with `NYL-PROMOTION-MISSING`, naming `nyl promote <path>`. `{fromPromotion: {value, path?}}` bindings now resolve in unit specs and in a DeploymentTarget's `releaseInputs` through the shared binding resolver, and block their consumer until a record carries the value"
author = "@NiklasRosenstein"

[[entries]]
id = "65f3ea0d-9a7c-433e-bf99-1c8f168436f5"
type = "feature"
description = "`nyl promote` checks that every artifact a promoted value reads still exists, through the producing driver's new `verify_artifact` capability (`docker buildx imagetools inspect` for `OciImage`), and refuses a missing one with `NYL-PROMOTE-ARTIFACT-MISSING`. `--no-verify-artifacts` and a path's `verifyArtifacts: false` skip the check and the record says `artifactsVerified: false`. A kind that cannot verify warns with `NYL-PROMOTE-ARTIFACT-UNVERIFIED`; a target that also selects a unit whose result a promoted value replaces warns with `NYL-PROMOTE-REBUILT`"
author = "@NiklasRosenstein"

[[entries]]
id = "d7283997-e441-42de-bda2-c4d6da0a1e8a"
type = "fix"
description = "`nyl validate` reports a failing DeploymentTarget compile together with invalid units and PromotionPaths instead of stopping at the target, so a path whose source Environment was removed is named next to the target that no environment places any more; `nyl get --state-revision` pairs the other state ref's commit by `Nyl-Run-Id`, so a state whose commits share a second is read whole"
author = "@NiklasRosenstein"

[[entries]]
id = "851f8906-0f64-4ac7-879a-066975840ff0"
type = "feature"
description = "`nyl get states -e <env>` lists an environment's recorded states, newest first, with each state's desired, observed, and source commits, which units have a current receipt, and the attestations recorded for it. `nyl get promotion-candidates <path>` judges the path's source states with the rules `nyl promote` uses: the level each reaches, what it lacks, the values it would carry, the state `nyl promote` would take now or the code it would refuse with, and the state the path's record already names. `nyl get promotions -e <env>` lists the environment's PromotionRecords, the one its last run applied, and every promotion in its desired history. Each prints text, or a typed `StatesReport`, `PromotionCandidatesReport`, or `PromotionsReport` with `-o json`"
author = "@NiklasRosenstein"

[[entries]]
id = "6d690e8a-824e-427a-bd46-220c16cc2f0e"
type = "feature"
description = "`nyl status` shows the promotion lineage of an environment whose source a promotion chose: the path and sequence of the applied record, its source commit, the source state it promoted, and a newer record waiting for the next reconcile (`promotion: {path, sequence, sourceCommit, from, pendingSequence}` in JSON)"
author = "@NiklasRosenstein"

[[entries]]
id = "cbfd4925-827d-4ac2-9744-34de3b57f085"
type = "feature"
description = "An Environment with `source.fromPromotion.record: source` keeps its PromotionRecord in its own source: `nyl promote` writes the `promoted` block (the same record shape as in state) as one commit on the branch the entry worktree has checked out, carrying only the Environment's file, authored and committed by `--author`, and pushes it to the branch's upstream fast-forward only, never forced, writing nothing to the target's state; the report lists the commit under `commits.source`, and `--dry-run` checks that it could be written. A detached HEAD, a branch without an upstream or ahead of it, an untracked or changed Environment file, an inherited or flow-style `fromPromotion`, a push the remote refuses (such as branch protection), or a push that may have reached the remote exit 1 with `NYL-PROMOTE-SOURCE-UNWRITABLE`, each with its own fix; a push refused because the branch moved undoes the commit and exits 2 with `NYL-PROMOTE-SOURCE-REJECTED`. `plan`, `reconcile`, `build`, and multi-environment runs read the block through one shared path, check a block no run applied yet against its PromotionPath and the source state it names (`NYL-PROMOTION-RECORD-INVALID`), refuse a block whose sequence is below the applied one with `NYL-PROMOTION-SEQUENCE-OLDER`, so an older checkout never rolls the environment back, and refuse another record at the applied sequence; rolling back is a new promotion with `nyl promote <path> --revision`. `status` and `nyl get` show the block"
author = "@NiklasRosenstein"

[[entries]]
id = "435833cd-1b49-4831-b51f-ecb22a62939b"
type = "feature"
description = "Several paths into one environment: with `source.fromPromotion.paths` the source commit comes from the newest record on those paths, and path-less `fromPromotion` bindings follow the record that supplied it, never an older record of another path. Before writing, `nyl promote` checks that what it promotes contains every record another path wrote into the target since this path last promoted, per value and repository, by the commits' changes (`git cherry`: ancestors, clean cherry-picks, and single-commit squashes count; a squash of several commits does not). A promotion that would drop such commits writes nothing and exits 2 with `NYL-PROMOTE-SUPERSEDES`, naming each missing commit by subject and a range to copy; a value without a known source commit warns with `NYL-PROMOTE-UNCHECKED`. `--supersede [<repository>:]<commit or range>[=<reason>]` accepts missing commits as replaced and the record lists each one with its reason and who gave it; an entry with neither its own reason nor `--reason` exits 1 with `NYL-PROMOTE-SUPERSEDE-REASON`. A record whose commit cannot be fetched is unchecked unless `--supersede` names it, and a shallow clone exits 1 with `NYL-PROMOTE-SHALLOW-CLONE` (fetch with `fetch-depth: 0`). Repositories are named by their GitRepository, else by a normalized URL. A `record: source` block a run would refuse now refuses `nyl promote` too"
author = "@NiklasRosenstein"

[[entries]]
id = "a12a6673-a2cb-407c-8768-6fa6033d3d9c"
type = "feature"
description = "`nyl get promotions -e <env>` shows the record that supplies the environment's source and, for each `fromPromotion` binding of its units, the path and record it reads; `status`'s `pendingSequence` counts a newer record on any of the environment's source paths"
author = "@NiklasRosenstein"

[[entries]]
id = "0175c514-da53-4356-97f9-8807f3b98568"
type = "improvement"
description = "`nyl attest -e <env>` names the driver's reason in each `NYL-ATTESTATION-FAILED` warning, such as which Applications run another publication or are not Healthy, instead of only the attestation's name"
author = "@NiklasRosenstein"

[[entries]]
id = "866b869e-1ea0-46f0-9351-2d4a08c4eb51"
type = "feature"
description = "A PromotionPath that promotes only values takes each value from the state its consumer runs: a value selected as a publication's Release input (`input: /releases/<group>~1<release>/…`) is consumed by that Release's Application, so Applications synced to different publications by hand no longer block it, and the record names a value's own `state`. Only the consuming Application's own findings block its value (`unmatched`, a mix of revisions, not `Healthy` when `healthy` is required). A path's `coverage` is keyed by the publication unit: `coverage.<unit>.groups` and `coverage.<unit>.exclude` narrow the deployments (for a KubernetesPublication, its Applications and their ApplicationGroups) a source promotion counts toward that unit's attestations, and `coverage.<unit>.require` adds deployments that must meet them at whatever publication they run. Drivers gain `running_attestations`, `deployment_verdicts`, `receipt_publication`, `input_consumer`, and `deployments`; nothing new is persisted"
author = "@NiklasRosenstein"

[[entries]]
id = "386fc8e1-af12-4f5e-85dc-df08f18a9d6e"
type = "feature"
description = "`nyl validate`, `nyl plan`, `nyl reconcile`, `nyl promote`, and `nyl get promotion-candidates` check a PromotionPath's `coverage` against what each named unit runs, as its kind lists it (a KubernetesPublication renders its target, with placeholders for the bindings orchestration resolves and `fromPublication` inputs read fresh or from the cached branch): a unit the source environment does not declare, select, or enable, a unit whose kind runs no deployments, and a group or deployment the unit does not run fail with `NYL-PROMOTE-COVERAGE-UNKNOWN`, which lists the names the unit has; a coverage unit of an unregistered kind fails with `NYL-UNIT-KIND-UNKNOWN`; `groups` on a path that promotes only values, and any entry of a unit that records nothing per deployment (a KubernetesPublication without `observe`), fail with `NYL-PROMOTE-COVERAGE-INEFFECTIVE`. When the deployments cannot be listed, such as when the source's target does not render, `nyl validate` fails with `NYL-PROMOTE-COVERAGE-UNCHECKED` and the render error, and the other commands warn with it and carry on"
author = "@NiklasRosenstein"

[[entries]]
id = "c281f882-04ff-455b-848e-3421371a367f"
type = "breaking"
description = "For projects that tracked the development branch: a PromotionPath's `coverage` is now per publication unit, `coverage: {<unit>: {groups, exclude, require}}`, replacing the flat `coverage.applicationGroups`, `coverage.excludeApplications`, and `coverage.requireApplications` that no release shipped; the flat fields are refused. Move each list under the publication unit whose deployments it names. The PromotionRecord keeps its `excludedApplications` field, now every unit's `exclude`, sorted, each name once. Promotion refusals and fixes say deployment instead of Application, and a `require` name no attestation lists is reported under its unit instead of `environment`"
author = "@NiklasRosenstein"

[[entries]]
id = "995afde4-f1a8-4fd0-9b00-8aee26c51aa8"
type = "breaking"
description = "`nyl promote` counts a publication's `accepted` and `healthy` only for its current receipt, because they say what runs now: an older state no longer qualifies through them once a newer receipt is published, and a failing newest one refuses the promotion with `NYL-PROMOTE-NO-EVIDENCE` and the driver's reason instead of falling back to an older state that once passed. The refusal names that older state; `--state-revision` (or `--revision`) promotes it on the attestations recorded for it. Environment-wide, external, and other units' attestations still let the newest passing state win, and a publication without `observe` is unaffected. `nyl get promotion-candidates` reports such a state's gap as `not-running`"
author = "@NiklasRosenstein"

[[entries]]
id = "a96f7920-876f-4f46-b0d4-f358aeff08a5"
type = "feature"
description = "`nyl status` warns with `NYL-ATTESTATION-FAILED` and the attestation's reason for every attestation that fails for what the environment runs: a unit's for its current receipt and an environment-wide one for the current state. `nyl plan` of an environment that two or more PromotionPaths promote into warns with `NYL-PROMOTE-UNCHECKED` for each value they both carry that has no known source commit, which the supersede check cannot compare"
author = "@NiklasRosenstein"
