[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nyl"
dynamic = ["version"]
description = "Render and inspect Kubernetes manifests with the Nyl CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Niklas Rosenstein"}]
dependencies = ["ruamel.yaml>=0.18.6,<0.19"]

[project.urls]
Homepage = "https://niklasrosenstein.github.io/nyl/"
Repository = "https://github.com/NiklasRosenstein/nyl"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.15,<2",
  "pip>=25",
  "pytest>=8,<10",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "src/nyl/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/nyl", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nyl", "scripts/version.py"]

[tool.pytest.ini_options]
addopts = "-n auto --maxprocesses=4"
testpaths = ["tests"]
