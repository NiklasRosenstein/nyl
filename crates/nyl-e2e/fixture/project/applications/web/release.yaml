apiVersion: k8s.nyl/v1
kind: Release
metadata:
  name: web
  namespace: '{{ inputs.namespace }}'
spec:
  inputs:
    image: {type: string}
    databaseHost: {type: string}
    namespace: {type: string}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: '{{ inputs.namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          # The digest the image unit pushed to the local registry, which the
          # kind nodes resolve to the registry container.
          image: '{{ inputs.image }}'
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATABASE_HOST
              value: '{{ inputs.databaseHost }}'
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: '{{ inputs.namespace }}'
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# A hook: Argo CD runs it after the sync, and the direct reconciler runs it the
# same way, once the workload above is healthy. The Release does not own it, so it
# is neither pruned nor reported as drift when it is gone.
apiVersion: batch/v1
kind: Job
metadata:
  name: web-smoke
  namespace: '{{ inputs.namespace }}'
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: '{{ inputs.image }}'
          command: ["true"]
