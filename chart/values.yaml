# Default values for argocd-with-nyl Helm chart

# ArgoCD namespace settings
namespace:
  create: true
  name: argocd

# ArgoCD Helm chart configuration
argocd:
  # ArgoCD Helm chart repository and version
  chart:
    repository: https://argoproj.github.io/argo-helm
    name: argo-cd
    version: "9.4.6"
  
  # ArgoCD Helm chart values (merged with nyl sidecar configuration)
  values: {}

# Nyl Config Management Plugin settings
nyl:
  # Nyl CMP container image
  image:
    repository: ghcr.io/niklasrosenstein/nyl
    tag: develop
    pullPolicy: IfNotPresent
  
  # Nyl environment variables
  env:
    NYL_CACHE_DIR: /tmp/nyl
  
  # Security context for the Nyl CMP container
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
  
  # Secret containing environment variables for the Nyl CMP container
  envSecret:
    enabled: false
    name: argocd-nyl-env
