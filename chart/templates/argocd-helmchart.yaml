apiVersion: nyl.niklasrosenstein.github.com/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: {{ .Values.namespace.name }}
spec:
  chart:
    repository: {{ .Values.argocd.chart.repository }}
    name: {{ .Values.argocd.chart.name }}
    version: {{ .Values.argocd.chart.version | quote }}
  values:
    {{- $defaultValues := .Values.argocd.values }}
    
    {{- /* Build volume mounts list */ -}}
    {{- $volumeMounts := list }}
    {{- $volumeMounts = append $volumeMounts (dict "mountPath" "/var/run/argocd" "name" "var-files") }}
    {{- $volumeMounts = append $volumeMounts (dict "mountPath" "/home/argocd/cmp-server/plugins" "name" "plugins") }}
    {{- $volumeMounts = append $volumeMounts (dict "mountPath" "/tmp" "name" "cmp-tmp") }}
    
    {{- /* Build environment variables list */ -}}
    {{- $envVars := list }}
    {{- $envVars = append $envVars (dict "name" "NYL_CACHE_DIR" "value" .Values.nyl.env.NYL_CACHE_DIR) }}
    
    {{- /* Build Nyl container configuration */ -}}
    {{- $nylContainer := dict 
      "name" "nyl-v2"
      "image" (printf "%s:%s" .Values.nyl.image.repository .Values.nyl.image.tag)
      "imagePullPolicy" .Values.nyl.image.pullPolicy
      "securityContext" .Values.nyl.securityContext
      "volumeMounts" $volumeMounts
      "env" $envVars
    }}
    
    {{- /* Add envFrom if secret is enabled */ -}}
    {{- if .Values.nyl.envSecret.enabled }}
    {{- $_ := set $nylContainer "envFrom" (list (dict "secretRef" (dict "name" .Values.nyl.envSecret.name))) }}
    {{- end }}
    
    {{- /* Build repoServer configuration */ -}}
    {{- $repoServerValues := dict "extraContainers" (list $nylContainer) "volumes" (list (dict "name" "cmp-tmp" "emptyDir" dict)) }}
    {{- $repoServerValues = merge $repoServerValues (default dict $defaultValues.repoServer) }}
    
    {{- /* Merge all values */ -}}
    {{- $mergedValues := merge (dict "repoServer" $repoServerValues) $defaultValues }}
    {{- $mergedValues | toYaml | nindent 4 }}
