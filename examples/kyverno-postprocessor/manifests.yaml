---
# Example Service resource to be mutated by Kyverno
apiVersion: v1
kind: Service
metadata:
  name: my-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: my-app
  ports:
    - port: 80
      targetPort: 8080
---
# Example Deployment to be mutated
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          ports:
            - containerPort: 8080
---
# Kyverno policy Nyl applies to every resource in this file while rendering
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: update-load-balancer-class
  annotations:
    k8s.nyl/apply-policy-scope: Global
spec:
  rules:
    - name: add-loadbalancer-class
      match:
        any:
          - resources:
              kinds:
                - Service
      mutate:
        patchStrategicMerge:
          spec:
            (type): LoadBalancer
            allocateLoadBalancerNodePorts: false
            loadBalancerClass: ngrok
---
# Another Kyverno policy to add labels
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-managed-by-label
  annotations:
    k8s.nyl/apply-policy-scope: Global
spec:
  rules:
    - name: add-label
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Service
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              managed-by: nyl
