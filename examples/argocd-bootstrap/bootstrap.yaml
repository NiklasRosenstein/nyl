apiVersion: gitops.nyl/v1
kind: Release
metadata:
  name: argocd
  namespace: argocd
---
# HelmChart referencing the OCI-published nyl chart
apiVersion: nyl.niklasrosenstein.github.com/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  chart:
    repository: "oci://ghcr.io/{{ env.NYL_CHART_OWNER | default('niklasrosenstein') }}/nyl/chart"
    version: "{{ env.NYL_CHART_VERSION | default('0.1.0') }}"
  values:
    nyl:
      image:
        tag: "{{ env.NYL_IMAGE_TAG | default('develop') }}"
        pullPolicy: Always
---
# ApplicationGenerator for ArgoCD self-management
apiVersion: argocd.nyl.niklasrosenstein.github.com/v1
kind: ApplicationGenerator
metadata:
  name: bootstrap
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: "{{ env.NYL_REPO_URL }}"
    targetRevision: "{{ env.NYL_TARGET_REVISION | default('HEAD') }}"
    path: examples/argocd-bootstrap
    pluginEnv:
      NYL_CHART_OWNER: "{{ env.NYL_CHART_OWNER | default('niklasrosenstein') }}"
      NYL_CHART_VERSION: "{{ env.NYL_CHART_VERSION | default('0.1.0') }}"
      NYL_IMAGE_TAG: "{{ env.NYL_IMAGE_TAG | default('develop') }}"
      NYL_REPO_URL: "{{ env.NYL_REPO_URL }}"
      NYL_TARGET_REVISION: "{{ env.NYL_TARGET_REVISION | default('HEAD') }}"
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# Create the argocd namespace
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  # labels:
  #   test: foo
