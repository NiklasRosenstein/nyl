name: Rust CI

on:
  push:
    branches: [develop]
    tags: ["*-rust"]
    paths:
      - "nyl/**"
      - "argocd-cmp/**"  # Trigger if Docker needs binaries
      - ".github/workflows/ci-rust.yaml"
      - ".github/workflows/ci-docker.yaml"  # Trigger if Docker workflow changes
      - ".github/workflows/_build-rust.yaml"
  pull_request:
    branches: [develop]
    paths:
      - "nyl/**"
      - "argocd-cmp/**"  # Trigger if Docker needs binaries
      - ".github/workflows/ci-rust.yaml"
      - ".github/workflows/ci-docker.yaml"  # Trigger if Docker workflow changes
      - ".github/workflows/_build-rust.yaml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: nyl

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run tests
        run: cargo test --all-features

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  # Detect which paths changed (for conditional build)
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'argocd-cmp/**'
              - '.github/workflows/ci-docker.yaml'
              - '.github/workflows/_build-rust.yaml'

  # Unified build job - builds ALL targets when needed
  # Runs on: develop/tags OR when Docker-related files change
  # This ensures binaries are always available for ci-docker.yaml
  build-all:
    name: Build All Targets
    needs: changes
    # Run on develop/tags OR when Docker files change (ensuring artifacts available for Docker workflow)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/_build-rust.yaml
    with:
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu"},
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-musl"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      upload-artifacts: true

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run benchmarks
        run: cargo bench --no-fail-fast
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: nyl/target/criterion

  # Call Docker workflow after artifacts are ready
  # This ensures Docker CI has artifacts available (eliminates race condition)
  trigger-docker:
    name: Trigger Docker Build
    needs: [changes, build-all]
    # Only trigger when Docker-related files changed
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/ci-docker.yaml
