# Docker Image Build and Push
#
# CRITICAL: This workflow does NOT build any Rust binaries!
# It ALWAYS downloads pre-built binaries from ci-rust.yaml artifacts.
# This eliminates 100% of binary build duplication.
#
# Triggers:
# - workflow_run: After ci-rust.yaml completes (on develop)
# - push: Direct push to develop/tags (if ci-rust didn't run)
# - workflow_call: Called by ci-rust.yaml after artifacts are uploaded (eliminates race condition)
#
# Dependencies:
# - Requires ci-rust.yaml to have run and uploaded artifacts
# - Downloads: nyl-x86_64-unknown-linux-musl, nyl-aarch64-unknown-linux-musl

name: Docker CI

on:
  # Trigger after ci-rust.yaml completes on develop
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [develop]

  # Direct triggers (for tags or manual runs)
  push:
    branches: [develop]
    tags: ["*"]
    paths:
      - "docker/**"
      - "chart/**"
      - ".github/workflows/ci-docker.yaml"

  # Called by ci-rust.yaml after artifacts are uploaded
  workflow_call:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Skip if workflow_run was triggered but ci-rust failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download pre-built binaries from ci-rust.yaml artifacts
      # This is the ONLY source of binaries - we NEVER build here!
      - name: Download x86_64 binary artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./artifacts/amd64
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: fail

      - name: Download aarch64 binary artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-aarch64-unknown-linux-musl
          path: ./artifacts/arm64
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: fail

      # workflow_call (from ci-rust): artifacts are in the current run.
      # NOTE: github.event_name inherits the caller's event (e.g. pull_request),
      # it does NOT become 'workflow_call', so we match on everything else.
      - name: Download x86_64 binary artifact (workflow_call)
        if: github.event_name != 'workflow_run' && github.event_name != 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./artifacts/amd64
          run_id: ${{ github.run_id }}
          if_no_artifact_found: fail

      - name: Download aarch64 binary artifact (workflow_call)
        if: github.event_name != 'workflow_run' && github.event_name != 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-aarch64-unknown-linux-musl
          path: ./artifacts/arm64
          run_id: ${{ github.run_id }}
          if_no_artifact_found: fail

      # push: ci-docker was triggered independently, so we need to find the
      # ci-rust run on this branch to pull artifacts from.
      - name: Download x86_64 binary artifact (push)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./artifacts/amd64
          branch: ${{ github.ref_name }}
          if_no_artifact_found: fail

      - name: Download aarch64 binary artifact (push)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-aarch64-unknown-linux-musl
          path: ./artifacts/arm64
          branch: ${{ github.ref_name }}
          if_no_artifact_found: fail

      - name: Debug artifact contents
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"
          echo "run_id: ${{ github.run_id }}"
          find ./artifacts -type f 2>/dev/null || echo "no ./artifacts directory"

      # Prepare binaries for Docker build
      # Dockerfile expects: nyl-amd64 and nyl-arm64 in context root
      - name: Prepare binaries for Docker
        run: |
          mkdir -p .
          mv artifacts/amd64/nyl nyl-amd64
          mv artifacts/arm64/nyl nyl-arm64
          chmod +x nyl-amd64 nyl-arm64

          # Verify binaries exist and are executable
          ls -lh nyl-amd64 nyl-arm64
          file nyl-amd64 nyl-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Helm
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package and push Helm chart
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          # Match the short SHA format used by docker/metadata-action type=sha.
          # workflow_run: github.sha is NOT the triggering commit; use head_sha.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${{ github.sha }}"
          fi
          SHORT_SHA="${FULL_SHA:0:7}"

          # OCI registry paths must be lowercase.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          sed -i "s|tag: .*|tag: sha-${SHORT_SHA}|" chart/values.yaml

          # Use the SHA as a semver pre-release suffix so each push produces
          # a distinct OCI tag (e.g. 0.1.0-sha-abc1234) instead of
          # overwriting the base version every time.
          BASE_VERSION=$(helm show chart chart/ | grep '^version:' | awk '{print $2}')
          helm package chart/ --version="${BASE_VERSION}-sha-${SHORT_SHA}"
          helm push chart-*.tgz oci://ghcr.io/${OWNER}/nyl
