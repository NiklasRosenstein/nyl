# Docker Image Build and Push
#
# CRITICAL: This workflow does NOT build any Rust binaries!
# It ALWAYS downloads pre-built binaries from ci-rust.yaml artifacts.
# This eliminates 100% of binary build duplication.
#
# Triggers:
# - workflow_run: After ci-rust.yaml completes (on develop)
# - push: Direct push to develop/tags (if ci-rust didn't run)
# - workflow_call: Called by ci-rust.yaml after artifacts are uploaded (eliminates race condition)
#
# Dependencies:
# - Requires ci-rust.yaml to have run and uploaded artifacts
# - Downloads: nyl-x86_64-unknown-linux-gnu, nyl-aarch64-unknown-linux-gnu

name: Docker CI

on:
  # Trigger after ci-rust.yaml completes on develop
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [develop]

  # Direct triggers (for tags or manual runs)
  push:
    branches: [develop]
    tags: ["*"]
    paths:
      - "argocd-cmp/**"
      - ".github/workflows/ci-docker.yaml"

  # Called by ci-rust.yaml after artifacts are uploaded
  workflow_call:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Skip if workflow_run was triggered but ci-rust failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download pre-built binaries from ci-rust.yaml artifacts
      # This is the ONLY source of binaries - we NEVER build here!
      - name: Download x86_64 binary artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-gnu
          path: ./artifacts/amd64
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: fail

      - name: Download aarch64 binary artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-aarch64-unknown-linux-gnu
          path: ./artifacts/arm64
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: fail

      # workflow_call: ci-docker runs inside the same workflow run as ci-rust,
      # so artifacts are already available via the standard download action.
      - name: Download x86_64 binary artifact (workflow_call)
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          name: nyl-x86_64-unknown-linux-gnu
          path: ./artifacts/amd64

      - name: Download aarch64 binary artifact (workflow_call)
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          name: nyl-aarch64-unknown-linux-gnu
          path: ./artifacts/arm64

      # push: ci-docker was triggered independently, so we need to find the
      # ci-rust run on this branch to pull artifacts from.
      - name: Download x86_64 binary artifact (push)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-gnu
          path: ./artifacts/amd64
          branch: ${{ github.ref_name }}
          if_no_artifact_found: fail

      - name: Download aarch64 binary artifact (push)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-aarch64-unknown-linux-gnu
          path: ./artifacts/arm64
          branch: ${{ github.ref_name }}
          if_no_artifact_found: fail

      # Prepare binaries for Docker build
      # Dockerfile expects: nyl-amd64 and nyl-arm64 in context root
      - name: Prepare binaries for Docker
        run: |
          mkdir -p .
          mv artifacts/amd64/nyl nyl-amd64
          mv artifacts/arm64/nyl nyl-arm64
          chmod +x nyl-amd64 nyl-arm64

          # Verify binaries exist and are executable
          ls -lh nyl-amd64 nyl-arm64
          file nyl-amd64 nyl-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/argocd-cmp
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: argocd-cmp/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Only push on non-PR events (develop pushes, tags)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
