name: Python

on:
  pull_request:
    paths:
      - 'python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'nyl/src/**'
      - 'nyl/Cargo.toml'
      - 'mise.toml'
      - '.github/workflows/python.yaml'
  push:
    branches: [develop]
    tags: ['v*']
    paths:
      - 'python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'nyl/src/**'
      - 'nyl/Cargo.toml'
      - 'mise.toml'
      - '.github/workflows/python.yaml'

permissions:
  contents: read

jobs:
  check:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.14']
        include:
          - os: windows-latest
            python: '3.11'
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Stamp Cargo-derived version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            uv run --no-sync python scripts/version.py --tag "$RELEASE_TAG"
          else
            uv run --no-sync python scripts/version.py
          fi
      - name: Lint and type check
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy
      - name: Build checkout CLI and test including independent package builds
        run: uv run --no-sync pytest
      - name: Build release artifacts
        run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'NiklasRosenstein/nyl'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nyl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
