name: Rust CI

on:
  push:
    branches: [develop, main, "nr/*"]
    tags: ["*-rust"]
  pull_request:
    branches: [develop, main]
    paths:
      - "nyl-rs/**"
      - ".github/workflows/rust.yaml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: nyl-rs

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl-rs
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl-rs
      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
      - uses: dtolnay/rust-toolchain@stable
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        with:
          workspaces: nyl-rs
      - name: Install cross-compilation tools
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install musl tools
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross for aarch64-musl
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary (cross)
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      - name: Build release binary
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check binary size (Unix)
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && runner.os != 'Windows'
        run: |
          size=$(stat -f%z target/${{ matrix.target }}/release/nyl 2>/dev/null || stat -c%s target/${{ matrix.target }}/release/nyl)
          echo "Binary size: $((size / 1024 / 1024))MB"
          if [ $size -gt 20971520 ]; then
            echo "::error::Binary size exceeds 20MB limit"
            exit 1
          fi
      - name: Verify static linking (musl)
        if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && contains(matrix.target, 'musl')
        run: |
          binary="target/${{ matrix.target }}/release/nyl"
          if ldd "$binary" 2>&1 | grep -q "not a dynamic executable"; then
            echo "✓ Binary is statically linked"
          else
            echo "✗ Binary has dynamic dependencies:"
            ldd "$binary"
            exit 1
          fi
      - name: Upload artifact
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nyl-${{ matrix.target }}
          path: |
            nyl-rs/target/${{ matrix.target }}/release/nyl
            nyl-rs/target/${{ matrix.target }}/release/nyl.exe
          if-no-files-found: ignore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl-rs
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl-rs
      - name: Run benchmarks
        run: cargo bench --no-fail-fast
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: nyl-rs/target/criterion
