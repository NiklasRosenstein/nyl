name: Rust CI

on:
  push:
    branches: [develop, main, "nr/*"]
    tags: ["*-rust"]
  pull_request:
    paths:
      - "nyl/**"
      - ".github/workflows/rust.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: nyl

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run tests
        # Use single thread to avoid race conditions from tests that change global state (current directory)
        run: cargo test --all-features -- --test-threads=1

  # Lightweight build for feature branches - just one target for validation
  build-quick:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/')
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Build release binary
        run: cargo build --release --target ${{ env.TARGET }}
      - name: Check binary size
        run: |
          size=$(stat -c%s ../target/${{ env.TARGET }}/release/nyl)
          echo "Binary size: $((size / 1024 / 1024))MB ($size bytes)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyl-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/nyl

  # Full build matrix for develop branch and releases
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross for aarch64-musl
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      - name: Build release binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check binary size
        run: |
          size=$(stat -f%z ../target/${{ matrix.target }}/release/nyl 2>/dev/null || stat -c%s ../target/${{ matrix.target }}/release/nyl)
          echo "Binary size: $((size / 1024 / 1024))MB"
          if [ $size -gt 20971520 ]; then
            echo "::error::Binary size exceeds 20MB limit"
            exit 1
          fi
      - name: Verify static linking (musl)
        if: contains(matrix.target, 'musl')
        run: |
          binary="../target/${{ matrix.target }}/release/nyl"
          if ldd "$binary" 2>&1 | grep -q "not a dynamic executable"; then
            echo "✓ Binary is statically linked"
          else
            echo "✗ Binary has dynamic dependencies:"
            ldd "$binary"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyl-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nyl

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block PRs on known vulnerabilities
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0
      - name: Run security audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0012 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2025-0134

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl
      - name: Run benchmarks
        run: cargo bench --no-fail-fast
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion
