# Integration Test: ArgoCD Repository Secret Discovery
#
# This workflow validates that Nyl can discover credentials from ArgoCD
# repository secrets when running inside a Kubernetes cluster.
#
# It tests:
# - ArgoCD-format repository secrets are discovered during `nyl render`
# - ApplicationGenerator resources work with discovered credentials
# - Credential discovery is best-effort and non-blocking

name: Integration CI - ArgoCD Credential Discovery

on:
  workflow_run:
    workflows: ["Docker CI"]
    types: [completed]
    branches: [develop]

  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to test (leave empty for latest develop)'
        required: false
        type: string

concurrency:
  group: integration-test-argocd-creds
  cancel-in-progress: true

jobs:
  argocd-credential-discovery-test:
    name: ArgoCD Credential Discovery
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Determine test SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.sha }}" ]; then
              FULL_SHA="${{ inputs.sha }}"
            else
              FULL_SHA="${{ github.sha }}"
            fi
          else
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "Testing SHA: ${FULL_SHA}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.full_sha }}

      - name: Download Nyl binary (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin
          commit: ${{ github.event.workflow_run.head_sha }}
          if_no_artifact_found: fail

      - name: Download Nyl binary (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin
          commit: ${{ steps.sha.outputs.full_sha }}
          if_no_artifact_found: fail

      - name: Install Nyl
        run: |
          chmod +x ./nyl-bin/nyl
          sudo mv ./nyl-bin/nyl /usr/local/bin/nyl
          nyl --version

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          cpus: 2
          memory: 4096
          kubernetes-version: v1.29.0
          driver: docker

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create ArgoCD namespace
        run: |
          kubectl create namespace argocd

      - name: Create ArgoCD repository secrets
        run: |
          # Create an ArgoCD-format repository secret for HTTPS credentials.
          # This secret matches the format ArgoCD uses for private repositories.
          # See: https://argo-cd.readthedocs.io/en/stable/user-guide/private-repositories/
          kubectl create secret generic repo-nyl-https \
            --namespace=argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/NiklasRosenstein/nyl.git \
            --from-literal=username=test-user \
            --from-literal=password=test-token
          kubectl label secret repo-nyl-https \
            --namespace=argocd \
            argocd.argoproj.io/secret-type=repository

          # Create an ArgoCD-format repo-creds secret (credential template).
          # This matches any repository under the github.com/NiklasRosenstein org.
          kubectl create secret generic creds-github-org \
            --namespace=argocd \
            --from-literal=type=git \
            --from-literal=url="https://github.com/NiklasRosenstein/*" \
            --from-literal=username=org-user \
            --from-literal=password=org-token
          kubectl label secret creds-github-org \
            --namespace=argocd \
            argocd.argoproj.io/secret-type=repo-creds

          echo "Created ArgoCD repository secrets:"
          kubectl get secrets -n argocd -l argocd.argoproj.io/secret-type

      - name: Verify secrets are accessible
        run: |
          echo "=== Repository secrets ==="
          kubectl get secrets -n argocd \
            -l argocd.argoproj.io/secret-type=repository \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'

          echo "=== Repo-creds secrets ==="
          kubectl get secrets -n argocd \
            -l argocd.argoproj.io/secret-type=repo-creds \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'

      - name: Test nyl render with ApplicationGenerator (credential discovery)
        run: |
          set -euo pipefail
          cd tests/fixtures/argocd-credential-discovery

          echo "=== Running nyl render with verbose output ==="
          # Run nyl render with verbose logging to see credential discovery messages.
          # nyl render must succeed (exit 0); tee preserves the exit code via pipefail.
          nyl render --verbose 2>&1 | tee /tmp/nyl-render-output.txt

          echo ""
          echo "=== Render output ==="
          cat /tmp/nyl-render-output.txt

          # The ApplicationGenerator references examples/argocd-bootstrap which
          # contains a NylRelease, so we expect at least one Application manifest.
          if grep -q "kind: Application" /tmp/nyl-render-output.txt; then
            echo "SUCCESS: ApplicationGenerator produced Application manifests"
          else
            echo "ERROR: No Application manifests found in render output"
            echo "The ApplicationGenerator should have been processed to produce"
            echo "ArgoCD Application resources."
            exit 1
          fi

          echo "SUCCESS: nyl render completed successfully with credential discovery"

      - name: Test nyl render with plain ConfigMap (no credentials needed)
        run: |
          set -euo pipefail
          # Create a temporary test directory
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/nyl-project.yaml" <<'EOF'
          settings: {}
          profiles:
            default:
              values: {}
          EOF

          cat > "$TMPDIR/secrets.yaml" <<'EOF'
          provider: "null"
          EOF

          cat > "$TMPDIR/test.yaml" <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-config
          data:
            key: value
          EOF

          echo "=== Running nyl render for plain ConfigMap ==="
          nyl render "$TMPDIR" --verbose 2>&1 | tee /tmp/nyl-render-configmap.txt

          # Verify ConfigMap is in the output
          if grep -q "kind: ConfigMap" /tmp/nyl-render-configmap.txt; then
            echo "SUCCESS: ConfigMap rendered correctly"
          else
            echo "ERROR: ConfigMap not found in render output"
            exit 1
          fi

      - name: Verify credential discovery logging
        run: |
          set -euo pipefail
          echo "=== Checking credential discovery in verbose logs ==="
          # The verbose output should contain credential discovery log messages.
          # Because we created ArgoCD secrets and the cluster is accessible,
          # the discovery should have found credentials.
          if grep -qi "credential\|argocd\|discover" /tmp/nyl-render-output.txt; then
            echo "Found credential discovery log messages in output:"
            grep -i "credential\|argocd\|discover" /tmp/nyl-render-output.txt || true
          else
            echo "NOTE: No explicit credential discovery messages found."
            echo "This is acceptable if discovery succeeded silently."
          fi

          echo ""
          echo "Integration test completed successfully!"

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== DEBUG: Integration test failed ==="
          echo "--- Kubernetes secrets ---"
          kubectl get secrets -n argocd -o yaml || true
          echo "--- Kubernetes events ---"
          kubectl get events -n argocd --sort-by='.lastTimestamp' | tail -20 || true
          echo "--- Nyl render output ---"
          cat /tmp/nyl-render-output.txt 2>/dev/null || echo "No render output"
          echo "--- Nyl ConfigMap render output ---"
          cat /tmp/nyl-render-configmap.txt 2>/dev/null || echo "No ConfigMap render output"
