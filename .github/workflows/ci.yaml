name: CI

on:
  pull_request:
    branches: [develop, 'feat/m4-*']
  push:
    branches: [develop]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      # The Cargo workspace is the repository root, so its target directory is
      # ./target (the default). Only develop saves caches; pull requests restore
      # them, which keeps the repository under the Actions cache size limit.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Format check
        working-directory: nyl
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: nyl
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit
        run: cargo binstall cargo-audit --no-confirm --disable-strategies compile --only-signed --disable-telemetry
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Security audit
        run: cargo audit

  test-renovate-matchers:
    name: Test Renovate Matchers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Renovate matcher tests
        run: bash scripts/test-renovate-matchers.sh

  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Windows Defender scans every file the build writes and the tests'
      # temporary Git repositories synchronously, which dominated the Windows
      # job. A trusted Dev Drive (ReFS) scans asynchronously, so the target
      # directory and the temporary directory move onto one.
      - name: Set up a Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          trusted-dev-drive: true
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      # The cache action restores ./target, so it links to the Dev Drive.
      - name: Keep the build on the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:DEV_DRIVE/tmp", "$env:DEV_DRIVE/target" | Out-Null
          New-Item -ItemType Junction -Path target -Target "$env:DEV_DRIVE/target" | Out-Null
          $miseTemp = Join-Path $env:LOCALAPPDATA "Temp"
          New-Item -ItemType Directory -Force $miseTemp | Out-Null
          "NYL_MISE_TMP=$miseTemp" >> $env:GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      # The Cargo workspace is the repository root, so its target directory is
      # ./target (the default). Only develop saves caches; pull requests restore
      # them, which keeps the repository under the Actions cache size limit.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install pinned Helm and kubeconform
        uses: jdx/mise-action@v3
        # mise installs with a rename; its temporary files must share the Windows install volume.
        env:
          TMP: ${{ env.NYL_MISE_TMP || runner.temp }}
          TEMP: ${{ env.NYL_MISE_TMP || runner.temp }}
        with:
          install_args: helm kubeconform

      # Linux runners keep /tmp on a network disk; the tests' throwaway
      # repositories, clones, and worktrees go to the RAM disk instead.
      - name: Keep temporary files in memory
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"

      # Tests create throwaway Git repositories and push to them hundreds of
      # times; syncing each pack and ref to disk dominated the Linux runners'
      # test time, so the test step turns Git's disk sync off.
      - name: Run tests
        working-directory: nyl
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.fsync
          GIT_CONFIG_VALUE_0: none
        run: |
          cargo test --workspace --features nyl/test-clock,nyl/test-kinds
          cargo test -p nyl --features tier2 --test scenario_harness_test

  native-tools:
    name: Native tools (M4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Run required native driver and binary scenarios
        run: |
          cargo test -p nyl-drivers --features native-tests --test terraform_native_test

  build-linux-musl:
    name: Build Linux musl binaries
    uses: ./.github/workflows/_build-rust.yaml
    with:
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-musl"}
        ]
      upload-artifacts: true
      # Thin LTO, like the cargo-dist release binaries: fat LTO's whole-program
      # optimisation is the slowest step of these builds and cannot be cached.
      profile: dist

  package-image:
    name: Build CI image
    needs: [build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x86_64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: nyl-x86_64-unknown-linux-musl
          path: ./artifacts/amd64

      - name: Download aarch64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: nyl-aarch64-unknown-linux-musl
          path: ./artifacts/arm64

      - name: Prepare binaries
        run: |
          mv artifacts/amd64/nyl nyl-amd64
          mv artifacts/arm64/nyl nyl-arm64
          chmod +x nyl-amd64 nyl-arm64
          ls -lh nyl-amd64 nyl-arm64

      - name: Compute build metadata
        id: vars
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          CAN_PUSH="true"
          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          REF="${{ github.ref }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            FULL_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${FULL_SHA:0:7}"
            PR_NUMBER="${{ github.event.number }}"
            CANONICAL_VERSION="0.0.0-pr.${PR_NUMBER}.sha.g${SHORT_SHA}"
            CAN_PUSH=$([ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && echo "false" || echo "true")
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG_VERSION="${REF_NAME#v}"
            if [ -z "$TAG_VERSION" ]; then
              echo "error: tag ${REF_NAME} does not contain a version after the 'v' prefix" >&2
              exit 1
            fi
            if [[ "$TAG_VERSION" == *+* ]]; then
              echo "error: canonical version \"$TAG_VERSION\" contains '+' which is not allowed for Docker tags" >&2
              exit 1
            fi
            CANONICAL_VERSION="$TAG_VERSION"
            CAN_PUSH="true"
          else
            CANONICAL_VERSION="0.0.0-dev.sha.g${SHORT_SHA}"
            CAN_PUSH="true"
          fi

          IMAGE_TAG="$CANONICAL_VERSION"
          IMAGE_TAGS=$'ghcr.io/'"${REPO_LC}"':'"${IMAGE_TAG}"$'\n''ghcr.io/'"${REPO_LC}"':sha-'"${SHORT_SHA}"

          echo "can_push=${CAN_PUSH}" >> "$GITHUB_OUTPUT"
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.vars.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke tests
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag nyl-ci:test \
            --file docker/Dockerfile \
            .

      - name: Smoke test image tools
        run: |
          docker run --rm nyl-ci:test
          docker run --rm nyl-ci:test nyl --version
          docker run --rm nyl-ci:test helm version
          docker run --rm nyl-ci:test git --version
          docker run --rm nyl-ci:test sops --version
          docker run --rm nyl-ci:test kyverno version
          docker run --rm nyl-ci:test kubeconform -v

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.vars.outputs.can_push == 'true' }}
          tags: ${{ steps.vars.outputs.image_tags }}

  build-all-platform-binaries:
    name: Build all platform binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build-linux-musl]
    uses: ./.github/workflows/_build-rust.yaml
    with:
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      upload-artifacts: true

  integration-minikube:
    name: Integration tests (Minikube)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    needs: [build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Nyl x86_64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin

      - name: Install Nyl
        run: |
          chmod +x ./nyl-bin/nyl
          sudo mv ./nyl-bin/nyl /usr/local/bin/nyl
          nyl --version

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          cpus: 2
          memory: 4096
          kubernetes-version: v1.29.0
          driver: docker

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run kind filtering and append-release test
        run: |
          cd integrationtests
          ./test-kind-filtering-append-release.sh

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== DEBUG: Integration tests failed ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
          kubectl get pods -A -o wide || true
          kubectl describe pods -A || true
