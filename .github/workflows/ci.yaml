name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-crates-io:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish nyl
        working-directory: nyl
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl

      - name: Format check
        working-directory: nyl
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: nyl
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit
        run: cargo binstall cargo-audit --no-confirm --disable-strategies compile --only-signed --disable-telemetry
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Security audit
        run: cargo audit

  test-renovate-matchers:
    name: Test Renovate Matchers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Renovate matcher tests
        run: bash scripts/test-renovate-matchers.sh

  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Run tests
        working-directory: nyl
        run: cargo test --all-features

  build-linux-musl:
    name: Build Linux musl binaries
    uses: ./.github/workflows/_build-rust.yaml
    with:
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-musl"}
        ]
      upload-artifacts: true

  package-image:
    name: Build CI image
    needs: [build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x86_64 musl binary
        uses: actions/download-artifact@v4
        with:
          name: nyl-x86_64-unknown-linux-musl
          path: ./artifacts/amd64

      - name: Download aarch64 musl binary
        uses: actions/download-artifact@v4
        with:
          name: nyl-aarch64-unknown-linux-musl
          path: ./artifacts/arm64

      - name: Prepare binaries
        run: |
          mv artifacts/amd64/nyl nyl-amd64
          mv artifacts/arm64/nyl nyl-arm64
          chmod +x nyl-amd64 nyl-arm64
          ls -lh nyl-amd64 nyl-arm64

      - name: Compute build metadata
        id: vars
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          CAN_PUSH="true"
          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          REF="${{ github.ref }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            FULL_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${FULL_SHA:0:7}"
            PR_NUMBER="${{ github.event.number }}"
            CANONICAL_VERSION="0.0.0-pr.${PR_NUMBER}.sha.g${SHORT_SHA}"
            CAN_PUSH=$([ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && echo "false" || echo "true")
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG_VERSION="${REF_NAME#v}"
            if [ -z "$TAG_VERSION" ]; then
              echo "error: tag ${REF_NAME} does not contain a version after the 'v' prefix" >&2
              exit 1
            fi
            if [[ "$TAG_VERSION" == *+* ]]; then
              echo "error: canonical version \"$TAG_VERSION\" contains '+' which is not allowed for Docker tags" >&2
              exit 1
            fi
            CANONICAL_VERSION="$TAG_VERSION"
            CAN_PUSH="true"
          else
            CANONICAL_VERSION="0.0.0-dev.sha.g${SHORT_SHA}"
            CAN_PUSH="true"
          fi

          IMAGE_TAG="$CANONICAL_VERSION"
          IMAGE_TAGS=$'ghcr.io/'"${REPO_LC}"':'"${IMAGE_TAG}"$'\n''ghcr.io/'"${REPO_LC}"':sha-'"${SHORT_SHA}"

          echo "can_push=${CAN_PUSH}" >> "$GITHUB_OUTPUT"
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.vars.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke tests
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag nyl-ci:test \
            --file docker/Dockerfile \
            .

      - name: Smoke test image tools
        run: |
          docker run --rm nyl-ci:test
          docker run --rm nyl-ci:test nyl --version
          docker run --rm nyl-ci:test helm version
          docker run --rm nyl-ci:test git --version
          docker run --rm nyl-ci:test sops --version
          docker run --rm nyl-ci:test kyverno version

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.vars.outputs.can_push == 'true' }}
          tags: ${{ steps.vars.outputs.image_tags }}

  build-all-platform-binaries:
    name: Build all platform binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build-linux-musl]
    uses: ./.github/workflows/_build-rust.yaml
    with:
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      upload-artifacts: true

  integration-minikube:
    name: Integration tests (Minikube)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    needs: [build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Nyl x86_64 musl binary
        uses: actions/download-artifact@v4
        with:
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin

      - name: Install Nyl
        run: |
          chmod +x ./nyl-bin/nyl
          sudo mv ./nyl-bin/nyl /usr/local/bin/nyl
          nyl --version

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          cpus: 2
          memory: 4096
          kubernetes-version: v1.29.0
          driver: docker

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run kind filtering and append-release test
        run: |
          cd integrationtests
          ./test-kind-filtering-append-release.sh

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== DEBUG: Integration tests failed ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
          kubectl get pods -A -o wide || true
          kubectl describe pods -A || true
