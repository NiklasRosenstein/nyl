# Integration Tests for Helm Chart and ArgoCD
#
# This workflow validates Nyl integration tests in Minikube:
# - Kind filtering and append-release mode (phased deployments)
# - ArgoCD bootstrap with OCI chart pulling via nyl apply
# - ArgoCD deployment with Nyl CMP sidecar
# - Self-managed ArgoCD Application sync
#
# Tests are run individually (not via run-all.sh) to provide CI-specific
# environment variables for ArgoCD testing (SHA, chart version, etc.)

name: Integration CI

on:
  workflow_run:
    workflows: ["Docker CI"]
    types: [completed]
    branches: [develop]

  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to test (leave empty for latest develop)'
        required: false
        type: string

concurrency:
  group: integration-test
  cancel-in-progress: true

env:
  DEPLOYMENT_TIMEOUT: 300
  SYNC_TIMEOUT: 180

jobs:
  integration-test:
    name: Helm + ArgoCD Integration Test
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Determine test SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.sha }}" ]; then
              FULL_SHA="${{ inputs.sha }}"
            else
              FULL_SHA="${{ github.sha }}"
            fi
          else
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          SHORT_SHA="${FULL_SHA:0:7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "chart_version=0.1.0-sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

          echo "Testing SHA: ${FULL_SHA}"
          echo "Image tag: sha-${SHORT_SHA}"
          echo "Chart version: 0.1.0-sha-${SHORT_SHA}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.full_sha }}

      - name: Download Nyl binary (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin
          commit: ${{ github.event.workflow_run.head_sha }}
          if_no_artifact_found: fail

      - name: Download Nyl binary (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci-rust.yaml
          name: nyl-x86_64-unknown-linux-musl
          path: ./nyl-bin
          commit: ${{ steps.sha.outputs.full_sha }}
          if_no_artifact_found: fail

      - name: Install Nyl and Helm
        run: |
          chmod +x ./nyl-bin/nyl
          sudo mv ./nyl-bin/nyl /usr/local/bin/nyl
          nyl --version

          # Install Helm (needed for OCI chart pulling)
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          cpus: 2
          memory: 4096
          kubernetes-version: v1.29.0
          driver: docker

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run basic integration tests
        run: |
          cd integrationtests
          ./test-kind-filtering-append-release.sh

      - name: Run ArgoCD bootstrap integration test
        env:
          NYL_CHART_OWNER: ${{ steps.sha.outputs.owner }}
          NYL_CHART_VERSION: ${{ steps.sha.outputs.chart_version }}
          NYL_IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
          NYL_REPO_URL: https://github.com/${{ github.repository }}.git
          NYL_TARGET_REVISION: ${{ steps.sha.outputs.full_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOYMENT_TIMEOUT: ${{ env.DEPLOYMENT_TIMEOUT }}
          SYNC_TIMEOUT: ${{ env.SYNC_TIMEOUT }}
        run: |
          cd integrationtests
          ./test-argocd-bootstrap.sh

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== DEBUG: Integration test failed ==="
          kubectl get events -n argocd --sort-by='.lastTimestamp' | tail -30
          kubectl get pods -n argocd -o wide
          kubectl describe pods -n argocd
          kubectl logs -l app.kubernetes.io/component=repo-server -n argocd \
            --all-containers --tail=100 || true
          kubectl logs -l app.kubernetes.io/component=application-controller -n argocd \
            --tail=100 || true
