name: Docker

on:
  push:
    branches: [develop]
    tags: ['*']
  pull_request:

jobs:

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nyl

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Rust binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd nyl
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          cp ../target/${{ matrix.target }}/release/nyl ../nyl-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyl-binary-${{ matrix.arch }}
          path: nyl-${{ matrix.arch }}

  argocd-cmp:
    runs-on: ubuntu-latest
    needs: build-binaries
    # Only build Docker image on push events (not PRs) - binary builds verify code compiles
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: nyl-binary-amd64
          path: .

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: nyl-binary-arm64
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify binaries exist
        run: |
          ls -la nyl-amd64 nyl-arm64
          file nyl-amd64 nyl-arm64

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/argocd-cmp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: argocd-cmp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
