[workspace]
members = ["nyl", "crates/nyl-core", "crates/nyl-render"]
resolver = "2"

[workspace.package]
version = "0.5.9"
edition = "2021"
authors = ["Niklas Rosenstein"]
license = "MIT"
repository = "https://github.com/NiklasRosenstein/nyl"
# Nyl ships as release binaries and container images, not through crates.io.
publish = false

[workspace.dependencies]
nyl-core = { path = "crates/nyl-core" }
nyl-render = { path = "crates/nyl-render" }

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Templates
minijinja = { version = "2.5", features = ["builtins", "custom_syntax"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# YAML
serde-saphyr = { version = "1.2", default-features = false, features = ["serialize", "deserialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
schemars = "1"

# Kubernetes
kube = { version = "4", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-indicatif = "0.3.14"

# Utilities
walkdir = "2.5"
same-file = "1.0.6"
glob = "0.3"
sha2 = "0.11"
hex = "0.4"
tempfile = "3.15"
base64 = "0.23"
getrandom = "0.4"
flate2 = "1.1.9"
tar = "0.4"
zstd = "0.14"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Git
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
regex = "1.10"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

# Diff and output
colored = "3"
similar = "3"
unicode-width = "0.2"
dialoguer = "0.12"

# Testing
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
