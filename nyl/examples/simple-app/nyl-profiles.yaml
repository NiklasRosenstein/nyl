dev:
  values:
    environment: development
    replicas: 1
    image_tag: dev-latest
    debug: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

staging:
  values:
    environment: staging
    replicas: 2
    image_tag: staging-v1.0.0
    debug: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

prod:
  values:
    environment: production
    replicas: 3
    image_tag: v1.0.0
    debug: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
