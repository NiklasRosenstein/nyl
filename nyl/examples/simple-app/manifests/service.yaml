apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: {% if profile == 'prod' %}production{% elif profile == 'staging' %}staging{% else %}development{% endif %}
  labels:
    app: myapp
    environment: {{ profile }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: myapp
