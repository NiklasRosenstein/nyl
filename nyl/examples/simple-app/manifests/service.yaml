apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: {{ profile.namespace | default('default') }}
  labels:
    app: myapp
    environment: {{ profile.environment }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: myapp
