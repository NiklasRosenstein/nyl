apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: {{ values.namespace }}
  labels:
    app: myapp
    environment: {{ values.environment }}
spec:
  replicas: {{ values.replicas }}
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
        environment: {{ values.environment }}
    spec:
      containers:
      - name: myapp
        image: myorg/myapp:{{ values.imageTag }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "{{ values.environment }}"
        - name: DEBUG
          value: "{{ values.debug }}"
        - name: APP_CONFIG
          valueFrom:
            configMapKeyRef:
              name: myapp-config
              key: config.yaml
        resources:
          requests:
            cpu: {{ values.resources.requests.cpu }}
            memory: {{ values.resources.requests.memory }}
          limits:
            cpu: {{ values.resources.limits.cpu }}
            memory: {{ values.resources.limits.memory }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
