apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-config
  namespace: {{ values.namespace }}
  labels:
    app: myapp
    environment: {{ values.environment }}
data:
  config.yaml: |
    server:
      port: 8080
      environment: {{ values.environment }}
      debug: {{ values.debug }}

    logging:
      level: {{ values.logLevel }}
      format: json

    features:
      metrics: true
      tracing: {{ values.tracing }}
