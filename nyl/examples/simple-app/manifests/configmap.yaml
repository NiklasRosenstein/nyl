apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-config
  namespace: {% if profile == 'prod' %}production{% elif profile == 'staging' %}staging{% else %}development{% endif %}
  labels:
    app: myapp
    environment: {{ profile }}
data:
  config.yaml: |
    server:
      port: 8080
      environment: {{ profile }}
      debug: {% if profile == 'dev' %}true{% else %}false{% endif %}

    logging:
      level: {% if profile == 'dev' %}debug{% else %}info{% endif %}
      format: json

    features:
      metrics: true
      tracing: {% if profile == 'prod' %}true{% else %}false{% endif %}
