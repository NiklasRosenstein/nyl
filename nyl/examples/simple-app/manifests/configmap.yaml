apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-config
  namespace: {{ profile.namespace | default('default') }}
  labels:
    app: myapp
    environment: {{ profile.environment }}
data:
  config.yaml: |
    server:
      port: 8080
      environment: {{ profile.environment }}
      debug: {{ profile.debug }}

    logging:
      level: {% if profile.debug %}debug{% else %}info{% endif %}
      format: json

    features:
      metrics: true
      tracing: {% if profile.environment == 'production' %}true{% else %}false{% endif %}
