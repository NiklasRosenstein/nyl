[package]
name = "nyl"
description = "Kubernetes manifest generator with Helm integration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Build release artifacts for this package even though it is not published to
# crates.io.
[package.metadata.dist]
dist = true

[[bin]]
name = "nyl"
path = "src/main.rs"

[lib]
name = "nyl"
path = "src/lib.rs"

[dependencies]
nyl-core = { workspace = true }
nyl-render = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
dialoguer = { workspace = true }
futures = { workspace = true }
git2 = { workspace = true }
hex = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
# Paused virtual time for deterministic latency-injected apply tests.
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
predicates = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[[bench]]
name = "template_rendering"
harness = false

[[bench]]
name = "config_loading"
harness = false
