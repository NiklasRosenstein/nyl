[package]
name = "nyl"
version = "0.2.9"
edition = "2021"
authors = ["Niklas Rosenstein"]
description = "Kubernetes manifest generator with Helm integration"
license = "MIT"
repository = "https://github.com/NiklasRosenstein/nyl"

[[bin]]
name = "nyl"
path = "src/main.rs"

[lib]
name = "nyl"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Templates
minijinja = { version = "2.5", features = ["builtins", "custom_syntax"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# YAML - Using serde_norway (YAML 1.2, actively maintained)
serde_norway = "0.9"
serde_yaml = "0.9"
serde_yml = "0.0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
schemars = "0.8"

# Kubernetes
kube = { version = "0.95", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
walkdir = "2.5"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.15"
dirs = "5.0"
base64 = "0.22"
flate2 = "1.1.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Git
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
regex = "1.10"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

# Diff and output
colored = "2.1"
similar = "2.6"
comfy-table = "7.1"
dialoguer = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"

[[bench]]
name = "template_rendering"
harness = false

[[bench]]
name = "config_loading"
harness = false
