apiVersion: k8s.nyl/v1
kind: Release
metadata:
  name: web
  namespace: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
    - port: 80
