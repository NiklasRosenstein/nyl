# Drift: `verify` finds drift, `reconcile` repairs the idempotent unit, and
# the other waits for an approval (design/orchestration-core.md, Drift, as
# amended by the part 5 decisions); `reconcile --detect-drift` (M7) does the
# check and the repair in one run.
contract: design/orchestration-core.md#drift
milestone: M3
tiers: [1]                            # the local run uses tier 1's Git repository
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [idempotent, other]

  # Something outside Nyl changes both resources; their execution keys do not change.
  - file: {path: resources/idempotent, content: "changed outside Nyl\n"}
  - file: {path: resources/other, content: "changed outside Nyl\n"}
  - nyl: [detect-drift, -e, dev]
    exit: 3                           # verify records drift and fails
    expect:
      drifted: [idempotent, other]
      codes: [NYL-DRIFT-DETECTED]
      commits: {desired: 0, observed: 1}

  # `drifted` is a unit state: work for the next reconcile, like a change,
  # so status exits 2 for it, as for `ready`.
  - nyl: [status, -e, dev]
    exit: 2
    expect:
      drifted: [idempotent, other]
      units:
        idempotent: {receipt: current, drift: {result: drifted}}
        other: {receipt: current, drift: {result: drifted}}
  # Decision on drift: "`drifted` is a unit state in status, plan, and
  # reports"; "`nyl plan` lists it as a unit that would execute".
  - nyl: [plan, -e, dev]
    exit: 0
    expect:
      drifted: [idempotent, other]

  # driftRepair: converge (the default) re-executes the converging unit; the
  # unit that is not safe to re-run awaits approval, and the run continues.
  - nyl: [reconcile, -e, dev]
    exit: 2
    expect:
      executed: [idempotent]
      awaiting-approval: [other]
      driftRepaired: [idempotent]
      commits: {desired: 0, observed: 1}
  # The new receipt drops idempotent's drift observation in the same commit.
  - nyl: [status, -e, dev]
    exit: 2
    expect:
      current: [idempotent]
      drifted: [other]

  # A local run repairs it with an explicit approval. The configured file
  # repository holds its receipt.
  - nyl: [reconcile, -e, dev, --local, --approve, other]
    exit: 0
    expect:
      executed: [other]
      current: [idempotent]
      driftRepaired: [other]
      commits: {desired: 0, observed: 1}
  - nyl: [detect-drift, -e, dev]
    exit: 0                           # the local run restored other's resource
    expect:
      commits: {desired: 0, observed: 1}

  # driftRepair: manual: reconcile repairs nothing by itself; drifted units
  # wait until a forced run.
  - commit: {branch: main, message: "Review every repair in dev", apply: patches/manual}
  - file: {path: resources/idempotent, content: "changed outside Nyl again\n"}
  - nyl: [detect-drift, -e, dev]
    exit: 3
    expect:
      drifted: [idempotent]
      codes: [NYL-DRIFT-DETECTED]
  - nyl: [reconcile, -e, dev]
    exit: 2
    expect:
      executed: []
      drifted: [idempotent]
      current: [other]
  - nyl: [reconcile, -e, dev, --unit, idempotent, --reapply, --reason, "repair reviewed"]
    exit: 0
    expect:
      executed: [idempotent]
      reapplied: [idempotent]
      commits: {desired: 0, observed: 1}
  - nyl: [status, -e, dev]
    exit: 0
    expect:
      current: [idempotent, other]

  # `reconcile --detect-drift` does the check and the repair in one run: one
  # lease, one transition commit per state ref, and no gap in which another run
  # could change what the check saw. It repairs by the same rule as the plain
  # reconcile above, so the idempotent unit runs again and the other waits.
  - commit: {branch: main, message: "Repair drift by itself again", apply: patches/converge}
  - file: {path: resources/idempotent, content: "changed outside Nyl a third time\n"}
  - file: {path: resources/other, content: "changed outside Nyl a third time\n"}
  - nyl: [reconcile, -e, dev, --detect-drift]
    exit: 2
    expect:
      executed: [idempotent]
      awaiting-approval: [other]
      driftRepaired: [idempotent]
      drift-checks: {idempotent: drifted, other: drifted}
      codes: [NYL-DRIFT-DETECTED]
      commits: {desired: 1, observed: 1}   # the Environment's new record, and the drift and the receipt
  # The run recorded `other`'s drift itself; no `detect-drift` ran in between.
  - nyl: [status, -e, dev]
    exit: 2
    expect:
      current: [idempotent]
      drifted: [other]
      units:
        other: {drift: {result: drifted}}
  # A local run checks again and repairs `other` with an approval; the
  # idempotent unit checks clean.
  - nyl: [reconcile, -e, dev, --detect-drift, --local, --approve, other]
    exit: 0
    expect:
      executed: [other]
      current: [idempotent]
      driftRepaired: [other]
      drift-checks: {idempotent: clean, other: drifted}
  # Without the flag a reconcile never detects drift.
  - file: {path: resources/idempotent, content: "changed outside Nyl a fourth time\n"}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      current: [idempotent, other]
      drift-checks: {}
