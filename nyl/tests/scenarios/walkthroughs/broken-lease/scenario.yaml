# Broken lease: a break lets an importer take over before the dead run's
# deadline; until a run imports it, other state writers refuse
# (design/orchestration-core.md, Runs and leases, and Recovery, "Importing a
# broken run"; reference scenario 1's tier-1 variant "Broken lease").
# `integrate` folds these steps into walkthroughs/competing-runners.
contract: design/orchestration-core.md#runs-and-leases
milestone: M3
tiers: [1]                            # scripts faults
project: ../_project
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  # The environment converges first: verify takes the lease only when it has
  # a current receipt to verify.
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [network, web-image, database, kubernetes]

  # The runner dies after web-image's effect, before its checkpoint.
  - commit: {branch: main, message: "Change the web page", apply: patches/web-page}
  - fault: {point: after-effect, unit: web-image}
  - nyl: [reconcile, -e, dev]
    killed: true
  - nyl: [lease, break, -e, dev, --reason, "runner lost"]
    exit: 0
    expect:
      commits: {desired: 0, observed: 0}

  # Only reconcile, teardown, and recover take over a broken lease whose run
  # is not imported; verify refuses and names `nyl recover -e dev`.
  - nyl: [verify, -e, dev]
    exit: 2
    expect:
      codes: [NYL-LEASE-BROKEN]
      commits: {desired: 0, observed: 0}

  # recover imports the dead run without executing, in one transition that
  # records the break once, and consumes its run ref. web-image, which the
  # dead run left without a checkpoint, is listed under recovered.
  - nyl: [recover, -e, dev]
    exit: 0
    expect:
      outcome: done
      imported: []
      recovered: [web-image]
      lease-broken: true
      commits: {desired: 1, observed: 1}

  # No run ref is left to take over: the next run starts at once, converges
  # web-image under its recovery policy, and publishes the new image.
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      recovered: [web-image]
      executed: [kubernetes]
      lease-broken: false
      commits: {desired: 1, observed: 1}
      units:
        web-image: {condition: null, receipt: current}
