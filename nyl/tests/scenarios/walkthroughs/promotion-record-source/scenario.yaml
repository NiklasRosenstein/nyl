# Walkthrough "Promoting an environment's source with `record: source`"
# (design/promotion.md#promoting-an-environments-source): `nyl promote`
# writes the record into prod's Environment on main instead of prod's state;
# runs apply it and record its sequence, and a run from an older checkout,
# whose block has a lower sequence, is refused and names the reviewed way
# to roll back: a new promotion with a higher sequence.
contract: design/promotion.md#promoting-an-environments-source
milestone: M6
project: ../stale-promotion-evidence/project
steps:
  - commit: {branch: main, message: "Record prod's promotions in source", apply: patches/record-source}
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [state, init, -e, prod]
    exit: 0
  - nyl: [reconcile, -e, dev]
    id: r1
    exit: 0
    expect:
      executed: [web-image, kubernetes]

  # The record is a commit on main changing prod's Environment; prod's state
  # is untouched. The promoted source is the commit before it.
  - nyl: [promote, dev-to-prod, --reason, "Release 1"]
    exit: 0
    expect:
      commits: {desired: 0, observed: 0}
      promotion:
        path: dev-to-prod
        record: source
        sequence: 1
        sourceCommit: main~1
        from: {environment: dev, run: r1}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: main~1
      source-chosen-by: {by: promotion, path: dev-to-prod, sequence: 1}
      executed: [kubernetes]

  # A CI job checks out main now and runs later.
  - branch: {name: old-ci, from: main}
  - commit: {branch: main, message: "Release 2", apply: ../stale-promotion-evidence/patches/web-page}
  - nyl: [reconcile, -e, dev]
    id: r2
    exit: 0
    expect:
      executed: [web-image, kubernetes]
  - nyl: [promote, dev-to-prod, --reason, "Release 2"]
    exit: 0
    expect:
      promotion:
        path: dev-to-prod
        record: source
        sequence: 2
        sourceCommit: main~1
        from: {environment: dev, run: r2}
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: main~1
      source-chosen-by: {by: promotion, path: dev-to-prod, sequence: 2}
      executed: [kubernetes]

  # The old job's checkout carries the sequence-1 block: refused, nothing
  # written, and the message names the reviewed rollback.
  - nyl: [reconcile, -e, prod]
    at: old-ci
    exit: 1
    expect:
      codes: [NYL-PROMOTION-SEQUENCE-OLDER]
      messages: [nyl promote dev-to-prod --revision]
      commits: {desired: 0, observed: 0}

  # The rollback is a new promotion of the older state, with sequence 3.
  - nyl: [promote, dev-to-prod, --revision, '%COMMIT(old-ci~1)%', --reason, "Roll back release 2"]
    exit: 0
    expect:
      promotion:
        path: dev-to-prod
        record: source
        sequence: 3
        sourceCommit: old-ci~1
        from: {environment: dev, run: r1}
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: old-ci~1
      source-chosen-by: {by: promotion, path: dev-to-prod, sequence: 3}
      executed: [kubernetes]
