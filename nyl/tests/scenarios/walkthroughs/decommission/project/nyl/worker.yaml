apiVersion: units.gitops.nyl/v1
kind: Command
metadata:
  name: worker
  labels: {dev: 'true'}
spec:
  files: ['../scripts/resource.sh']
  values:
    cache: {fromUnit: {unit: cache, output: endpoint}}
  workingDir: ../scripts
  env:
    passthrough: [SCENARIO_TMP]
  command: [sh, './resource.sh', 'create']
  teardown: [sh, './resource.sh', 'remove']
  idempotent: true
  deletionPolicy: Retain
