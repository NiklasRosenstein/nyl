# scratch becomes an image: a kind change, which tears the old incarnation
# down before the new kind runs.
apiVersion: units.gitops.nyl/v1
kind: OciImage
metadata:
  name: scratch
  labels: {dev: 'true'}
spec:
  env: {passthrough: ['%DOCKER_PASSTHROUGH%']}
  context: {path: ../scripts}
  repository: '%REGISTRY%/scratch'
