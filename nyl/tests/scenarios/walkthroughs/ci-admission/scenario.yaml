contract: design/ci-execution.md#deployment-admission
milestone: M8
tiers: [1]
project: ../_project
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - ci-admit: {id: A, request: deploy-a, expected: none}
    exit: 0
  - ci-worker: {admission: A, unit: network}
    exit: 0
    expect:
      executed: [network]
  - commit: {branch: main, message: Change network inputs, apply: patches/network}
  - ci-admit: {id: B, request: deploy-b, expected: A}
    exit: 0
  - ci-worker: {admission: B, unit: network}
    exit: 0
    expect:
      executed: [network]
  - ci-worker: {admission: A, unit: network}
    exit: 1
    expect:
      executed: []
      commits: {desired: 0, observed: 0}
      codes: [NYL-CI-ADMISSION-SUPERSEDED]
  - ci-admit: {id: rejected, request: deploy-a, expected: B}
    exit: 1
    expect:
      commits: {desired: 0, observed: 0}
      codes: [NYL-CI-ADMISSION-SUPERSEDED]
  - branch: {name: rollback, from: main~1}
  - ci-admit: {id: C, request: rollback-a, expected: B, rollback: true}
    at: rollback
    exit: 0
  - ci-worker: {admission: C, unit: network}
    exit: 0
    expect:
      executed: [network]
