# Walkthrough "Value-only promotion" (design/promotion.md, Promotion paths
# and Kubernetes publications): a path that promotes only values takes each
# value from the publication its consuming dev Application runs, as the
# recorded `accepted` and `healthy` attestations show it, so Applications
# synced to different publications do not block it; a path that promotes
# dev's source blocks on the same mixed revisions, and an explicitly chosen
# older state passes on the attestations recorded for it. The `argocd` steps
# script what the fake Argo CD reports for target dev.
contract: design/promotion.md#kubernetes-publications
milestone: M6
tiers: [1]                            # scripts Argo CD
publication: fake                     # the fake publication attests from the scripted Argo CD
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [state, init, -e, staging]
    exit: 0
  - nyl: [state, init, -e, prod]
    exit: 0

  # A binding whose path has no record yet blocks with a message naming
  # nyl promote; it is not an error.
  - nyl: [reconcile, -e, staging]
    exit: 2
    expect:
      blocked: [kubernetes]
      codes: [NYL-PROMOTION-MISSING]
      messages: [nyl promote dev-to-staging]

  # R1 publishes both Releases. A receipt is not an attestation.
  - nyl: [reconcile, -e, dev]
    id: r1
    exit: 0
    expect:
      executed: [web-image, api-image, kubernetes]
  - nyl: [promote, dev-to-staging]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-NO-EVIDENCE]
      commits: {desired: 0, observed: 0}

  # Argo CD runs R1's publication everywhere, healthy.
  - argocd: {target: dev, all: {runs: r1}}
  - nyl: [attest, -e, dev]
    exit: 0
    expect:
      commits: {desired: 0, observed: 1}
  - nyl: [promote, dev-to-staging]
    exit: 0
    expect:
      commits: {desired: 1, observed: 0}
      promotion:
        path: dev-to-staging
        sequence: 1
        sourceCommit: null            # values only
        from: {environment: dev, run: r1}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
          apiImage:
            equals: [get, artifact, api-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
        evidence: {level: attested, override: false, attestations: [kubernetes/accepted, kubernetes/healthy]}
  - nyl: [reconcile, -e, staging]
    exit: 0
    expect:
      executed: [kubernetes]
      deploy:
        branch: deploy
        mentions:
          'staging/web/web/**':
            - [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
          'staging/web/api/**':
            - [get, artifact, api-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']

  # R2 publishes new images for both. Argo CD syncs the web Application and
  # the catalog, while the api Application stays on R1's publication (a
  # manual sync). The publication's `accepted` aggregate fails for R2's
  # receipt (the api Application runs another publication), and its details
  # name the publication each Application runs.
  - commit: {branch: main, message: "Release 2", apply: patches/release-2}
  - nyl: [reconcile, -e, dev]
    id: r2
    exit: 0
    expect:
      executed: [web-image, api-image, kubernetes]
  - argocd: {target: dev, all: {runs: r2}, releases: {web/api: {runs: r1}}}
  - nyl: [attest, -e, dev]
    exit: 3
    expect:
      codes: [NYL-ATTESTATION-FAILED]
      messages: [other-publication]
      commits: {desired: 0, observed: 1}

  # Values only: each value comes from what its consuming Application runs,
  # so webImage from R2 and apiImage from R1; the record names apiImage's own
  # state.
  - nyl: [promote, dev-to-staging]
    exit: 0
    expect:
      commits: {desired: 1, observed: 0}
      promotion:
        path: dev-to-staging
        sequence: 2
        sourceCommit: null
        from: {environment: dev, run: r2}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r2)%']
          apiImage:
            equals: [get, artifact, api-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
            state: r1
  - nyl: [reconcile, -e, staging]
    exit: 0
    expect:
      executed: [kubernetes]
      # web moves to R2's image; api's files stay byte for byte what R1's
      # value rendered, so the api value did not move.
      deploy:
        branch: deploy
        unchanged: ['staging/web/api/**']
        mentions:
          'staging/web/web/**':
            - [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r2)%']

  # The source path needs one dev state behind every value: what the newest
  # attestations show running is mixed, so it is refused and writes nothing.
  - nyl: [promote, dev-to-prod]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-NO-EVIDENCE]
      messages: [mixed]
      commits: {desired: 0, observed: 0}
  # An explicitly chosen state reaches `attested` through the attestations
  # recorded for it: R1's passed when Argo CD ran R1 everywhere.
  - nyl: [promote, dev-to-prod, --state-revision, '%STATE(r1)%', --reason, "Release 1"]
    exit: 0
    expect:
      commits: {desired: 1, observed: 0}
      promotion:
        path: dev-to-prod
        sequence: 1
        sourceCommit: main~1
        from: {environment: dev, run: r1}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
          apiImage:
            equals: [get, artifact, api-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r1)%']
        evidence: {level: attested, override: false, attestations: [kubernetes/accepted, kubernetes/healthy]}

  # Argo CD syncs the api Application: one publication everywhere. Both
  # paths now take everything from R2, and no value names a state of its own.
  - argocd: {target: dev, all: {runs: r2}}
  - nyl: [attest, -e, dev]
    exit: 0
  - nyl: [promote, dev-to-prod, --reason, "Release 2"]
    exit: 0
    expect:
      promotion:
        path: dev-to-prod
        sequence: 2
        sourceCommit: main
        from: {environment: dev, run: r2}
  - nyl: [promote, dev-to-staging]
    exit: 0
    expect:
      promotion:
        path: dev-to-staging
        sequence: 3
        sourceCommit: null
        from: {environment: dev, run: r2}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r2)%']
          apiImage:
            equals: [get, artifact, api-image/image, -e, dev, --pointer, /reference, --state-revision, '%STATE(r2)%']

  # A covered Application that runs no publication of dev, or is not
  # healthy, blocks a value-only path too.
  - argocd: {target: dev, all: {runs: r2}, releases: {web/api: {runs: unmatched}}}
  - nyl: [attest, -e, dev]
    exit: 3
    expect:
      codes: [NYL-ATTESTATION-FAILED]
      messages: [unmatched]
  - nyl: [promote, dev-to-staging]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-NO-EVIDENCE]
      messages: [unmatched]
      commits: {desired: 0, observed: 0}
  - argocd: {target: dev, all: {runs: r2}, releases: {web/web: {runs: r2, health: Degraded}}}
  - nyl: [attest, -e, dev]
    exit: 3
    expect:
      codes: [NYL-ATTESTATION-FAILED]
  - nyl: [promote, dev-to-staging]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-NO-EVIDENCE]
      messages: [Degraded]
      commits: {desired: 0, observed: 0}
