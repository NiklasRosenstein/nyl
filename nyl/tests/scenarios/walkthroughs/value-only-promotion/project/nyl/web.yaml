# One group, two Releases, so two Applications per target that Argo CD can
# sync to different publications.
apiVersion: k8s.gitops.nyl/v1
kind: ApplicationGroup
metadata:
  name: web
  labels: {app: web}
spec:
  applicationNamespace: argocd
  source: {path: ../applications/web}   # beside nyl/
  # Both Releases deploy into Namespace web; the web Release's Application owns it.
  sharedNamespaces:
    web:
      owner: {kind: Release, applicationGroup: web, release: web}
