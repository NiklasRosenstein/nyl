# Value-only promotion (design/promotion.md, Promotion paths and Kubernetes
# publications): staging takes each image from the publication its consuming
# dev Application runs; prod promotes dev's whole source and needs one
# publication running everywhere.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: dev
spec:
  destination:
    server: https://dev.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1]
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: staging
spec:
  destination:
    server: https://staging.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1]
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: prod
spec:
  destination:
    server: https://prod.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1]
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: dev
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: dev}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: dev
  releaseInputs:
    web/web:
      image: {fromUnit: {unit: web-image, artifact: image, pointer: /reference}}
    web/api:
      image: {fromUnit: {unit: api-image, artifact: image, pointer: /reference}}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: staging
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: staging}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: staging
  releaseInputs:
    web/web:
      image: {fromPromotion: {path: dev-to-staging, value: webImage}}
    web/api:
      image: {fromPromotion: {path: dev-to-staging, value: apiImage}}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: prod
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: prod}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: prod
  releaseInputs:
    web/web:
      image: {fromPromotion: {value: webImage}}
    web/api:
      image: {fromPromotion: {value: apiImage}}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: dev
spec:
  unitSelector:
    matchLabels: {dev: 'true'}
  values: {target: dev}
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: staging
spec:
  unitSelector:
    matchLabels: {staging: 'true'}    # runs its own worktree; only values are promoted
  values: {target: staging}
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: prod
spec:
  source:
    fromPromotion: {path: dev-to-prod}
  unitSelector:
    matchLabels: {prod: 'true'}
  values: {target: prod}
  state:
    repositoryRef: {name: platform}
