# dev builds the image and publishes; prod runs the source commit and image
# digest dev proved.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.gitops.nyl/v1
kind: Cluster
metadata:
  name: dev
spec:
  destination:
    server: https://dev.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1]
---
apiVersion: k8s.gitops.nyl/v1
kind: Cluster
metadata:
  name: prod
spec:
  destination:
    server: https://prod.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1]
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: dev
spec:
  clusterRef: {name: dev}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: dev
  releaseInputs:
    web/web:
      image: {fromUnit: {unit: web-image, artifact: image, pointer: /reference}}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: prod
spec:
  clusterRef: {name: prod}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: prod
  releaseInputs:
    web/web:
      image: {fromPromotion: {value: webImage}}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: dev
spec:
  unitSelector:
    matchLabels: {dev: 'true'}
  values: {target: dev}
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
  attestations: [qa]                 # never attested in this scenario
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: prod
spec:
  source:
    fromPromotion: {path: dev-to-prod}
  unitSelector:
    matchLabels: {prod: 'true'}      # kubernetes only; the image comes from dev
  values: {target: prod}
  state:
    repositoryRef: {name: platform}
---
apiVersion: units.gitops.nyl/v1
kind: OciImage
metadata:
  name: web-image
  labels: {dev: 'true'}
spec:
  context: {path: ../services/web}
  repository: '%REGISTRY%/web'
---
apiVersion: units.gitops.nyl/v1
kind: KubernetesPublication
metadata:
  name: kubernetes
  labels: {dev: 'true', prod: 'true'}
spec:
  target: '{{ values.target }}'
  mode: publish
