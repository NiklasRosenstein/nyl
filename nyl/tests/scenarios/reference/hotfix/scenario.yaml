# Reference scenario 5, a hotfix (design/reference-scenarios.md, and
# design/promotion.md#hotfixes): a fix that cannot wait for dev's unreleased
# work reaches prod through its own path; the next dev promotion is refused
# until main contains the fix or the promotion supersedes it; and the rule is
# symmetric, so a hotfix state cut before a later dev promotion is refused
# too. Branch `s1` only marks the commit prod first runs.
contract: design/reference-scenarios.md#scenario-5-hotfix
milestone: M6
steps:
  - branch: {name: s1, from: main}
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [state, init, -e, prod]
    exit: 0
  - nyl: [state, init, -e, prod-hotfix]
    exit: 0

  # 1. prod runs S1, promoted from dev.
  - nyl: [reconcile, -e, dev]
    id: d1
    exit: 0
    expect:
      executed: [network, web-image, database, kubernetes]
  - nyl: [attest, -e, dev, --name, qa, --result, pass]
    exit: 0
  - nyl: [promote, dev-to-prod, --reason, "Release 1"]
    exit: 0
    expect:
      promotion:
        path: dev-to-prod
        sequence: 1
        sourceCommit: s1
        from: {environment: dev, run: d1}
  - nyl: [reconcile, -e, prod]
    exit: 2
    expect:
      executed: [network]
      awaiting-approval: [database]
  - nyl: [reconcile, -e, prod, --approve, 'database=%PLAN-DIGEST(prod/database)%']
    exit: 0
    expect:
      source: s1
      executed: [database, kubernetes]

  # 2. main moves on with work prod must not run yet; dev proves it.
  - commit: {branch: main, message: "Start release 2", apply: patches/dev-work}
  - nyl: [reconcile, -e, dev]
    id: d2
    exit: 0
    expect:
      executed: [web-image, kubernetes]
  - nyl: [attest, -e, dev, --name, qa, --result, pass]
    exit: 0

  # 3. Start: release/prod is cut from what prod runs, and the fix takes two
  #    commits. Try: prod-hotfix builds them and deploys to its own target.
  - branch: {name: release/prod, from: s1}
  - commit: {branch: release/prod, message: "Fix pool size", apply: patches/fix-pool-size}
  - commit: {branch: release/prod, message: "Bump timeout", apply: patches/bump-timeout}
  - nyl: [reconcile, -e, prod-hotfix]
    id: h1
    exit: 0
    expect:
      source: release/prod
      source-chosen-by: {by: revision, revision: release/prod}
      executed: [web-image, kubernetes]
      deploy: {branch: deploy, contains: ['hotfix/web/**']}
  - nyl: [attest, -e, prod-hotfix, --name, qa, --result, pass, --reason, "Fix verified on the hotfix target"]
    exit: 0

  # 4. Ship: hotfix-to-prod promotes the fix's source commit and image. Its
  #    source commit contains S1, which dev-to-prod recorded, so nothing is
  #    superseded. prod's bindings name no path and follow the record that
  #    supplied its source.
  - nyl: [promote, hotfix-to-prod, --reason, "Pool exhaustion in prod"]
    exit: 0
    expect:
      commits: {desired: 1, observed: 0}
      promotion:
        path: hotfix-to-prod
        sequence: 2
        sourceCommit: release/prod
        from: {environment: prod-hotfix, run: h1}
        values:
          webImage:
            equals: [get, artifact, web-image/image, -e, prod-hotfix, --pointer, /reference, --state-revision, '%STATE(h1)%']
        evidence: {level: attested, override: false, attestations: [environment/qa]}
        superseded: []
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: release/prod
      source-chosen-by: {by: promotion, path: hotfix-to-prod, sequence: 2}
      executed: [kubernetes]
      current: [network, database]
      deploy:
        branch: deploy
        mentions:
          'prod/web/**':
            - [get, artifact, web-image/image, -e, prod-hotfix, --pointer, /reference, --state-revision, '%STATE(h1)%']
            - example.invalid/request-timeout

  # 5. dev's next promotion lacks both fix commits: refused, writing nothing,
  #    with the missing commits and the range to supersede them. A dry run
  #    exits as the promotion would.
  - nyl: [promote, dev-to-prod]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-SUPERSEDES]
      messages: [hotfix-to-prod, Fix pool size, Bump timeout, --supersede]
      commits: {desired: 0, observed: 0}
  - nyl: [promote, dev-to-prod, --dry-run]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-SUPERSEDES]
      commits: {desired: 0, observed: 0}

  # 6. Merge back as a squash: one commit with both changes is not patch-
  #    equivalent to either fix commit, so the promotion is still refused.
  - squash-merge: {branch: release/prod, into: main}
  - nyl: [reconcile, -e, dev]
    id: d3
    exit: 0
    expect:
      executed: [web-image, kubernetes]
  - nyl: [attest, -e, dev, --name, qa, --result, pass]
    exit: 0
  - nyl: [promote, dev-to-prod]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-SUPERSEDES]
      messages: [Fix pool size, Bump timeout]
      commits: {desired: 0, observed: 0}

  # 7. --supersede: an entry for one commit leaves the other missing; an
  #    entry without a reason (and no --reason) is rejected; a range with its
  #    reason covers both, and the record lists each commit, never the range.
  - nyl: [promote, dev-to-prod, --supersede, '%COMMIT(release/prod~1)%=Squash-merged into main']
    exit: 2
    expect:
      codes: [NYL-PROMOTE-SUPERSEDES]
      messages: [Bump timeout]
      commits: {desired: 0, observed: 0}
  - nyl: [promote, dev-to-prod, --supersede, '%COMMIT(s1)%..%COMMIT(release/prod)%']
    exit: 1
    expect:
      codes: [NYL-PROMOTE-SUPERSEDE-REASON]
      commits: {desired: 0, observed: 0}
  - nyl: [promote, dev-to-prod, --supersede, '%COMMIT(s1)%..%COMMIT(release/prod)%=Squash-merged into main as one commit']
    exit: 0
    expect:
      commits: {desired: 1, observed: 0}
      promotion:
        path: dev-to-prod
        sequence: 3
        sourceCommit: main
        from: {environment: dev, run: d3}
        superseded:
          - {commit: release/prod~1, reason: Squash-merged into main as one commit}
          - {commit: release/prod, reason: Squash-merged into main as one commit}
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: main
      source-chosen-by: {by: promotion, path: dev-to-prod, sequence: 3}
      executed: [kubernetes]
      current: [network, database]

  # 8. Clean up: prod runs a commit reachable from main, so release/prod can
  #    go. The next hotfix cuts it again from what prod runs by then.
  - delete-branch: release/prod
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      executed: []
      commits: {desired: 0, observed: 0}
  - branch: {name: s3, from: main}
  - branch: {name: release/prod, from: s3}
  - commit: {branch: main, message: "Start release 3", apply: patches/dev-work-2}
  - commit: {branch: release/prod, message: "Fix cache headers", apply: patches/fix-cache}
  - nyl: [reconcile, -e, prod-hotfix]
    id: h2
    exit: 0
    expect:
      source: release/prod
      executed: [web-image, kubernetes]
  - nyl: [attest, -e, prod-hotfix, --name, qa, --result, pass]
    exit: 0
  - nyl: [promote, hotfix-to-prod, --reason, "Stale pages in prod"]
    exit: 0
    expect:
      promotion:
        path: hotfix-to-prod
        sequence: 4
        sourceCommit: release/prod
        from: {environment: prod-hotfix, run: h2}
        superseded: []
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: release/prod
      source-chosen-by: {by: promotion, path: hotfix-to-prod, sequence: 4}
      executed: [kubernetes]

  # 9. Merge back with a merge commit: the fix is an ancestor of main, so
  #    dev's promotion passes without --supersede.
  - merge: {branch: release/prod, into: main}
  - nyl: [reconcile, -e, dev]
    id: d4
    exit: 0
    expect:
      executed: [web-image, kubernetes]
  - nyl: [attest, -e, dev, --name, qa, --result, pass]
    exit: 0
  - nyl: [promote, dev-to-prod, --reason, "Release 3"]
    exit: 0
    expect:
      promotion:
        path: dev-to-prod
        sequence: 5
        sourceCommit: main
        from: {environment: dev, run: d4}
        superseded: []
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: main
      source-chosen-by: {by: promotion, path: dev-to-prod, sequence: 5}
      executed: [kubernetes]

  # 10. Symmetric: prod-hotfix's state was cut before release 3 reached prod,
  #     so promoting it again would drop "Start release 3".
  - nyl: [promote, hotfix-to-prod]
    exit: 2
    expect:
      codes: [NYL-PROMOTE-SUPERSEDES]
      messages: [dev-to-prod, Start release 3]
      commits: {desired: 0, observed: 0}

  # 11. Clean up again: prod's source commit is reachable from main through
  #     the merge, so it stays fetchable once release/prod is gone.
  - delete-branch: release/prod
  - nyl: [reconcile, -e, prod]
    exit: 0
    expect:
      source: main
      executed: []
      commits: {desired: 0, observed: 0}
