# Reference scenario 5 (design/reference-scenarios.md): the project of
# scenario 4 with a hotfix path. prod-hotfix follows release/prod, builds and
# runs the fix on a target of its own, and hotfix-to-prod promotes it into
# prod next to dev-to-prod.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: dev
spec:
  destination:
    server: https://kubernetes.default.svc
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1, v1/Namespace, apps/v1/Deployment]
    clusterScopedKinds: [core/Namespace]
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: prod
spec:
  destination:
    server: https://prod.example.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1, v1/Namespace, apps/v1/Deployment]
    clusterScopedKinds: [core/Namespace]
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: dev
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: dev}
  applicationGroupSelector:
    matchLabels: {app: web}
  catalogApplication:
    syncPolicy: {automated: {prune: true}}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: dev
  releaseInputs:
    web/web:
      image: {$unit: {unit: web-image, artifact: image, pointer: /reference}}
      databaseHost: {$unit: {unit: database, output: connection, pointer: /host}}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: prod
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: prod}
  applicationGroupSelector:
    matchLabels: {app: web}
  catalogApplication:
    syncPolicy: {automated: {prune: true}}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: prod
  releaseInputs:
    web/web:
      # Path-less: from the record that supplied prod's source.
      image: {$promotion: {value: webImage}}
      databaseHost: {$unit: {unit: database, output: connection, pointer: /host}}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: dev
spec:
  unitSelector:
    matchLabels: {dev: 'true'}
  values:
    target: dev
    backendDir: '%SCENARIO_TMP%/tofu'
    approval: auto
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
  attestations: [qa]                  # recorded by people with `nyl attest --name qa`
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: prod
spec:
  source:
    promotion: {paths: [dev-to-prod, hotfix-to-prod]}
  unitSelector:
    matchLabels: {prod: 'true'}       # no web-image: prod reuses dev's or the hotfix's
  protectedRefs: [main, 'release/*']  # a hotfix commit is reachable only from release/prod until merged
  values:
    target: prod
    backendDir: '%SCENARIO_TMP%/tofu'
    approval: {mode: manual, bind: plan, requireDigest: true}
  state:
    repositoryRef: {name: platform}
---
apiVersion: gitops.nyl/v1
kind: PromotionPath
metadata:
  name: dev-to-prod
spec:
  from: {environment: dev}
  to: {environment: prod}
  evidence: attested
  values:
    webImage:
      select: {unit: web-image, artifact: image, pointer: /reference}
---
# The hotfix target's own small cluster, so its Applications never share
# names with dev's.
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: hotfix
spec:
  destination:
    server: https://hotfix.example.invalid
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1, v1/Namespace, apps/v1/Deployment]
    clusterScopedKinds: [core/Namespace]
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: hotfix
spec:
  reconciler: {argocd: {}}
  clusterRef: {name: hotfix}
  applicationGroupSelector:
    matchLabels: {app: web}
  catalogApplication:
    syncPolicy: {automated: {prune: true}}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: hotfix
  releaseInputs:
    web/web:
      image: {$unit: {unit: web-image, artifact: image, pointer: /reference}}
      databaseHost: db.hotfix.example.invalid
---
# Follows release/prod, which is cut from what prod runs; nothing points from
# it back to prod but hotfix-to-prod.
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: prod-hotfix
spec:
  source: {revision: release/prod}
  unitSelector:
    matchLabels: {hotfix: 'true'}
  values:
    target: hotfix
    backendDir: '%SCENARIO_TMP%/tofu'
    approval: auto
  state:
    repositoryRef: {name: platform}
  protectedRefs: [main, 'release/*']
  attestations: [qa]
---
apiVersion: gitops.nyl/v1
kind: PromotionPath
metadata:
  name: hotfix-to-prod
spec:
  from: {environment: prod-hotfix}
  to: {environment: prod}
  evidence: attested
  values:
    webImage:
      select: {unit: web-image, artifact: image, pointer: /reference}
