# Every pull request is an instance: its own state under its name in one
# shared ref, its own database, image, and tree, behind one shared catalog.
apiVersion: gitops.nyl/v1
kind: EnvironmentTemplate
metadata: {name: preview}
spec:
  parameters: {pr: {type: integer}}
  unitSelector: {matchLabels: {preview: 'true'}}
  values:
    backendDir: '%SCENARIO_TMP%/tofu'
    networkFrom: dev                      # database reads dev's vpcId
    teardownWait: {strategy: delay, duration: 2m}   # unattended removal
    target:
      inline:
        clusterRef: {name: dev}
        argocdRef: {name: dev}
        catalogApplication:
          shared: {name: previews}   # one self-managing catalog for every instance
        applicationGroupSelector: {matchLabels: {app: web}}
        publication: {repositoryRef: {name: platform}, revision: previews, pathPrefix: '{{ environment.name }}'}
        values: {namespace: '{{ environment.name }}-web'}   # its own namespace; names come from the target name
        releaseInputs:
          web/web:
            image: {fromUnit: {unit: web-image, artifact: image, pointer: /reference}}
            databaseHost: {fromUnit: {unit: database, output: connection, pointer: /host}}
            namespace: {value: '{{ environment.name }}-web'}
  state: {repositoryRef: {name: platform}, path: '{{ environment.name }}', desiredRef: nyl/previews, observedRef: nyl/previews}
  allowUnprotectedSource: true
  keepSource: true                       # opt in: scenario 2 asserts the keep refs
  deletionPolicy: Teardown
  allowTeardown: true
  ttl: 7d
  maxInstances: 2
