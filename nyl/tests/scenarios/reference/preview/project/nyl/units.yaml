apiVersion: units.gitops.nyl/v1
kind: OpenTofu
metadata:
  name: network
  labels: {dev: 'true'}
spec:
  source: {path: ../infra/network}
  backend: {path: '{{ values.backendDir }}/{{ environment.name }}-network.tfstate'}
  outputs:
    vpcId: {type: string}
  timeout: 60m
---
apiVersion: units.gitops.nyl/v1
kind: OpenTofu
metadata:
  name: database
  labels: {dev: 'true', preview: 'true'}
spec:
  source: {path: ../infra/database}
  backend: {path: '{{ values.backendDir }}/{{ environment.name }}-database.tfstate'}
  variables:
    # dev's own network, or the one networkFrom names (a preview reads dev's)
    vpc_id: {fromUnit: {unit: network, output: vpcId, environment: {fromValues: {pointer: /networkFrom, optional: true}}}}
  outputs:
    connection: {type: object}
  timeout: 60m
---
apiVersion: units.gitops.nyl/v1
kind: OciImage
metadata:
  name: web-image
  labels:
    dev: 'true'
    preview: 'true'
spec:
  env: {passthrough: ['%DOCKER_PASSTHROUGH%']}
  context: {path: ../services/web}
  repository: '%REGISTRY%/web'
  timeout: 60m
---
apiVersion: units.gitops.nyl/v1
kind: KubernetesPublication
metadata:
  name: kubernetes
  labels: {dev: 'true', preview: 'true'}
spec:
  target: {fromValues: {pointer: /target}}   # dev, or the preview template's inline target
  teardownWait: {fromValues: {pointer: /teardownWait, default: {strategy: manual}}}
  timeout: 10m
---
apiVersion: units.gitops.nyl/v1
kind: Command
metadata:
  name: seed
  labels: {dev: 'true'}
spec:
  command: [sh, -c, 'mkdir -p "$SCENARIO_TMP"; echo seeded >> "$SCENARIO_TMP/seeded"']
  env:
    passthrough: [SCENARIO_TMP]
