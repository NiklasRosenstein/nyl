# The preview reference project (scenarios 2 and 3 of
# design/reference-scenarios.md): dev runs infrastructure, an image, a seed
# command, and a publication; every pull request gets a preview instance of the
# `preview` template that publishes its own tree beside the others, behind one
# shared catalog Application, and reads dev's network. Tier 1 maps native kinds
# to fakes; the same project runs against the real KubernetesPublication driver.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: dev
spec:
  destination:
    server: https://kubernetes.default.svc
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1, v1/Namespace, apps/v1/Deployment]
    clusterScopedKinds: [core/Namespace]
---
# One Argo CD instance for the cluster, with a catalog whose teardown can
# complete: it prunes the removed workload Applications.
apiVersion: k8s.gitops.nyl/v1
kind: ArgoCDInstance
metadata:
  name: dev
spec:
  clusterRef: {name: dev}
  catalogApplicationDefaults:
    syncPolicy: {automated: {prune: true}}
    labels: {owner: previews}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: dev
spec:
  clusterRef: {name: dev}
  argocdRef: {name: dev}
  applicationGroupSelector:
    matchLabels: {app: web}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: dev
  releaseInputs:
    web/web:
      image: {fromUnit: {unit: web-image, artifact: image, pointer: /reference}}
      databaseHost: {fromUnit: {unit: database, output: connection, pointer: /host}}
      namespace: {value: web}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: dev
spec:
  unitSelector:
    matchLabels: {dev: 'true'}
  values:
    target: dev
    backendDir: '%SCENARIO_TMP%/tofu'
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
