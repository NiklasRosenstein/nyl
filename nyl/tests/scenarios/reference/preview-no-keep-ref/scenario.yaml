# Scenario 2's tier-1 variant "no keep ref": with `keepSource: false` nothing
# keeps the instance's source commit but its branch, so the close job after the
# squash-merge cannot fetch it, fails with the way forward, and succeeds with
# `--source`, which takes the files of every unit, an OpenTofu unit's pinned
# `source` included, from that revision.
contract: design/reference-scenarios.md#scenario-2-preview-closed-with-its-pull-request
milestone: M5
tiers: [1]
project: ../preview/project
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [reconcile, -e, dev]
    exit: 0
  - commit: {branch: main, message: "Keep no source", apply: patches/no-keep}
  - branch: {name: pr-123, from: main}
  - commit: {branch: pr-123, message: "Change the page", apply: ../preview/patches/web}
  - nyl: [reconcile, -e, pr-123, --template, preview, --param, pr=123]
    at: pr-123
    exit: 0
    expect:
      executed: [web-image, database, kubernetes]
      keep-refs: {count: 0}
  - squash-merge: {branch: pr-123, into: main}
  - delete-branch: pr-123

  # The close job cannot fetch the recorded commit: nothing was removed.
  - nyl: [state, delete, -e, pr-123, --teardown]
    exit: 1
    expect:
      codes: [NYL-SOURCE-UNAVAILABLE]
      messages: ['--source']
      deploy: {branch: previews, contains: ['pr-123/web/**']}
  - {nyl: [get, environments, pr-123], exit: 0}

  # With a source named, the files come from main and the removal completes.
  - nyl: [state, delete, -e, pr-123, --teardown, --source, main]
    exit: 0
    expect:
      outcome: done
      codes: [NYL-SOURCE-OVERRIDE]
      removed: [kubernetes, database]
      released: [web-image]
      deploy: {branch: previews, absent: ['pr-123/**']}
  - {nyl: [get, environments, pr-123], exit: 1}
