# The M3 slice of reference scenario 1. Native drivers, templates, and
# promotion references are added by their owning M4-M6 milestones.
contract: design/reference-scenarios.md#scenario-1-platform-environment
milestone: M3
steps:
  - branch: {name: deploy, from: main}
  - commit: {branch: deploy, message: "Keep operator notes", apply: patches/notes}
  - nyl: [reconcile, -e, dev]
    exit: 1
    expect:
      commits: {desired: 0, observed: 0}
  - nyl: [state, init, -e, dev]
    exit: 0
  - nyl: [plan, -e, dev]
    exit: 2
    expect:
      blocked: [database, kubernetes]
      commits: {desired: 0, observed: 0}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [network, web-image, seed, database, kubernetes]
      commits: {desired: 1, observed: 1}
      deploy: {branch: deploy, contains: ['dev/web/**', 'dev/_nyl/index.json', 'dev/state/notes.txt']}
      units:
        network: {uid: new, receipt: current}
        database: {uid: new, receipt: current}
        kubernetes: {uid: new, receipt: current}
        web-image: {uid: new, receipt: current}
        seed: {uid: new, receipt: current}
  - nyl: [status, -e, dev]
    exit: 0
    expect:
      current: [network, web-image, seed, database, kubernetes]
      get:
        args: [get, output, database/connection, -e, dev, --pointer, /port]
        value: 5432
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: []
      current: [network, web-image, seed, database, kubernetes]
      commits: {desired: 0, observed: 0}
      deploy: {branch: deploy, unchanged: ['dev/**']}
  - commit: {branch: main, message: "Change the web page", apply: patches/web}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [web-image, kubernetes]
      current: [network, database, seed]
  - commit: {branch: main, message: "Comment the network module", apply: patches/network}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [network]
      current: [web-image, database, kubernetes, seed]
  - commit: {branch: main, message: "Scale the release", apply: patches/release}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [kubernetes]
      current: [network, web-image, database, seed]
  - branch: {name: typo, from: main}
  - commit: {branch: typo, message: "Mistype the selector", apply: patches/typo}
  - nyl: [plan, -e, dev]
    at: typo
    exit: 0
    expect:
      codes: [NYL-PLAN-UNITS-LEAVING]
      commits: {desired: 0, observed: 0}
  - nyl: [plan, -e, dev, --fail-on-leaving]
    at: typo
    exit: 1
  - squash-merge: {branch: typo, into: main}
  - nyl: [reconcile, -e, dev]
    exit: 2
    expect:
      pending-teardown: [network, database, kubernetes, web-image]
      released: [seed]
      executed: []
      deploy: {branch: deploy, unchanged: ['dev/**']}
  - commit: {branch: main, message: "Restore the selector", apply: patches/restore}
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      executed: [seed]
      current: [network, database, kubernetes, web-image]
      units:
        network: {uid: same, receipt: current}
        database: {uid: same, receipt: current}
        kubernetes: {uid: same, receipt: current}
        web-image: {uid: same, receipt: current}
        seed: {uid: new, receipt: current}
  - nyl: [plan, -e, dev, --teardown, --all]
    exit: 0
    expect:
      commits: {desired: 0, observed: 0}
  - nyl: [state, delete, -e, dev, --teardown, --reason, "decommission dev"]
    exit: 2
    expect:
      tearing-down: [kubernetes]
      released: [seed]
  - nyl: [reconcile, -e, dev]
    exit: 2
    expect:
      executed: []
  - nyl: [teardown, -e, dev, --unit, kubernetes, --confirm-removed, --reason, "checked in Argo CD"]
    exit: 0
    expect:
      removed: [kubernetes]
      deploy: {branch: deploy, contains: ['dev/state/notes.txt']}
  - nyl: [state, delete, -e, dev, --teardown, --reason, "finish decommissioning dev"]
    exit: 0
    expect:
      outcome: done
      removed: [database, network]
      released: [web-image]
  - nyl: [reconcile, -e, dev]
    exit: 1
    expect:
      codes: [NYL-STATE-DELETED]
      commits: {desired: 0, observed: 0}
