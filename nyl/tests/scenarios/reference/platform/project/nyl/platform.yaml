# M3 platform reference project: dev runs infrastructure, an image, a seed
# command, and a publication. Tier 1 maps native kinds to fakes where it scripts
# them; the same project runs against the real KubernetesPublication driver.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: dev
spec:
  destination:
    server: https://kubernetes.default.svc
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions: [v1, apps/v1, v1/Namespace, apps/v1/Deployment]
    clusterScopedKinds: [core/Namespace]
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: dev
spec:
  clusterRef: {name: dev}
  applicationGroupSelector:
    matchLabels: {app: web}
  # A target whose teardown can complete: the catalog prunes the removed
  # workload Applications, and its Namespaces are deleted with them.
  catalogApplication:
    syncPolicy: {automated: {prune: true}}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: dev
  releaseInputs:
    web/web:
      image: {fromUnit: {unit: web-image, artifact: image, pointer: /reference}}
      databaseHost: {fromUnit: {unit: database, output: connection, pointer: /host}}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: dev
spec:
  unitSelector:
    matchLabels: {dev: 'true'}
  values:
    target: dev
    backendDir: '%SCENARIO_TMP%/tofu'
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
