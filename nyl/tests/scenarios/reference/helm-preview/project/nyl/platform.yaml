# The helm-preview reference project (design/reference-scenarios.md): a
# self-hosted platform deploys its own Helm chart for a `develop` environment
# and for every pull request, in one cluster. develop owns the cluster-wide
# pieces (the chart's CRD and its operator); a preview gets them only when its
# pull request asks with `--param crds=true`.
apiVersion: gitops.nyl/v1
kind: GitRepository
metadata:
  name: platform
spec:
  repoURL: '%PROJECT_URL%'
  publishURL: '%PROJECT_URL%'
---
apiVersion: k8s.nyl/v1
kind: Cluster
metadata:
  name: shared
spec:
  destination:
    server: https://kubernetes.default.svc
  kubernetes:
    kubeVersion: 1.31.4
    apiVersions:
      - v1
      - apps/v1
      - rbac.authorization.k8s.io/v1
      - apiextensions.k8s.io/v1
      - v1/Namespace
      - v1/ConfigMap
      - v1/Service
      - apps/v1/Deployment
      - rbac.authorization.k8s.io/v1/ClusterRole
      - apiextensions.k8s.io/v1/CustomResourceDefinition
    clusterScopedKinds:
      - core/Namespace
      - rbac.authorization.k8s.io/ClusterRole
      - apiextensions.k8s.io/CustomResourceDefinition
---
# One Argo CD instance for the cluster, with a catalog whose teardown can
# complete: it prunes the removed workload Applications.
apiVersion: k8s.gitops.nyl/v1
kind: ArgoCDInstance
metadata:
  name: shared
spec:
  clusterRef: {name: shared}
  catalogApplicationDefaults:
    syncPolicy: {automated: {prune: true}}
---
apiVersion: k8s.gitops.nyl/v1
kind: DeploymentTarget
metadata:
  name: develop
spec:
  reconciler: {argocd: {instanceRef: {name: shared}}}
  clusterRef: {name: shared}
  applicationGroupSelector:
    matchLabels: {app: platform}
  publication:
    repositoryRef: {name: platform}
    revision: deploy
    pathPrefix: develop
  values: {namespace: platform}
  releaseInputs:
    platform/platform:
      namespace: platform
      fullname: platform
      host: develop.platform.example.invalid
      image: {$fromUnit: {unit: platform-image, artifact: image}}   # read by pointer in the chart values
      clusterWide: true                      # develop owns the CRD and the operator
      chartValues: {ingress: {className: internal}}
      # The release tooling writes the channel develop follows back to the
      # deploy branch; until it does, the Release's default applies.
      channel: {$fromPublication: {path: state/release.json, pointer: /channel}}
---
apiVersion: gitops.nyl/v1
kind: Environment
metadata:
  name: develop
spec:
  unitSelector:
    matchLabels: {develop: 'true'}
  values:
    target: develop
  state:
    repositoryRef: {name: platform}
  allowUnprotectedSource: true
