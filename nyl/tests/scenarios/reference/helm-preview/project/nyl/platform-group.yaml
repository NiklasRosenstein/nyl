apiVersion: k8s.gitops.nyl/v1
kind: ApplicationGroup
# Block-style labels: a group whose spec is templated is selected by labels
# read before it renders.
metadata:
  name: platform
  labels:
    app: platform
spec:
  applicationNamespace: argocd
  source: {path: ../applications/platform}   # beside nyl/
  # Names per target, so previews never collide with develop or each other.
  applicationNameTemplate: '${ target.metadata.name }-${ release.metadata.name }'
  destinationNamespace: '{{ values.namespace | default("platform") }}'
  projectTemplate:
    name: '{{ target.metadata.name }}-platform'
    destinations: [{server: '*', namespace: '{{ values.namespace | default("platform") }}'}]
  namespace: {prunePolicy: Automatic, deletePolicy: Automatic}
