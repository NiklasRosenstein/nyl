apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  CHANNEL: {{ .Values.channel | quote }}
  PUBLIC_HOST: {{ .Values.host | quote }}
  INGRESS_CLASS: {{ .Values.ingress.className | quote }}
  # The kind of value Helm received: bool only if the value kept its type.
  OPERATOR_INSTALL_KIND: {{ kindOf .Values.operator.install | quote }}
  settings.yaml: |
    {{- toYaml .Values.settings | nindent 4 }}
