apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform.fullname" . }}
    spec:
      containers:
        - name: platform
          image: {{ include "platform.image" . }}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
