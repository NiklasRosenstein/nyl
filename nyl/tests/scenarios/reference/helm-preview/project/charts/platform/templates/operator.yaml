{{- /* The operator reconciles the cluster-wide Platform resources: one per
cluster, so only the deployment that owns the CRD installs it. */ -}}
{{- if .Values.operator.install }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-operator
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform.fullname" . }}-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform.fullname" . }}-operator
    spec:
      containers:
        - name: operator
          image: {{ include "platform.image" . }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
{{- end }}
