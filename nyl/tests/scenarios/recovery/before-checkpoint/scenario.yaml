# Crash injection: killed before web-image's checkpoint, after network's.
contract: design/orchestration-core.md#runs-and-leases
milestone: M3
tiers: [1]                            # scripts faults
project: ../../walkthroughs/_project
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - fault: {point: before-checkpoint, unit: web-image}   # finished, never checkpointed
  - nyl: [reconcile, -e, dev]
    killed: true
  - clock: {advance: 69m}             # one minute before wave 1's deadline: 60m timeout plus 10m grace
  - nyl: [reconcile, -e, dev]
    exit: 2                           # the dead run's lease and run ref are still within their deadline
    expect:
      codes: [NYL-LEASE-HELD]
      commits: {desired: 0, observed: 0}
  - clock: {advance: 2m}              # past the deadline
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      imported: [network]             # checkpointed before web-image's result
      recovered: [web-image]          # finished without a checkpoint: converged
      executed: [database, kubernetes]
      commits: {desired: 1, observed: 1}
      units:
        network: {condition: null, receipt: current}
        web-image: {condition: null, receipt: current}
        database: {condition: null, receipt: current}
        kubernetes: {condition: null, receipt: current}
