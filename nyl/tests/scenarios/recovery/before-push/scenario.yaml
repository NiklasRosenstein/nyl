# Crash injection: killed before the final transition commit is pushed.
contract: design/orchestration-core.md#runs-and-leases
milestone: M3
tiers: [1]                            # scripts faults
project: ../../walkthroughs/_project
steps:
  - nyl: [state, init, -e, dev]
    exit: 0
  - fault: {point: before-push}       # every unit checkpointed, nothing pushed
  - nyl: [reconcile, -e, dev]
    killed: true
  - clock: {advance: 39m}             # one minute before the deadline of the last resolution, which found nothing left: 30m plus 10m grace
  - nyl: [reconcile, -e, dev]
    exit: 2                           # the dead run's lease and run ref are still within their deadline
    expect:
      codes: [NYL-LEASE-HELD]
      commits: {desired: 0, observed: 0}
  - clock: {advance: 2m}              # past the deadline
  - nyl: [reconcile, -e, dev]
    exit: 0
    expect:
      imported: [network, web-image, database, kubernetes]   # every result was checkpointed
      recovered: []
      executed: []
      commits: {desired: 1, observed: 1}
      units:
        network: {condition: null, receipt: current}
        web-image: {condition: null, receipt: current}
        database: {condition: null, receipt: current}
        kubernetes: {condition: null, receipt: current}
