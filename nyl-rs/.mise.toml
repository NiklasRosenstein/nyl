# Mise configuration for nyl-rs
# See: https://mise.jdx.dev/
#
# NOTE: Configuration has been merged into root /mise.toml
# This file is kept for reference during transition period.
# All tasks should now be run from the repository root with `mise run <task>`
# instead of from this directory.

[tools]
# Rust toolchain
rust = "1.93.0"

# Cargo extensions for development and release
"cargo:cargo-dist" = "latest"
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-audit" = "latest"
mdbook = "0.4.52"

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy linter"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --all-features"

[tasks.test-verbose]
description = "Run tests with output"
run = "cargo test --all-features -- --nocapture"

[tasks.bench]
description = "Run benchmarks"
run = "cargo bench"

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks.build-dist]
description = "Build with dist profile"
run = "cargo build --profile dist"

[tasks.check-all]
description = "Run all checks (fmt, lint, test)"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo test --all-features",
]

[tasks.coverage]
description = "Generate code coverage report"
run = "cargo tarpaulin --out Html --output-dir coverage"

[tasks.security-audit]
description = "Run security audit"
run = "cargo audit"

[tasks.dist-init]
description = "Initialize cargo-dist configuration"
run = "dist init"

[tasks.dist-build]
description = "Build release artifacts with dist"
run = "dist build"

[tasks.dist-plan]
description = "Show dist release plan"
run = "dist plan"

[tasks.docs-build]
description = "Build mdbook documentation"
run = "mdbook build book"

[tasks.docs-serve]
description = "Serve mdbook documentation"
run = "mdbook serve book --open"

[tasks.docs-rustdoc]
description = "Generate Rust API documentation"
run = "cargo doc --no-deps --open"

[tasks.size-check]
description = "Check binary size"
run = "ls -lh target/release/nyl && du -h target/release/nyl"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.pre-commit]
description = "Run pre-commit checks"
depends = ["fmt-check", "lint", "test"]
