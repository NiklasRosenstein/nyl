[package]
name = "nyl"
version = "0.1.0"
edition = "2021"
authors = ["Niklas Rosenstein"]
description = "Kubernetes manifest generator with Helm integration"
license = "MIT"
repository = "https://github.com/NiklasRosenstein/nyl"

[[bin]]
name = "nyl"
path = "src/main.rs"

[lib]
name = "nyl"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Templates
minijinja = { version = "2.5", features = ["builtins", "custom_syntax"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# YAML - Using serde_norway (YAML 1.2, actively maintained)
serde_norway = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kubernetes
kube = { version = "0.95", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.15"
dirs = "5.0"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"

[[bench]]
name = "template_rendering"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
